games:
- set: rltennis
  name: Reality Tennis
  mame_driver: tch/rltennis.cpp
  page:
    board: "[the first blitter board](../boards/reality-tennis.md), with a single 68000 at 8 MHz"
    year_note: " (`⚠` recreativas.org dates it 1994)"
  manufacturer:
    value: TCH
    level: verified
    evidence: macro GAME of rltennis.cpp
  year:
    value: '1993'
    level: verified
    evidence: 'macro GAME of rltennis.cpp: GAME( 1993, rltennis, ...)'
    discrepancy: 'recreativas.org dates it 1994. Both sides checked on 2026-08-04. MAME''s is the one
      published, being a primary source (the emulator itself), but the discrepancy is declared rather
      than hidden: nothing available settles it, and the ROM carries no year.'
    sources:
    - https://www.recreativas.org/reality-tennis-540-tch
  mame_status:
    value: works, with imperfect graphics and timing
    level: verified
    evidence: MACHINE_IMPERFECT_GRAPHICS | MACHINE_IMPERFECT_TIMING | MACHINE_SUPPORTS_SAVE
  driver_status:
    value: works, with imperfect graphics and timing
    level: verified
    evidence: MACHINE_IMPERFECT_GRAPHICS | MACHINE_IMPERFECT_TIMING | MACHINE_SUPPORTS_SAVE
  authors:
  - role: sole authorship
    who: David Sandoval, Antonio A. Carrillo
    level: verified
    evidence: 'hidden signature in rltennis_maincpu 0x001000, repeated four times and written identically
      in both ROMs: "ESTE JUEGO HA SIDO INTEGRAMENTE REALIZADO POR DAVID SANDOVAL Y ANTONIO A. CARRILLO."  Reproduce
      it with `uv run scripts/signatures.py --image rltennis_maincpu`'
  variants:
  - set: rltennis
    mame_name: Reality Tennis (set 1)
    program_rom:
    - tennis_1.u12
    - tennis_2.u19
    plds:
    - realitytennis_gal22v10.u20
    board: the original revision, with two Actel A1020B FPGAs
    level: verified
    evidence: ROM_START(rltennis) and the PCB layout in the header of tch/rltennis.cpp
  - set: rltennisa
    mame_name: Reality Tennis (set 2)
    program_rom:
    - tennis_1_a.bin
    - tennis_2_a.bin
    plds:
    - gal16v8.ic23
    - gal22v10.ic2
    board: PCB marked TCH-MAVIR.001, with two TI TPC1020AF instead of the Actel ones, labelled JOAQUIN (A)
      and JUANA (B)
    level: verified
    evidence: ROM_START(rltennisa) and the comment preceding it in tch/rltennis.cpp
  differences_between_variants:
    summary: 'Set 2 is the SAME program with a patch: 308 bytes different out of 1048576, that is
      0.029%, over seven stretches. The graphics and the samples have identical CRCs.'
    level: verified
    evidence: byte for byte diff of disasm/img/rltennis_maincpu.bin against rltennisa_maincpu.bin
    observed:
      rltennis_track: 'six stretches of RGB triplets between 0x12658 and 0x127f5 swap the court''s
        greens for olive and straw tones: 0x457035 becomes 0x6f6e52 and 0x807d4d. On screen, 75.40%
        of the pixels of frame 1120 differ between the two sets'
      rltennisa_counter: 'a 509-byte stretch from 0x00fa03 in which every odd-addressed byte is
        shifted by +4. On frame
        300 the only difference between the two sets is an 8x9 px box at x 296..303, y 217..225,
        0.08% of the screen, which is the credit counter''s digit: set 1 shows CREDITS 0 and set 2
        only CREDITS'
