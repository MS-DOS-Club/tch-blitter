rejected:
- datum: TCH SA founded in Murcia in 1993
  reason: The company register gives its incorporation as 1990-05-09 (CIF A30148233, Beniajan, Murcia).
    The two blogs saying 1993 cite no source.
  date: '2026-08-04'
- datum: Wheels & Fire is from 1993
  reason: 'A single source (museodelrecreativo.es) against every other one: MAME writes 199?, the year
    field at recreativas.org is empty and arcade-history does not pin it down either.'
  date: '2026-08-04'
- datum: the 24-12-1996 timestamp of the romset files dates the ROMs
  reason: That is the date of the file inside the zip, not of the ROM. wheelfir, kongball and other sets
    share it, so it is from when they were packed.
  date: '2026-08-04'
- datum: Sator Videogames = SATOR VIDEOGAMES S.L. (incorporated in 1999)
  reason: 'Probably a namesake, not an identification. Three reasons, and one of them was WEAKENED on
    2026-08-04; it is said rather than kept quiet. (1) A single, secondary source. (2) Incorporated after
    the board''s time, and with no mention of TCH. (3) "A different sector, PC compilations", which no
    longer weighs as much: there is MEASURED precedent in this very family, because MAME credits Kong
    Ball to TCH alongside Digital Dreams Multimedia, a Spanish PC studio that DID make a prototype for
    this company. With (1) and (2) standing the rejection holds, but the sector argument no longer carries
    it on its own.'
  date: '2026-08-04'
- datum: the Wheels & Fire credits are drawn as graphics
  reason: 'False, and a measurement refuted it: the fourteen fields are plain ASCII from 0x0e3894.'
  date: '2026-08-04'
