- set: radendur
  name: Radical Enduro
  # In the pinned MAME this set lives inside tch/wheelfir.cpp. This repository's own driver,
  # tch/radendur.cpp, is a separate thing: this field says what is in MAME, not what is here.
  mame_driver: tch/wheelfir.cpp
  page:
    board: "[the Wheels & Fire board](../boards/wheels-and-fire-board.md#one-design-two-layouts), layout A"
    driver_here: "**its own driver**, `tch/radendur.cpp`"
    sets_note: " (the dump, which hangs on its own faults); `radendurv2`, a clone whose maincpu ROM has them fixed, its sound block placed where the finished siblings place it and, as an enhancement that is not the board's behaviour, its full scenery drawn, built from the dump by `make v2`"
    status_note: ": a comment in its driver says that some courses reach gameplay but crash quickly"
  manufacturer:
    value: TCH / Sator Videogames
    level: verified
    evidence: macro GAME of radendur.cpp
    nuance: 'What is VERIFIED is that MAME writes it this way, not that the attribution is backed. Looked
      into on 2026-08-04: the whole chain (MAME''s macro, recreativas.org and whatever copies them) goes
      back to ONE single observation, the logo drawn on the boot screen, with no independent corroboration.
      The MAME PR that introduced the chain cites no source. There is no date, no place, not a single
      person and no other title: the developer entry lists exactly this game. And there is NO ASCII string
      "SATOR" anywhere in the set''s 18 ROMs, checked with `uv run scripts/signatures.py`. The attribution
      is published because it is MAME''s, with this warning beside it, which is more honest than repeating
      it flat. Seen on 2026-10-14: the same name is also drawn on the trackside banners of the race
      (docs/img/radendur/detail/detail_L0_seg0_start_desert.png, rendered from the ROM), which is the
      game''s own graphics again, not a corroboration.'
    not_exhausted:
    - The OEPM trademark search (a POST form, not reachable automatically). A "SATOR" trademark in class
      9 or 28 between 1993 and 1998 would give a holder, an address and dates, which is exactly what is
      missing. A manual query, still pending.
    - BORME. The full-text search at boe.es only covers 2009 onwards and the free mirror returns 403.
    warning: MATCHING THE NAME IS NOT IDENTIFYING. There are at least four Spanish companies called "Sator"
      with no relation between them (the name comes from the Latin SATOR AREPO square). None of them enters
      as a fact without evidence tying it to this board.
  year:
    value: null
    level: unknown
    evidence: MAME writes 199? in the GAME macro. Its two code ROMs hold not one readable text, so there
      is no internal copyright to take it from either
  mame_status:
    value: NOT_WORKING (early prototype)
    level: verified
    evidence: MACHINE_NOT_WORKING | MACHINE_IMPERFECT_GRAPHICS
  driver_status:
    value: NOT_WORKING (early prototype), the dump hangs on its own faults; the radendurv2 clone,
      its maincpu ROM fixed (plus full scenery, not the board's) and built from the dump, finishes a
      race with its music at its real 16 MHz
    level: verified
    evidence: MACHINE_NOT_WORKING | MACHINE_IMPERFECT_GRAPHICS | MACHINE_SUPPORTS_SAVE
  authors: []
