    name: snd_isr_mixer_ram
    description: 'The mixer''s RAM copy, 0x201060..0x201345. It is the one that executes and the only
      one that gets patched. Conversion: RAM = 0x201060 + (ROM - 0x554).'
    level: verified
    evidence: 0x40a `lea 0x201060,a1` and the IRQ1 vector at 0x064 = 0x201060.
  - addr: 2101346
    name: snd_v1_opcode
    description: 'Sub-CPU (RAM). Voice 1''s read opcode, patched live: 0x1e11 = `move.b (a1),d7` (with
      a phase accumulator) or 0x1e19 = `move.b (a1)+,d7` (one sample per IRQ, the octave above). The six
      are at 0x201062, 0x2010ce, 0x201082, 0x2010ee, 0x2010a4 and 0x201110'
    level: verified
    evidence: reset 0x43c; application 0x674; the wheelfir main CPU chooses between the two forms at 0xdabb2-0xdabca
  - addr: 2101354
    name: snd_v1_table
    description: 'Sub-CPU (RAM). Operand of voice 1''s `movea.l #imm,a0`: the base of its volume table.
      The six: 0x20106a, 0x2010d6, 0x20108a, 0x2010f6, 0x2010ac, 0x201118'
    level: verified
    evidence: reset 0x44c `move.l 0x4842, 0x20106a.l`; application 0x664
    type: data
  - addr: 2101364
    name: snd_v1_step
    description: 'Sub-CPU (RAM). Operand of voice 1''s `addi.w`: the phase increment in Hz. The MODULUS
      (0x3d09 = 15625, the rate of IRQ1) sits at 0x201078 and is NEVER patched'
    level: verified
    evidence: reset 0x444; application 0x67a; `cmpi.w 0x3d09` in ROM at 0x56a with the immediate at 0x56c
  - addr: 2101562
    name: snd_tail_slot
    description: 'Operand of the mixer''s final `jmp`: the command machine''s state pointer. Possible
      values, all in RAM: 0x20113e (idle), 0x201154 (voices 1-2), 0x2011c8 (voices 3-4), 0x20123c (voices
      5-6), 0x2012b0 (awaiting block), 0x2012cc (receiving word).'
    level: verified
    evidence: Reset at 0x532; chained at 0x63c, 0x6b0, 0x724, 0x798, 0x7b4 and 0x7d8. Each one translates
      to ROM with ROM = 0x554 + (RAM - 0x201060).
  - addr: 2102008
    name: snd_v1_reload
    description: 'Sub-CPU (RAM). Voice 1''s loop pointer: operand of the `movea.l` in the end-of-sample
      epilogue. The six: 0x2012f8, 0x201322, 0x201306, 0x201330, 0x201314, 0x20133e (a1..a6)'
    level: verified
    evidence: reset 0x430; application 0x65a; consumed at 0x7ea
