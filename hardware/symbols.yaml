  - addr: 1580
    name: snd_isr_tail_jmp
    description: '`jmp (X).l` with X patchable in RAM at 0x20113a: it is the command machine''s state pointer.
      Each tail chains itself by writing the next one there before its `rte`.'
    level: verified
    evidence: 'Bytes 4e f9 ff ff ff ff at 0x62c; the reset initialises it with `move.l #0x20113e, 0x20113a`
