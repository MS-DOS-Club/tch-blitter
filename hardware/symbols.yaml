  radendur_maincpu:
  - addr: 1024
    name: irq_vblank
    description: 'Vblank handler (level 3 vector). Besides its own work, at 0x4a0 it does `andi.w #$f8ff,($10,A7)`
      + `ori.w #$2000,($10,A7)` on the SR SAVED ON THE STACK: it leaves the rte with the MASK AT 0, which
      lets the blitter IRQ1 in, and at 0x4b2 it installs 0x1f2a as the level 1 handler (the main loop does
      the same at 0xf216e..0xf2176). When 0x2091ee is set it calls state_advance (0x484); the SR rewrite
      and the install then run only if 0x20795c is 0. It counts frames at 0x203200/0x2031fc'
    level: verified
    evidence: 'READ: vector 0x6c holds 0x400; 0x4a0/0x4a6 rewrite the stacked SR, 0x4b2 stores 0x1f2a at
      0x20f91a, 0x484 jsr state_advance; executed in the radendur attract trace (disasm/executed/radendur_maincpu.txt)'
  - addr: 1286
    name: page_bit_compose_a
    description: 'lsr#3/andi 0x20/or -> move.b d1,0x700011: the visible page bit'
    level: verified
    evidence: 'READ: 0x500..0x508 shift bit 8 of 0x207976 into bit 0x20 and write it to 0x700011; executed
      in the radendur attract trace (disasm/executed/radendur_maincpu.txt)'
  - addr: 1312
    name: arm_line_counter
    description: 'Arms the 0x7a0000 line counter (together with 0x538). MEASURED with `RE_RASTERLOG` (switch
      WITHDRAWN): it writes 1 near the vblank, and the level 5 vector jumps to the trampoline 0x20f908 ->
      0x203164'
    level: verified
    evidence: 'READ: 0x520 and 0x538 write 1 to 0x7a0000, 0x516 stores 0x203164 as the level 5 trampoline''s
      operand (vector 0x74 -> 0x20f908); executed in the radendur attract trace (disasm/executed/radendur_maincpu.txt)'
  - addr: 1820
    name: page_bit_compose_b
    description: 'Composes the page bit exactly as page_bit_compose_a, inside a level 5 line handler of
      its own (0x5d0 installs 0x640 as the level 5 operand; the analysis never reaches the bytes there)
      that adds a cursor at 0x2091ec to the y scroll, re-arms the line counter with 0x10 and returns by
      its own rte at 0x780; not part of the vblank, which ends at 0x59a. A chain the game never enters:
      neither 0x5d0 nor 0x71c runs'
    level: verified
    evidence: 'READ: 0x71c or.w d3,d1 / 0x71e move.b d1,0x700011, 0x762 move.w #0x10,0x7a0000, 0x780 rte,
      0x5d0 move.l #0x640,0x20f90a; MEASURED 2026-10-13: never executed in 3000 frames of the dump''s attract
      (control 0x4a0, 2977 hits) nor in a radendurv2 race trace'
  - addr: 7978
    name: irq_blitter
    description: 'IRQ L1 handler (blitter), target of the RAM trampoline 0x20f918, which the main loop installs
      by writing its operand at 0x20f91a. MEASURED 2026-08-03: turning the driver''s courtesy IRQ1 off completely,
      the game does NOT reach the menu at any clock, so the drawing chain does not start itself and that
      interrupt is indispensable'
    level: verified
    evidence: 'READ: 0x1f32 loads the entry pointer at 0x209430 and calls blit_program, rte at 0x1f40; vector
      0x64 -> trampoline 0x20f918 armed at 0x266e; executed in the radendur attract trace (disasm/executed/radendur_maincpu.txt)'
  - addr: 8002
    name: irq1_last_blit
    description: 'Level 1 handler installed by 0x2516 when the list runs out: it fires the blit prepared
      at 0x209461 and calls 0x22bc, which enqueues the next one or declares the queue empty'
    level: verified
    evidence: 'READ: installed at 0x251a when walk_list finds a zero entry; dumps the block at 0x209461
      into the blitter, fires 0xffff at 0x1f80 and calls enqueue_next; executed in a radendurv2 race trace
      of 2026-10-13 (main cpu, 5026 frames from a cold boot through scripts/drive.lua)'
  - addr: 8084
    name: irq1_chain
    description: 'Level 1 handler of the chain: it writes the blitter registers from the parameter block
      at 0x209439, fires the blit (0xffff to 0x70001e, at 0x1fd2) and calls 0x23f2 to prepare the next entry.
      MEASURED: on the balloon screen EVERY blit comes out of this 0x1fd2, one per interrupt'
    level: verified
    evidence: 'READ: writes the block at 0x209439, fires 0xffff at 0x1fd2 and calls walk_list; installed
      by blit_program at 0x208c; executed in the radendur attract trace (disasm/executed/radendur_maincpu.txt)'
  - addr: 8166
    name: irq1_terminal
    description: 'TERMINAL level 1 handler, and the other half of the mechanism: it does `andi.w #$f8ff,(A7)`
      + `ori.w #$2100,(A7)` on the stacked SR, so it leaves the rte with the MASK AT 1, which BLOCKS IRQ1.
      With that the chain stops by itself until the next vblank, without anyone having to deassert anything'
    level: verified
    evidence: 'READ: rewrites the stacked SR to mask 1 (0x1fea/0x1fee), clears 0x209438 and the busy byte
      0x209460, rte; executed in the radendur attract trace (disasm/executed/radendur_maincpu.txt)'
  - addr: 8196
    name: blit_program
    description: 'Dumps ONE 24-byte entry of the drawing list to 0x700000-0x70001e (ptr at 0x209430) and
      fires with 0x70001e=0xffff. It is the CHAIN''s emitter: one IRQ1 = one blit. MEASURED 2026-08-03:
      at 16 MHz one blit comes out per SCANLINE (the 57 of frame 1200 fall on lines 224..284, one per line);
      at 8x it is 7-8 per line'
    level: verified
    evidence: 'READ: writes one 24-byte entry (pointer 0x209430, advanced by 0x18 at 0x205a) to 0x700000..
      and fires at 0x2052, with variants for the mode words; its entry and the mode paths executed in the
      radendur attract trace (disasm/executed/radendur_maincpu.txt)'
  - addr: 8892
    name: enqueue_next
    description: Prepares the next blit in the queue (0x203514 = cursor, 0x203518 = end). With the two pointers
      equal the queue is empty and it jumps to 0x23dc
    level: verified
    evidence: 'READ: compares the cursor 0x203514 with the end 0x203518 (equal -> queue_empty), sets the
      busy byte 0x209460 and builds a block at 0x209461; the attract trace takes only its empty-queue exit,
      the build ran in a radendurv2 race trace of 2026-10-13 merged into disasm/executed/radendur_maincpu.txt'
  - addr: 9180
    name: queue_empty
    description: 'Queue empty: it lowers the busy flag (0x209460) and installs 0x1fe6 as the level 1 handler,
      which is the one that closes the chain'
    level: verified
    evidence: 'READ: clears the busy byte 0x209460 and installs 0x1fe6 as the level 1 operand; executed
      in the radendur attract trace (disasm/executed/radendur_maincpu.txt)'
  - addr: 9202
    name: walk_list
    description: Walks the drawing list and prepares the next entry at 0x209439. With the entry at zero
      (end of list) it jumps to 0x2516
    level: verified
    evidence: 'READ: reads the entry at *0x20f760 into the block at 0x209439; a zero first word goes to
      0x2516 (installs 0x1f42); executed in the radendur attract trace (disasm/executed/radendur_maincpu.txt)'
  - addr: 9522
    name: list_finished
    description: 'End of the drawing list: it lowers the channel flag (0x2091a4 + 16*channel) the main loop
      waits on, and enqueues the palette job at 0x207988 that the vblank consumes'
    level: verified
    evidence: 'READ: clears the channel flag at 0x2091a4+16*channel the main loop polls (0xf21a2), posts
      the palette job at 0x207988, toggles bit 8 of 0x20f770 at 0x2584; executed in the radendur attract
      trace (disasm/executed/radendur_maincpu.txt)'
  - addr: 9636
    name: exception_handler
    description: 'Address-error handler, the only ROM vector that points here (0x0c; the bus-error and the
      unused vectors go to the rte at 0x25a2): saves the frame at 0x20f8f4, fills the RAMDAC with grey,
      infinite loop at 0x25d4'
    level: verified
    evidence: 'READ: vector 0x0c holds 0x25a4, 0x08 and 0x60..0x7c hold 0x25a2 (rte), 0x64/0x74 the RAM
      trampolines, 0x6c the vblank. MEASURED live 2026-10-13 on radendurv2: with A1 odd, clr.w (a1) at 0xf2210
      stops at a breakpoint on 0x25a4 and never at 0x25a2, after 300 healthy frames that touched neither
      (control 0x4a0)'
  - addr: 9692
    name: boot_init
    description: 'Boot initialisation called from reset (0xf2040): clears RAM from 0x201000, calls the sound
      initialiser 0xf24d0, zeroes the RAMDAC, arms the level 5 and level 1 trampolines (0x20f908 -> 0x782,
      0x20f918 -> 0x1f2a) and issues four clear blits to 0x700000'
    level: verified
    evidence: 'READ: 0x25e8 clear loop, 0x25fa jsr 0xf24d0, 0x265c/0x266e jmp trampolines, blits at 0x2688..0x2808,
      called from 0xf2040; executed in the radendur attract trace (disasm/executed/radendur_maincpu.txt)'
  - addr: 10326
    name: mode_clear_blits
    description: The same four clear blits to 0x700000 as boot_init, each followed by a delay loop; called
      again from the main loop (0xf186a, under FUN_000dfaf4)
    level: verified
    evidence: 'READ: the four clear blits of boot_init with the same constants, each followed by a delay
      loop; called from 0xf186a; executed in the radendur attract trace (disasm/executed/radendur_maincpu.txt)'
  - addr: 879378
    name: palette_range_table
    type: data
    description: 'The palette ranges palette_range_copy walks: 95 four-byte entries, byte 2 the first
      colour and byte 3 the count (0 means 256), each entry''s data offset held in the first word of the
      NEXT one (0x8611 - 0x8314 = 3 x 255 closes entry 94). None of the 95 passes colour 256, so no valid
      index overflows the 768-byte buffer; read as entries, the bytes from index 95 on are RGB data, and
      several of those would'
    level: verified
    evidence: the 95 entries decoded from disasm/img/radendur_maincpu.bin, start + count <= 256 in every
      one (2026-09-24)
  - addr: 929278
    name: displaylist_walker
    description: Walks a grid of cell pointers (step 0x20 in x and y), clears bit 0 of each node's first
      byte and appends (tile id, x, y) word triples to the object list at *0x203510, storing the advanced
      cursor back; A6 is its link frame (four stack arguments)
    level: verified
    evidence: 'READ: 0xe2e06/0xe2e0c load 0x20350c and 0x203510, 0xe2e7e bclr #0,(a3), 0xe2ea6 move.w d0,(a0)+,
      0xe2ec8 stores a0 to 0x203510; executed in a radendurv2 race trace of 2026-10-13 (main cpu, 5026 frames
      from a cold boot through scripts/drive.lua)'
  - addr: 929494
    name: palette_range_copy
    description: 'Copies palette range N of palette_range_table into the buffer at 0x203208: 3 bytes per
      colour from 0x203208 + 3 x start, skipped when N is the one it copied last (re_pal_range_last).
      It overflows into the display-list cursors at 0x203508 only for an index outside the table, and
      the one source of such an index is the environment loop at 0xe15f0 reading one prop past its array.
      With that loop corrected no index leaves the table, so a relocation of that buffer is a second guard
      on the same prototype fault and is not part of the fix (retired 2026-09-24)'
    level: verified
    evidence: 'live, relocation undone and the environment loop corrected, five playable sections (0,
      1, 2, 4, 8): no stop on an index >= 0x5f in about 7700 calls per section, a census of re_pal_range_last
      holding 0..94 only, no exception in 6000 frames each. With the loop NOT corrected as well, the race
      entry hangs (188 copies instead of ~7700) and 0x203500..0x20350f holds the 16 ROM bytes at 0xdad17,
      the only place in the image they occur'
  - addr: 941316
    name: section_dispatch_table
    type: data
    description: 'A table of 45 pointers (0xe5d04..0xe5db7) that ends EXACTLY where the code of init_section_and_dispatch
      begins (0xe5db8), so an index of 45 or more reads instructions and takes them for pointers. MEASURED
      per section: section 0 asks for 18 and 0 (valid); section 6 asks for 4608, section 9 for 1014, section
      10 for -31206, section 12 for 17183 and section 14 for 210, and those FIVE are exactly the ones
      that blow up before drawing the race. The PC ends up in the unmapped gap (measured: 0x11f598) walking
      straight ahead until a bus fault enters through 0x25a2, which in this game is an rte: it returns
      to the instruction that faulted and refaults for ever'
  - addr: 941496
    name: init_section_and_dispatch
    description: 'Prepares the section: clears two 1024-word arrays (0x201e64 and 0x202664) and then JUMPS
      THROUGH THE TABLE without checking the index. It reads `(*(0x201006))->field_0xc4`, multiplies it
      by 4 and jsrs to section_dispatch_table[index]'
    level: verified
    evidence: 'READ: clears the two 1024-word arrays at 0x201e64/0x202664, then jsr (a0) through the table
      indexed by *(0x201006)+0xc4 with no bounds check (0xe5e0c..0xe5e22); executed in a radendurv2 race
      trace of 2026-10-13 (main cpu, 5026 frames from a cold boot through scripts/drive.lua)'
  - addr: 965508
    name: object_update
    description: 'Entity logic: a state machine over the struct at *0x201006 (fields 0x62/0x8c/0xa4 off
      a0) that calls fixed helpers through a register loaded with lea (jsr (a2)/(a3)) and restarts itself
      with jsr object_update when its state changes. The largest function (6KB)'
    level: verified
    evidence: 'READ: 0xebc86/0xebbd2/0xebb9e test the fields; 0xebd18 lea 0xdfa6c,a2 / jsr (a2), 0xebe1e
      lea 0xe23b4,a2 / jsr (a2); 0xebf0a jsr object_update; executed in a radendurv2 race trace of 2026-10-13
      (main cpu, 5026 frames from a cold boot through scripts/drive.lua)'
  - addr: 991284
    name: reset
    description: 'Entry/boot: init + main loop (state machine)'
    level: verified
    evidence: 'READ: vector 0x04 holds 0xf2034; 0xf2040 jsr boot_init, SR 0x2100 at 0xf2106, then the
      wait_loop at 0xf2132; executed in the radendur attract trace (disasm/executed/radendur_maincpu.txt)'
  - addr: 991538
    name: wait_loop
    description: 'The main loop, which is a BUSY WAIT on the channel flag. MEASURED with a PC histogram
      during the race: the CPU spends 64.4% of the frame here at 16 MHz and 95.6% at 8x. It is not drawing,
      it is waiting'
    level: verified
    evidence: 'READ: both branches of the loop (0xf2118 and 0xf21a4) go to 0xf2132, `move.w sr,-(a7)`;
      0xf2130 is the low word of the operand of `clr.w $203202.l` at 0xf212c, which decodes as `move.w
      d2,d1` only when decoding starts there. MEASURED live on 2026-10-13 with MAME''s tracer over the
      attract, the hot vblank address on the same cpu present in the trace as the control: 0xf2132 executes
      and 0xf2130 never does, in the dump''s attract and in a radendurv2 race'
  - addr: 991760
    name: crash_site
    description: clr.w (a1) with a1=*(0x203510); an odd pointer raises an address error, whose handler 0x25a4
      paints the grey screen
    level: verified
    evidence: 'READ: 0xf220a movea.l 0x203510,a1 / 0xf2210 clr.w (a1). MEASURED live 2026-10-13: an odd
      a1 there enters 0x25a4; executed in the radendur attract trace (disasm/executed/radendur_maincpu.txt)'
  - addr: 991876
    name: state_advance
    description: 'Advances the state: stores d0 at 0x207958 and, when the channel flag at 0x2091a4+16*(d0&3)
      is set, loads 0x209430, 0x2094e8 and 0x20f760 from row d0&3 of the ROM table at 0xf1fd4 and clears
      0x20795c, else sets it to 1. Called from the main loop AND from the vblank (race)'
    level: verified
    evidence: 'READ: 0xf2288 move.w d0,0x207958; 0xf22ae..0xf22ba load 0x209430/0x2094e8/0x20f760; callers
      0x484, 0xf215e, 0xf2256; executed in the radendur attract trace (disasm/executed/radendur_maincpu.txt)'
  - addr: 992214
    name: sound_start_block
    description: 'A level 5 entry that starts a sound block: sends the 0xffff marker to the subcpu, puts
      49 in the sample counter (0x202e86), ARMS THE LINE COUNTER WITH 100 (0x7a0000) and sets bit 13 of
      0x20351c, which writes to the control port, then rte. Nothing in the ROM points to it, and the game
      never enters it: the vblank''s own block start (0x520) arms the counter with 1'
    level: verified
    evidence: 'READ: 0xf23d6 move.w #-1,0x740000, 0xf23de 0x31 to 0x202e86, 0xf23e6 0x64 to 0x7a0000, rte
      at 0xf2424; no reference to 0xf23d6 in the image; MEASURED 2026-10-13: never executed in 3000 frames
      of the dump''s attract (control 0x4a0, 2977 hits) nor in a radendurv2 race trace'
  - addr: 992318
    name: re_snd_stream_src
    description: radendur main. Source of the raster handler that emits the burst, copied to RAM 0x203164
      (by 0xf2426). It emits 0xA0A0 on iteration 49 and one word of the block on each of the remaining
      48, SELF-PATCHING its pointers and erasing what it has sent
    level: verified
    evidence: 0xf243e-0xf24ce; the absolute operands of 0xf2476 and 0xf2480 are rewritten at 0x20319c
      and 0x2031a6, which is the copy displaced by 0x110d26
    runs_from: 2109796
  - addr: 992326
    name: sound_streamer_rom
    description: 'The sample streamer, in ROM; it is copied to RAM (0x203164) so it can SELF-MODIFY. It
      sends one sample per line to the subcpu latch and advances its pointer by incrementing the OPERAND
      of its own instructions (0x20319c and 0x2031a6), 49 firings per block. It touches no register, which
      saves the whole movem in an interrupt that fires once per line. And that is what makes it fragile:
      overrunning the pointer corrupts instructions, not data'
    level: verified
    evidence: 'READ: copy loop 0xf2426..0xf243a (0xf243e..0xf24d0 to 0x203164); 0xf2474 move.w 0x20300c,0x740000,
      operands patched at 0xf2476/0xf2480; its RAM copy 0x203164.. executed in a radendurv2 race trace of
      2026-10-13 '
    runs_from: 2109804
  - addr: 2109062
    name: re_snd_sample_count
    description: 'radendur main (RAM). The sample counter of the sound block: set to 49 when a block opens
      (0x530 from the vblank handler, 0xf23de from sound_start_block), decremented once per line by the
      streamer (0x2031b6, the RAM copy of 0xf246c/0xf2490) and compared against 49 to detect the first
      entry of a block (0xf2446). Below zero the streamer has overrun its buffer'
    level: verified
    evidence: the four writers and the one comparison above, in disasm/listings/radendur_maincpu.lst
  - addr: 2110748
    name: re_snd_ctrl_shadow
    description: 'radendur main (RAM). Shadow of the control port 0x7c0000: the byte copied to the port
      after every change. Bit 13 is set when a sound block opens (0x548) and bit 12 when it closes
      (0xf24a0), both cleared together by the andi.w #0xcfff that precedes each, so the line counter,
      which bit 13 enables, runs only while a block streams; bits 8-10 drive the EEPROM'
    level: verified
    evidence: 0x540-0x550 and 0xf23ee-0xf23fe (open), 0xf2498-0xf24a8 (close), 0x2600-0x2624 (init 0xd8)
  - addr: 2110982
    name: re_pal_range_last
    description: radendur main (RAM). The palette range palette_range_copy applied last; the copier returns
      at once when asked for it again. 0xe2c4a writes 0xffff here to force the next copy
    level: verified
    evidence: writers 0xe2f00 (the copier) and 0xe2c4a (the 0xffff reset), from a write census over a
      race; values 0..94 plus that marker
  - addr: 2109452
    name: re_snd_block
    description: 'radendur main (RAM). radendur''s 96 command bytes: six 16-byte registers at 0x20300c,
      1c, 2c, 3c, 4c, 5c. Exactly the same format as wheelfir''s'
    level: verified
    evidence: 0xf2850-0xf286e write the volume table (field +8) into 0x203014, 24, 34 and 44; 0xf2474
      emits from 0x20300c
  - addr: 2109796
    name: irq5_streamer_ram
    description: 'The level 5 handler, copied to RAM by the game. It is a sample streamer that SELF-MODIFIES
      and re-arms the counter line by line. Its pointers (0x20319c, 0x2031a6) advance +2 per firing and
      the sample counter 0x202e86 underflows below zero: after about 172 words the pointer walks into
      the handler''s own code and clr.w''s it. MEASURED with `RE_SINRASTER` (switch WITHDRAWN) on (the
      earlier `RE_RASTER` (switch WITHDRAWN) never existed) and no guard: an address error before the
      menu'
  - addr: 2128252
    name: re_pal_start
    description: 'Read alongside re_pal_arg (0x203206) by the palette probe, which labelled it "start".
      It is NOT confirmed to be the starting index of the palette upload: that is all that is known about
      it. It is recorded because the probe that watched it was withdrawn on 2026-08-04 as superseded,
      and that address appeared NOWHERE else in the tree'
  - addr: 2160920
    name: irq1_trampoline
    description: 'The IRQ1 trampoline in RAM: a `jmp abs.l` whose OPERAND (0x20f91a) the game rewrites
      to change handler on the fly. Vector 0x64 points here'
  wheelfir_maincpu:
  - addr: 1024
    name: wf_zoom_desc_x
