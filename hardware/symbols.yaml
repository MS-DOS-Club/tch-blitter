  radendur_subcpu,wheelfir_subcpu,pwball_subcpu:
  - addr: 0
    name: sub_rom
    description: ROM code + sound samples (0x000000-0x0fffff)
  - addr: 1024
    name: snd_reset
    description: 'Sound CPU reset. It masks IRQs, copies 0x554..0x839 (742 bytes) to RAM 0x201060, clears
      the command buffer 0x201000..0x20105f, initialises the 6 voices (pointer and loop to 0x83a, table
      0x4842, step 0x3d09) and falls into a `bra` to itself: all the work happens in IRQ1.'
    level: verified
    evidence: '0x400..0x542. The 24 patches were re-derived from the raw bytes by looking for 0x33fc/0x23fc
      between 0x43a and 0x542; the copy loop is at 0x410 with `cmpa.l #0x83a,a0`; MEASURED 2026-10-13: executed
      in a cold-boot sound-cpu trace of radendur'
  - addr: 1348
    name: snd_soft_reset_stub
    description: Stacks PC=0x400 and SR=0x2700 and does an `rte`, that is, a soft jump to the reset. NO
      vector points at it.
    level: verified
    evidence: '0x544..0x54e. A sweep of the 256 vectors (0x000..0x3fc): only 0x201000, 0x400, 0x550 and
      0x201060 appear; MEASURED 2026-10-13: not executed in a cold-boot sound-cpu trace nor in 1500 frames
      of attract; established by reading'
  - addr: 1362
    name: snd_rte_stub
    description: A bare `rte` that 252 of the 256 exception vectors point at. The TRACE one (0x024) points
      at its twin at 0x550.
    level: verified
    evidence: 'Count over the binary: {0x552: 252, 0x201000: 1, 0x400: 1, 0x550: 1, 0x201060: 1}.'
  - addr: 1364
    name: snd_isr_mixer
    description: 'The whole mixer, and it is the IRQ1 handler. It is copied to RAM 0x201060 because it SELF-MODIFIES:
      24 slots (read opcode, table base, step and loop pointer, for each of the 6 voices) plus the target
      of the final `jmp`. 742 bytes, byte for byte identical in wheelfir, pwball and radendur.'
    level: verified
    evidence: 'Vector 0x064 = 0x201060; copy loop at 0x410. The three subcpu dumps are identical from 0x0
      to 0x4946 (re-verified); MEASURED 2026-10-13: its RAM copy executes in a sound-cpu trace of the radendurv2
      attract'
    runs_from: 2101344
  - addr: 1466
    name: snd_mix_out_l
    description: 'Dumps the sum of voices 1+3+5 to the left DAC. `move.w d7, 0x700000.l`, a 16-bit word
      of which the DAC uses the low 10 bits. No saturation and no clipping: the sum of three bytes cannot
      pass 765, and that is why the DAC is 10 bits.'
    level: verified
    evidence: 'Bytes at 0x5ba: 33 c7 00 70 00 00. Between the `add.w` at 0x596 and 0x5b8 and this write
      there is no other instruction; MEASURED 2026-10-13: its RAM copy executes in a sound-cpu trace of
      the radendurv2 attract'
    runs_from: 2101446
  - addr: 1574
    name: snd_mix_out_r
    description: 'Dumps the sum of voices 2+4+6 to the right DAC. `move.w d7, 0x740000.l`. The stereo split
      is FIXED by register: there is no pan field anywhere.'
    level: verified
    evidence: 'Bytes at 0x626: 33 c7 00 74 00 00, preceded by `clr.w d7` at 0x5c0; MEASURED 2026-10-13:
