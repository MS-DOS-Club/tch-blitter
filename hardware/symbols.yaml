      with truncation towards zero. v=0 is silence (all 0x80) and v=64 is the identity. Linear volume
      in 65 steps of 1/64.
    level: verified
    evidence: 'Validated byte for byte: the 65 tables x 256 entries match that formula, 65/65. The floor
      and ceil variants get only 1 and 2 of 65 right.'
    type: data
