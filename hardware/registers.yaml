      observed:
        wheelfir_the_scale_range_is_closed_at_25_399: 'THE BLITTER''S SCALE RANGE IS CLOSED AT
          [25, 399), and that is what answers the third leg of the board author''s account, the one
          nothing had replied to: that the rest of the range comes from PRE-SCALED ART IN THE GFX
          ROM. It is a consequence of the two clock bits already confirmed beside this entry, and it
          was DERIVED on 2026-09-15 without MAME, from the driver''s own zoom_index[400] table: the
          base band 50..200 is the bare stall counter (1/2 to 2), clock_halve (word 9, bits 0-1)
          takes it down to 25..49 and clock_double (word 8, 0x1000/0x2000) up to 201..399, so the
          silicon spans exactly a factor of four each way and cannot leave it, and neither can the
          driver''s counters, whose slowest pair is 1/2 x 1/2 and fastest 2 x 2. So a graphic that appears at a scale
          outside that window is ALREADY SCALED in the ROM and the blitter is copying it 1:1.
          The decode was checked by an independent route from the 2026-09-05 measurement, which read
          the ROM descriptors: the low 12 bits of the descriptor for scale p and for scale 2p are
          IDENTICAL in 25 of 25 cases across the clock_halve band and 199 of 199 across the
          clock_double band, 224 of 224. CONTROL, which is what makes that number mean anything:
          inside the base band, where neither bit is set, the same relation holds 0 of 51 times, and
          the table carries 105 distinct low fields, so the match is not an artefact of the fields
          being alike. NO DRIVER CHANGE: this names what the hardware can do, it does not move a
          pixel.'
        wheelfir_the_law_is_a_stall_counter: 'THE SCALING LAW IS A STALL COUNTER, and that is the
          board author''s account CONFIRMED against the game''s own tables on 2026-08-12. His words
          were that a 5 in the register makes the counter run normally for four clock ticks and stop
          on the fifth, so one pixel in five is lost and the zoom comes out at 80%; that stalling the
          VRAM side gives the zooms below 100% and stalling the ROM side those above it; and that the
          rest of the range comes from combining the two FPGAs with pre-scaled art in ROM. MEASURED
          by walking the map (2x + first table[x] - second table[...]) >> shift for each scale and
          reading the STEP between consecutive source coordinates, which is where a stall shows: at
          scale 80 the step is 1 in 204 places and 0 in 51, with the zeros exactly every FIVE; at 75
          every four; at 50 every two. Above 100% the rare step is 2 rather than 0, which is
          REPEATING instead of skipping, and it lands with the same periods: every five at 120, every
          two at 150. Scales 60, 90 and 95 come out with MIXED periods ({2,3}, {13,7}, and three
          distinct step values), which is the combination he describes rather than a single counter.
          The known-answer control is the one the driver already carries and it passes in the same
          run: scale 100 is the identity and 200 is exactly double over all 256 columns.'
        rltennis_a_blit_stays_inside_its_source_whatever_encodes_the_ratio: 'MEASURED on 2026-10-14
          at the pin 74b9fae5, every blit logged over 120 s of attract and of play (scripts/drive.lua)
          on both sets. The register values that decode to 1/1 without being zero, 0x8080 (4 blits a
          run, both sets, a 1x1 source stretched to 255x255) and 0x0004 (set 2 only, 395 blits in the
          attract: the spinning ball at (96,64), eight frames whose sources are 117 to 122 columns
          wide in a 125 or 126 column box), all have a destination longer than their source. Held
          inside the source span the ball is clean; walked on past it as 0x0000 was, the same frames
          match pixel for pixel until frame 423, where one dark pixel at (221,179) comes from the
          ROM column past the tile. So every blit is held inside its source span, 0x0000 included:
          480 captures, every 50th frame of 100 s of attract and of play on both sets, are pixel for
          pixel those of the previous driver (control: 102 to 113 of the 119 successive pairs of each
          run differ).'
        rltennis_the_same_law_in_one_word: 'THE EARLIER BOARD CARRIES THE SAME SCALING LAW, in a
          single register, and that is MEASURED on 2026-09-15 on a live debug session of rltennis
          rather than inherited from the family. Reality Tennis writes its scale to 0x70000a, the
          register its MAME driver documents as "unknown (used during gameplay ... zoom factors ?)"
          and asks about in its own TODO. The value comes from word 5 of a seven-word display-list
          descriptor in RAM (stride 14 bytes, walked through the pointer at 0x20c004 / 0x20d004, the
          two lists the game alternates) and is written by the blit dispatcher at 0x4dc, ALWAYS
          preceded by a write of 0x0000 to the same register, which is the counters being reset
          before they are loaded. Read as two bytes whose nibbles repeat, A in the high byte and B in
          the low, THE SCALE IS (A+1)/(B+1): the ratio of the two FPGA rates, which is the board
          author''s pair of stall counters written directly instead of through a percentage table.
          MEASURED over 35484 blits logged from one pass (attract, the menus and a match), in which
          the register takes exactly THREE values: 0x0000 (A=0, B=0, 1/1) on 33734 of them, 0x2233
          (A=2, B=3, 3/4) on 1740, and 0x1122 (A=1, B=2, 2/3) on 10. Against the source and
          destination spans of each blit, counted inclusively as the driver counts them, the law
          predicts the destination span to within one pixel on 20 of 20 axis measurements at 0x1122
          and 3399 of 3435 at 0x2233. CONTROL, which is what makes those numbers mean anything: the
          same prediction made by the driver''s CURRENT model, which is the identity at every scale,
          scores 0 of 20 and 0 of 3435. And the known-answer control passes in the same run: 0x0000
          is the identity, median measured ratio 1.0000 on 61322 axis measurements.
          WHAT THIS DOES NOT ESTABLISH, said because the law is wider than the evidence: the game
          only ever asks for REDUCTIONS, so the enlarging direction of (A+1)/(B+1), which needs A
          greater than B, is PREDICTED and not measured, and no such value was seen. Where the three
          constants are stored was not settled either: they do appear in the maincpu ROM, but a raw
          word search is not a discriminating instrument over a 1 MB image that also holds data, and
          its control says so, a well-formed value the game never writes (0x0011) appearing 765
          times. And 19.3% of the identity blits have a destination span that does not match their
          source span, which this register does not explain and which is the rect-clipping question
          the same TODO asks separately; it is not clipping, see
          rltennis_spans_are_8_bit_forward_distances.
          IMPLEMENTED on 2026-09-26 in this repository''s rltennis.cpp (patch 0005): at a non-zero
          value a blit walks its declared destination, without the widening to the source span
          the driver marks as wrong, and destination step d reads source step d*(b+1)/(a+1) in
          integer arithmetic, a and b the high nibbles of the two bytes, one ratio for both axes,
          held at the end of the declared source span; at 0x0000 the old path was left as it was
          then, and on 2026-10-03 every span, scaled or not, became the 8-bit law of
          rltennis_spans_are_8_bit_forward_distances and the widening went. The
          phase (which steps repeat or skip) is not measured. The hold is there because the law
          is exact only to a pixel: in 202 of 1019 scaled blits logged, all vertical, the
          destination is one step longer than the ratio gives and its last step would read one
          row past the source the game declared; where that row holds opaque pixels (the blits
          of frames 791 and 793 of the match, shown three frames later) the build without the
          hold draws 4 of them under the far player''s shoe and the build with it does not, and
          the goldens are the same with and without it. In 793 the overshoot of the upper half
          reads source row 3241, which is exactly the row the lower half draws on the same
          destination row, so it is invisible there by construction. A fourth value appears that the pass above did not log: 0x8080, written once
          at startup by 0x20e2 and fired on four background fills (source 1x1) in frames 48 to
          63; its nibbles do not repeat, the driver says so once and uses the high ones, 1/1, and
          on a fill the widening never applied, so those frames are unchanged.
          A fifth, 0x0004, fires on 79 blits of rltennisa''s attract (frames 391 to 683): its
          high nibbles give 1/1 and none of those blits had a source wider than its
          destination, so the skipped widening changes none.
          MEASURED A/B on 2026-09-26 against a build of the untouched driver, same input replayed
          (coin at frame 600, start at 800): the blit commands of both builds are identical line
          for line (4855), so any pixel difference is the driver''s. The control frame 700, whose
          census of 0x70000a holds two writes, both 0x0000, is byte-identical, and so is frame 48.
          The first scaled blits of the match, 0x2233 from frame 770 on, go to the hidden
          sprite half and are shown three frames later (proved by a single event: the hold below
          changes the snapshots of 794 and 795 only, and only the blits of 791 and 792 carry an
          opaque overshoot): the snapshots at 773 to 778 differ in
          710 to 770 pixels each, and every differing pixel lies inside the union of those blits''
          old drawn area and declared destination; the same check pointed at snapshots of two
          different frames reports pixels outside, which is what makes the zero mean anything.
          The far player drawn at 3/4 now stands inside its own shadow, where the widened blit
          drew it larger. The goldens 01_game of rltennis and rltennisa (frame 900 of the
          attract, which carries 0x2233 blits in frame 897) moved by 868 and 875 pixels, all
          inside the same union, and were re-blessed; their other scenes are byte-identical.
          Since 2026-10-14 the hold applies to every blit, 0x0000 included:
          rltennis_a_blit_stays_inside_its_source_whatever_encodes_the_ratio.'
        rltennis_spans_are_8_bit_forward_distances: 'THE UNSCALED BLITS WHOSE SPANS DIFFER ARE NOT
          CLIPPED: every walk of the earlier board ends where the low 8 bits of its counter reach
          the end coordinate, so a span is (end - start) & 0xff in the walk''s own direction, on
          the source and on the destination. MEASURED on 2026-10-03 over a raw log of every blit
          strobe (a write tap on 0x700000..0x70000f, decoded as rltennis.cpp decodes it), frames 0
          to 2262 from a cold boot, attract then coin at 1200, start at 1341 and the first rally,
          on both sets: of the unscaled blits that are not one-pixel fills, 34780 on rltennis and
          33758 on rltennisa, the driver''s own spans (abs() of the difference, and (-w)^0xff for a
          destination x written below its start) disagree with the source span on 12195 in each
          set. Under the 8-bit law the source and destination spans are EQUAL on every x walk and
          on every y walk but one group: 31070 of 34780 equal on both axes (30048 of 33758), and
          the other 3710 in each set are the bottom strip of the court background (destination
          rows 218 to 254, source 38 rows), whose destination span (36) is two short of its source
          span (38), on rows 255 and 256 that the screen does not show. The x disagreements (7115) are all sprites crossing x=255, for
          which (-w)^0xff counts one step less than the wrap; the y ones are the upper court
          strips, whose source end is written BELOW its start (source row 4135 to 4096 for
          destination rows 1 to 218), i.e. a 217-row walk the old abs() read as 39 and the widening hid. The
          source ADDRESS does not wrap with the counter: a build that wrapped it inside the
          256-row quarter drew a dark line on row 217 of rltennisa''s court at frames 2179 and
          2182 that the linear address does not, so only the end comparison is 8-bit.
          APPLIED in rltennis.cpp: spans by the law, the widening of the destination to the source
          span removed. A/B against the previous driver, live captures by a frame notifier at 56
          frames of the same pass on each set (300, 900, every frame 938 to 975, 1120, 1200, 1500,
          1800, 2100, every frame 2174 to 2183, 2262): 43 byte-identical on each set, and 13 that
          differ only in ONE column at x 257 to 272, the far player at 3/4 crossing x=255 in two
          blits; the column is court in the old build and the player''s edge in the new, and the
          law (24 source columns at 3/4 are 18) gives 18 where the old count gave 17. Control:
          two frames of the same build differ by 76800 pixels. The goldens of both sets pass
          unchanged, 6 of 6. Since 2026-10-14 a destination longer than its source holds the
          source''s last step instead of reading past it:
          rltennis_a_blit_stays_inside_its_source_whatever_encodes_the_ratio.'
        wheelfir_spans_are_9_bit_forward_distances: 'WHEELS & FIRE DECLARES EVERY WALK SO THAT THE
          9-BIT FORWARD DISTANCE AND THE PLAIN DIFFERENCE AGREE, EXCEPT ON THE TORUS WRAPS. MEASURED on
          2026-10-03 on wheelfir, the earlier board''s method (rltennis_spans_are_8_bit_forward_distances)
          with nine bits: a write tap on 0x70001c..0x70001f logged words 0..14 at every fire, with the
          word-14 fill mark kept since the last arming as the driver keeps it, over the golden pass
          (boot to frame 1500 of the attract, 18131 fires, the count of the 2026-09-28 capture; the
          control 0xe52f0 counted 14979 over the golden pass on each capture of it) and over a played race (coin at 1500, start,
          car select, the map, then 1500 frames with the pedal and button 1 held, frames 1500 to
          3664 of the log: 46617 fires; the
          replay of the same inputs gave the same count and a byte-identical last frame). Each walk''s
          destination span was computed two ways, abs(end - start) and (end - start) x direction &
          0x1ff, the second being what wheelfir.cpp counts (steps_x, steps_y). The expanded board has
          no source end coordinate, so unlike the earlier board there is no source span to compare
          against. Of the 60914 walks (16429 and 44485; the 8 direct-write openings and the 3826
          word-14 fills excluded), the two counts agree on both axes on 60899. The 15 that disagree
          are all FORWARD walks whose end lies below their start, that is walks round the 512 torus:
          10 erases (word 7 bit 3 alone, x 498..511 to 1..14, 15 columns, 8 on the background and 2
          on the sprite plane), the presentation car slice of frame 317 (background, x 471 to 38, 79
          columns, unwrapped end 550, wheelfir_blits_past_the_clip_window), and four background blits
          of the car-select screen at frame 1712 (y 462 to 35, 85 rows). No sprite-plane blit that is
          not an erase walks out of 0..511 on either axis, and no walk is declared backwards past its
          end, so no residue of the clip-window investigation is a miscount of this kind; the 932 is
          still not reproduced (the largest unwrapped end in both passes is 550). NO DRIVER CHANGE:
          the driver already counts the law and wraps exactly the planes and kinds that need it.
          WHAT THIS DOES NOT ESTABLISH: that the board counts this way rather than by the difference.
          With no source end to compare and no walk declared past its end, the two readings differ
          only on the wraps, where the background torus already decides it; and how the sprite plane
          treats a drawing walk that leaves it, since none does here (only the two erases).'
        radendur_walks_off_the_sprite_plane: 'RADICAL ENDURO WALKS OFF ITS SPRITE PLANE, AND ON THE X
          AXIS ITS LEFT EDGE IS DRAWN ONLY IF THE WALK WRAPS. MEASURED on 2026-10-03 with the census of
          wheelfir_spans_are_9_bit_forward_distances on radendur: a cold boot with the coin held at
          frames 240..280, START on the selection screen (frame 389 by the frame notifier, screen
          state 3), section 0 with the accelerator held, logged to frame 2399 by the frame at each
          fire (162466 fires, 2384 word-14 fills, no direct-write opening; control: the vblank
          handler''s chain-opening path 0x4a0 hit 2377 times and the exception handler 0x25a4
          never). Of 160082 walks, the forward distance and the plain difference agree on 158615.
          The other 1467 blits, all on the sprite plane and all fired at 0x1fd2 in the chain
          irq1_chain, walk out of 0..511: 930 on y (all forward, from page 1 past row 511, unwrapped
          ends 512 to 539, so wrapped their last rows land on rows 0..27 of page 0), 544 on x, 7 of
          them on both axes. On x, the 303 backward walks start on screen and wrap onto columns 352..511,
          off it; the 241 forward ones start at x 505..511 and end on x 0..31, so the visible part of
          each is the part the 9-bit counter carries round. CONTROL, an experiment build of
          radendur.cpp that clips the sprite plane as wheelfir.cpp did then (the walk still counted,
          writes outside 0..511 dropped): over frames 1700 to 1760 of the same drive it differs from
          the wrapping driver in 48 of 61 captures, every differing pixel at x 0..30 (3 to 79 per
          frame), and opened, the clipped capture is missing the sand strip at the left edge beside
          the bike; in frames 600 to 620, where no x walk wraps, the 10 captures that differ do so
          only on rows 0..7 (54 to 321 pixels), the y case. So the game declares its left-edge
          strips from x 505 and relies on the counter wrapping to draw them: on x the plane wraps.
          WHAT THIS DOES NOT ESTABLISH: the y case, where the wrapped rows land on the top rows of
          the other page and the captures cannot say which is right. Wheels & Fire does not reach the
          case with a drawing blit (its clipper pins sprites at xmin 0; only two erases wrap there),
          so its own game neither confirms nor refutes its driver''s clip. radendur.cpp already wraps;
          APPLIED to wheelfir.cpp, so both drivers wrap the sprite plane on x. On y the case stays
          unmeasured, and on 2026-10-09 wheelfir.cpp was made to wrap too, by decision (one board,
          one model, y the same 9-bit counter as x) and not by measurement; its seven wheelfir
          scenes, the two validated race goldens among them, came out byte-identical. MEASURED
          after, over one credit per set from a cold boot (a write tap on 0x70001e counting
          sprite-plane drawing blits whose y walk leaves 0..511): Wheels & Fire 0 of 488398 to
          frame 15000, Kong Ball 0 of 1358677 to frame 30000, and Power Ball 31564 of 1049264 to
          frame 15000, all from 0xeb0a and 0xeb5c (15782 each, the first at frame 1371), each
          walking down to y -1, a row the wrap puts on row 511, the last of page 1, which is
          outside the 252 lines shown; the family goldens are byte-identical. The 15 scenes
          of the three sets wheelfir.cpp drives came out byte-identical at the x change.'
        rltennis_the_scale_phase_is_not_established: 'WHICH SOURCE PIXEL A SCALED BLIT DROPS
          (the phase of the stall counter) IS NOT ESTABLISHED, and the game''s own code cannot
          establish it. MEASURED on 2026-10-03 over the same blit logs as
          rltennis_spans_are_8_bit_forward_distances, both sets with the same counts: a counter
          that keeps a+1 of every b+1 source pixels and drops the one at position k gives
          n - #{i < n : i mod (b+1) = k} destination pixels for n source pixels, a different count
          per k unless n is a multiple of b+1. The destination count the game declares for each
          scaled blit (1248 at 3/4, 16 at 2/3) matches every k alike on x, because every source
          width it asks for is a whole multiple of the period; on y it matches every k alike on
          790 of 1248 at 3/4 and is one off all of them on the other 458 (213 short, 245 long).
          So the game sizes its art so that the phase never changes a count, and no count it
          writes can tell the phases apart. The driver keeps the integer law, which drops the
          last of each period, as a model choice said in its comment. What could still settle it
          is a capture of a real board showing a scaled sprite with a one-pixel feature, or the
          recollection of somebody who built the FPGAs.'
        rltennis_the_picture_starts_at_1_1: 'THE ONE-COLOUR COLUMN AT x=0 OF REALITY TENNIS IS
          BORDER, NOT PICTURE: in the scenes logged (attract, coin, start, the first rally) the game
          never aims art at screen column 0 or row 0, and the picture it draws starts at (1,1). MEASURED on 2026-10-03 over the same blit logs as
          rltennis_spans_are_8_bit_forward_distances, against the gfx ROM, on both sets with the
          same counts. Its full-screen pictures are drawn in two halves anchored at destination
          (1,1): the title photo reads source x 0..254 into columns 1..255 and 257..321 into a
          right-half walk that starts at 255, so its first pixel lands on bitmap column 511 and
          the rest on 256..319. Row 0 receives no opaque pixel from any blit in 2262 frames.
          Column 0 receives one only in the 786 frames where a sprite crosses x=255: the game
          splits it into a left-half blit that ends one step past 255, whose last pixel the 8-bit
          counter puts on column 0, and a right-half blit that starts one step before 256, whose
          first pixel lands on column 511, each a duplicate of a column the other blit draws in
          its place. So both overspill columns hold copies, which the game can only leave there
          because they are not on screen. The one colour that column 0 showed (black at boot, a
          different dark colour per ROM revision in play) was pen 0 of the current palette,
          because the driver discarded every write to column 0 and row 0. APPLIED in
          rltennis.cpp: the visible area starts at (1,1), still 320x240, and the discard is
          gone. A/B against the previous build, 9 live frames from boot into the first rally:
          the new screen equals the old one moved by one pixel, 0 differing pixels on all 9 in
          the overlap, and column 0 now carries 35 to 58 colours where it carried one. The six
          goldens were re-blessed: each new capture is the previous golden moved by (1,1), 0
          differing pixels in the overlap. WHAT THIS DOES NOT ESTABLISH: the right edge. The
          title photo ends on column 319, so with 320 columns its last column (bitmap 320) is
          pen 0, while the court is drawn out to column 325; neither fixes the last visible
          column. The bottom edge is the field geometry''s question. The visible area starting a
          row lower also moves the start of vblank down one line: the cycle count at frame 2263
          moves by 36 out of 301733361, and every frame compared is still the old one moved by
          (1,1); the screen''s set_size makes no difference to it (512x256 and 321x241 measure
          the same).'
        wheelfir_the_picture_starts_at_column_0: 'THE EXPANDED BOARD''S PICTURE STARTS AT COLUMN 0,
          not at (1,1) as on the earlier board (rltennis_the_picture_starts_at_1_1). MEASURED on
          2026-10-03 over the two blit logs of wheelfir_spans_are_9_bit_forward_distances, against the
          gfx ROM, replaying the driver''s 1:1 walk. The anchored edge: the title''s flame strip is
          drawn at x 0..335 from source columns 115..450 of page 0, and in the ROM columns 114 and 451
          are empty on every row the blit reads while 115 and 450 carry the art (6 to 10 colours), so
          a picture exactly 336 columns wide is placed with its first column on column 0 and its last
          on 335; opened in a live capture, the flames reach both edges of the 336-pixel screen.
          Over the 50962 unscaled sprite-plane blits of both passes, replayed at the edges, columns
          0..2 and 333..335 receive non-zero pixels (column 0 from 11254 writes, the sprites the
          clipper pins to xmin 0) and column 336 none.
          WHAT THIS DOES NOT ESTABLISH: the top edge. No sprite-plane blit draws on page rows 0..3 in
          either pass (the only blits covering rows 0 and 1 are the 2x2 kick of the main loop at
          (0,0), whose source pixels are 0), and the background plane is read through the scroll and
          its three-row read-ahead (withdrawn since: wheelfir_the_three_rows_withdrawn). NO DRIVER CHANGE: the visible area already starts at (0,0).'
        radendur_the_picture_starts_at_0_0: 'RADICAL ENDURO DRAWS ITS FULL-SCREEN PICTURE WITH ITS
          FIRST COLUMN AND ROW AT BITMAP (0,0), DECLARING THE SOURCE ONE ROW ABOVE THE ART. MEASURED on
          2026-10-03 over the blit log of radendur_walks_off_the_sprite_plane, against the gfx ROM: the
          only image in endu.u57 (page 0xa) holds non-zero pixels on rows 0..254 and columns 0..339
          exactly (rows 255 and 511 and column 340 empty), and the selection screen draws it 18 times
          in frames 392 to 409, from source (0, 511), alternately on the two sprite pages: (0,0) to
          (339,254) on odd frames and (0,256) to (339,510) on even ones. Its declared source start is
          the empty row just above the art, so with the 1:1 read one row further in (the seam rule,
          and wheelfir_first_source_row_is_a_transparent_border) the 255 rows of the walk read the
