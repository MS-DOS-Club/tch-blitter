          of 0x70001e: the capture took 143739 trigger writes, the stops none. NEITHER PATH OF
          WF_ARM_REGISTER RUNS IN THE RACE: a second pass over the same frames with unconditioned
          controls on its entry 0xe5584 and on 0xe55b4 and 0xe567c counted 0, 0 and 0, beside
          65859 hits of the sprite dispatcher 0xe52f0 in the window; after the race, from frame
