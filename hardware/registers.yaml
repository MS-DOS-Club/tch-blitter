      the driver: the seven Wheels & Fire goldens and the fourteen of the siblings stay byte for
      byte. What the latch loads is a ROW COUNTER that advances one row per line: the scenery
      band is written once, on line 0, and shows consecutive rows of the plane. The same order holds
      in the other two ROMs, read the same day: Power Ball 0xf4c4 -> 0xf4ce and 0xf696 -> 0xf69e,
      Kong Ball 0x28896 -> 0x2889c, each Y a few bytes behind its X.'
    description: 'High byte: more scale data. Low byte: vertical background SCROLL.'
