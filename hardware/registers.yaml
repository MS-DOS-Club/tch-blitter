          bit 8), lies above the rectangle''s xmax (0x20b4bc) or below its xmin (0x20b4b8) as they
          read at that trigger. No decoded field exceeds 511, so the one quantity that could ever
          read 932 is an UNWRAPPED end: x0 plus the scaled width before it is cut to nine bits,
          which is the D4 that WF_ARM_REGISTER (0xe5584) forms at 0xe55b0 and stores as a byte plus
          bit 8, the same number as the driver''s walk dst_x0 + steps_x before the torus wrap (at
          most 1022). Words 0..15 of the block and the four words of the rectangle were captured at
          every write of the trigger (0x70001e): 36261 rows and 18131 fires (0xffff), the counts of
          the 2026-09-26 capture above; the rectangle read (0, 0, 336, 255) at 18126 fires and (0,
