        wheelfir_frame_budget: 'MEASURED ON THIS BOARD on 2026-07-31 instead of inherited from Radical
          Enduro, which was what remained pending. And with a SYMPTOM closed, not just a number: the
          budget shows up as frames in which the game EMITS NOT ONE SPRITE BLIT. In the attract race
          demo (frames 962..2705) there are 20 such frames at nominal clock and ONE at `CPUX` (switch WITHDRAWN)=4.
          Nineteen of the twenty pile into the demo''s first 36 frames and the other is 1836, which is
          exactly the frame the HUD series gate reports as dropped (the 1837 capture comes out with
          the sprite plane entirely empty: no HUD, no car, no signs). So the residual tremble,
          artefact D, is not a composition problem: it is the game skipping a frame. Counting blits
          per frame: in the race (1100..1200) the median is 22 at nominal clock, 22 with the raster
          IRQ removed (`SINRASTER` (switch WITHDRAWN)=1) and 23 at CPUX=4, that is a 4% margin. In the High Scores
          (2700..2900) the median is 8 and the maximum 83 at nominal clock, 24 and 111 without the
          raster IRQ, and 64 and 149 at CPUX=4: there the raster IRQ DOES cost, and that is NOT
          inherited from Radical Enduro, where it was measured not to. It makes sense: here the
          per-line writer fires at vpos 1..255 during the attract. And the cost is the GAME''s, not
          ours: 500 cycles of 68000 pass between two consecutive blitter firings, and setting up a
          blit is 18 writes, that is 27.8 cycles per write, which is what a MOVE.W #imm,(xxx).L costs
          (24 cycles) plus the thread around them. That is the INSTRUMENT VALIDATION against a known
          answer, and it was needed because a 500 pinned as both median and p90 forces you to ask
          first whether the instrument quantises. Our blitter consumes not one emulated cycle, so it
          cannot be part of the budget: asking for 150 blits per frame is 75000 of the 266666 cycles a
          68000 gives at 16 MHz and 60 Hz just to write its registers, before counting what the game
          does'
        wheelfir_artefact_D_residual_tremble: 'ARTEFACT D (sprites that still tremble in the race),
          MEASURED on 2026-07-30 and ATTRIBUTED, not fixed. Over 101 race frames (1100..1200) the HUD
          is STABLE: the median change between consecutive frames is ZERO. ONE frame is left, 1170,
