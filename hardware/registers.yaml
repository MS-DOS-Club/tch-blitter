          the same single bad frame and breaks 2 goldens on top. Also MEASURED that the E2 clearing
          fix does not touch the race: both criteria give IDENTICAL images across the 101 frames. It
          stayed ATTRIBUTED to the frame budget, and on 2026-07-31 it was CLOSED by measuring the
          mechanism: the bad frames are frames on which the game EMITS NOT ONE SPRITE BLIT. They are
