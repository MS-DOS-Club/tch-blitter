      stating its build in its own log. Every main write to 0x740000 and every sub read of 0x780000
      logged by taps with its frame, line and pixel in the line, 0 callback errors, and sorted in
      time. radendurh, both builds: 304451 main writes, 1885245 sub reads, 3 writes overwritten
      before any sub read (all on lines 138..140 of frame 12, the boot), 0 block reads (pc 0x2012da)
      with no write since the previous one; the block words written at pixels 65 to 213 of the line
      (99% by 108) and read at pixels 222 to 340 of the same line; the two streams differ only on
      the vblank lines, where the sub''s header poll (0x201146, 0x2012b8) sees the 0xffff written on
      that line one line later under the synchronised latch; seconds with more than 16 distinct DAC
      values, 119 of 122 on both. The dump: plain register 8 of 122 s with sound, 287169 writes
      overwritten, 302 block reads with no write between; synchronised latch 6 of 122, 292360 and
      7; its five boot goldens unchanged'
    pwball_the_sub_cpus_latch_protocol_has_no_new_word_flag: 'READ on 2026-10-11 in the sub''s own code, one
      program for wheelfir, pwball and radendur (identical up to 0x4946). The IRQ1 mixer ends in a
      self-modified `jmp` whose target (0x20113a) is the protocol''s state: wait for 0xffff (0x632
      in ROM, 0x20113e in RAM, the state reset leaves it in), apply the block (0x648), wait for
      0xa0a0 (0x7a4), then read exactly 48 words, ONE PER IRQ1 (0x7c0), and wait for 0xffff again.
      No state tests a flag, a toggle, a sentinel or a port before taking a word: the sub takes
      whatever the latch holds on that line. IRQ1 is the mixer''s sample clock, one per line, not
      a latch interrupt. So the word must be renewed on every line by the main; a slot the main
      misses is a word read twice, by construction of the sub''s code and on any latch'
    pwball_no_build_of_this_repository_sounds: 'MEASURED on 2026-10-12, a bisection that found no
      sounding end. Every distinct source of Power Ball''s machine in this repository''s history (102
      states over the 151 commits that touch patches 0001 or 0002, wheelfir.cpp and wheelfir_v2.cpp
      eras alike) and the stock 0.288 driver, each rebuilt at the pin 9c28def34 from the stock file
      its patch was cut against (pre- and post-image blobs checked) with mechanical API ports only
      (the screen-type argument, population_count_32, the ramdac clock argument): 0 of 30 s with
      sound in a cold-boot attract, every one. Eleven of them (each era''s ends, the pin moves,
      c04c91a and its parent, HEAD) also 0 of 30 in game, coin and start pressed, the match screen
      reached in every capture (opened). Same instrument as pwball_stale_requests_at_boot_desync_the_sub
      (seconds with more than 16 distinct values in a MAME -wavwrite of 30 emulated s), validated on
      its known answers first: wheelfir 27 of 30, HEAD pwball 0 of 30, experiment C 29 of 30 in
      attract and in game. The stock releases are pwball_stock_0266_sounds_by_its_256_line_field.
      This repository''s driver sounds under pwball_bit_13_of_0x7c0000_enables_the_counter.'
    pwball_stock_0266_sounds_by_its_256_line_field: 'MEASURED on 2026-10-12, stock MAME releases
      built at their own tags with toolchain ports only (sol2''s optional<T&>::emplace for 0.266,
      the system zlib, Homebrew''s SDL2 linked as a library), recorded with the instrument of
      pwball_no_build_of_this_repository_sounds after it gave its known answers again the same day
      (HEAD pwball 0 of 30, wheelfir 27, experiment C 29 in attract and in game). 0.266: Power Ball
      30 of 30 s in attract and 29 of 30 in game; 0.276: 0 and 0; Wheels & Fire 27 of 30 on both, so
      both builds can sound; every game recording reached the match screen (opened). Between the
      two, src/mame/tch/wheelfir.cpp changed in seven upstream commits (both ends checked byte for
      byte against each release''s file); built on the 0.266 tree, 5cfb1cc076 sounds (30), 5cd86c7781
      does not (0), and 89cd320db4 and 0.276''s own file stay at 0; the other three, cleanups, were
      not built. Inside
      5cd86c7781 three changes touch timing; each was put back alone on top of it: the maximum
      quantum removed, 0; the extra IRQ1 moved back from line 224 to line 0, 0; NUM_VBLANK_LINES
      back from 64 to 8, 30 of 30 with a per-second profile identical to 0.266''s. So stock Power
      Ball sounds with a 256-line field at 60 Hz (15360 lines a second) and goes silent with the
      312-line field 5cd86c7781 introduced. This repository''s driver runs a 312-line field at
      50.08 Hz (15625 lines a second, the rate the sub''s own mixer counts against, recorded under
      wheelfir_50hz_hypothesis), where Power Ball is silent unless experiment C''s request timing is
      applied; C and stock 0.266 sound over the same seconds, the music starting in the same second
      of the attract and one apart in game. The 256-line field is not the board''s by that record,
      so what makes 0.266 sound is the field length moving where the main''s first unmasked
      requests fall (pwball_the_first_block_after_the_masked_boot_must_fit_before_vblank), not a
      model to adopt. Nothing applied: C remains unproved by the 68000 code. Power Ball sounds
      under pwball_bit_13_of_0x7c0000_enables_the_counter, recorded under 0x7a0000.'
    pwball_stale_requests_at_boot_desync_the_sub: 'MEASURED live on 2026-10-11, Power Ball from a cold
      boot, frames 0..13. The main boots with its interrupts masked for whole frames (no entry at
      all in frames 3..10). When it unmasks, the requests the driver holds (HOLD_LINE) enter
      together: frame 2, IRQ5 and IRQ3 both at line 132; frame 11, both at line 0. IRQ5 writes
      0xa0a0 and IRQ3, in the same line, writes the 0xffff that closes the block, so no data word
      goes between them (main latch writes: 0xffff f0, a0a0+ffff f2, a0a0+ffff f11, then a0a0 with
      1 and 3 data words in f12, a full block only from f13 with 157 IRQ5). The sub, having seen an
      a0a0, reads 48 lines of mostly 0xffff; at frame 12 it copies that block into its own code and
      parks on an illegal opcode. A/B, every arm a 30 s cold-boot recording counted as seconds with
      more than 16 distinct DAC values (the instrument''s control: wheelfir on the same binary, 27
      of 30): A, the driver as patched, 0 of 30. B, IRQ3 withdrawn at line 0 when not taken: the
      stale IRQ3 is gone from frame 2, the sub still dies (block of a0a0, opcode 0xa0a0 at
      0x201062 by frame 300), 0 of 30, a byte-identical WAV. C, B plus an IRQ5 request that lasts
      one line: 29 of 30, the sub alive in its idle loop; wheelfir 27 of 30 with the same counts
      per second, and the visual gates wheelfir 7/7 (05/06 among them), pwball 4/4, kongball 4/4.
      NOT APPLIED: how long the board holds a line-counter request is a hardware assumption the
      68000 code does not prove (the handler re-arms the counter first, `move.w #1, 0x7a0000`,
      which fits a request held until served just as well). Radendur under C is
      radendur_c_changes_the_stream_and_does_not_save_the_sub. What keeps the request held and
      still sounds is pwball_bit_13_of_0x7c0000_enables_the_counter.'
    radendur_a_duplicated_word_parks_the_sub_cpu: 'MEASURED live on 2026-09-25, both CPUs read in
      the same stop, today''s driver, no switch. The sub CPU''s mute is ONE duplicated word, and
      the chain is closed link by link. At frame 539 of a cold boot (reproduced on two boots) the
      sub reads word 24 of a block at beamy 0x19 and word 25 at beamy 0x1a, and both times the
      latch holds 0x0001: between the two reads the main CPU''s streamer operand (0x20319c) did
      not advance and its level-5 control did not count, because the main sat at mask 7 (PS
      0x2700, pc 0x1fe2) inside the blitter IRQ chain, whose four handlers and the vblank handler
      all open with move #$2700,SR. The main''s level-5 service arrived at beamy 0x1b, and the
      sub''s word 26 is the main''s word 25 (0x354a). The block at 0x201000 (six 16-byte voice
      records: pointer, end, volume table, opcode, pitch) is then shifted by one word from record
      3 on, so the apply routine''s move.w (A0)+,$2010ee at 0x201222 writes the volume table''s
      low word 0x1842 where voice 4''s opcode 0x1014 (move.b (A4),D0) belongs: a count watch on
      0x2010ee saw five writes of 0x1014 and one of 0x1842, all from that pc. 0x1842 is not a
      68000 instruction; vec_illegal is 0x552, a bare rte, so the sub re-executes it forever
      inside its IRQ1 service (PS 0x2109) and its four state controls stop while the main keeps
      its 49 level-5 entries per frame. What this does not establish: whether the board''s main
      also misses that line. The chain''s length on the board depends on blitter timing this
      driver does not model (blits complete at once), and the driver counts the line counter
      only on lines below NUM_SCANLINES, so the block streams on lines 0..48 while the main
      draws.'
    pwball_the_first_block_after_the_masked_boot_must_fit_before_vblank: 'MEASURED on 2026-10-12, Power
      Ball cold boot, stock 0.266 against this repository''s driver, every main write to the latch
      and to the line counter and every sub read of the latch logged with its frame and line (the
      line derived from the frame period, checked against the level-3 0xffff, which lands on line
      248 and 256 respectively, the first line of each driver''s vblank). The level-3 handler
      (0xf47a) writes 0xffff, sets the block count 0x20100c to 0x31 and loads the counter with
      0x64; the level-5 handler (in RAM at 0x20df0a) re-arms the counter with 1 and, while the count
      is 0x31, writes 0xa0a0. So a block starts 100 counted lines after the level-3 handler runs,
      and in the steady state 0xa0a0 lands on line 99 on both drivers. Neither handler writes an
      acknowledge. At boot the main runs masked for whole frames, and the vblank request it missed
      is still held when it unmasks: on 0.266 it enters at line 41 of frame 15 and the block starts
      at 141, with 107 visible lines left; here it enters at line 152 of frame 12 and the block
      starts at 252, with 4 left. The counter counts visible lines only, so here the next level 3
      writes 0xffff before the 48th word: the sub read 0xa0a0, 0x0000, 0x083a, 0x0000 and then
      0xffff for the rest of its block, and by frame 13 it executes RAM at 0x201062. So stock 0.266
      sounds because its boot happens to unmask early enough in the frame, not because of a
      different protocol: the block fits when the held request enters at most 148 lines before the
      end of the visible area.'
    radendur_c_changes_the_stream_and_does_not_save_the_sub: 'MEASURED on 2026-10-12, experiment C
      (a level-5 request withdrawn on the next line if not taken, level 3 withdrawn at line 0)
      written into radendur.cpp itself and into wheelfir.cpp, each build printing its mode in its
      log. Seconds with sound out of 30, our driver then C: radendurh 7 and 7 in attract, 13 and
      12 in a race (drive.lua); radendur 14 and 9, 7 and 11. Every radendur WAV differs between the
      two, and the sub dies under both (it leaves its idle loop at frames 423 and 437 of radendurh''s
      attract). Counting, in the first 450 frames, the block words the sub read with no write
      from the main since its previous read: radendurh 28 under our driver and 59 under C, and 0
      in the same span of Wheels & Fire and of Power Ball under C, which sound. Those reads fall on
      the first lines of the frame, where the main sits at mask 7 at 0x1fc0, in the blitter
      interrupt chain, and reaches the level-5 handler a line late (frame 257: mask 7 on lines 0
      to 2, 0x2031a0 at mask 5 on line 4). Holding the request delivers that word a line late and
      withdrawing it loses the word; the sub reads one word twice either way. Under the same C:
      Wheels & Fire, byte-identical WAVs in attract and in a race and its goldens 7/7 (05 and 06
      among them); Kong Ball, whose sub never reads the latch, goldens 4/4 with one level-5
      request withdrawn in 30 s; Power Ball, 29 of 30 in attract and 24 of 30 in a match, the
      gap a silence of the game with the sub in its idle loop.'
