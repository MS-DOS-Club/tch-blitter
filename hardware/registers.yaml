        wheelfir_artefact_A_broken_instrument: 'ARTEFACT A (the green stripe on the car sprites): on
          the machine it is JUST AS IT ALWAYS WAS, and it had been given as closed because the
          detector stopped seeing it. The detector had FOUR defects, all four fixed on 2026-07-30,
          and the first explains the false close: (1) it read the blit log by field ORDER, so adding
          w14= and vpos= to the driver log made it recognise NO line at all; (2) it did not find the
          captures if given the directory containing the series rather than the series; (3) with ZERO
          frames analysed it came out GREEN, which is the worst combination a gate can have; (4) its
          thresholds (height 20, density 0.5) were calibrated on the zooming logo, which is large,
          and lost the car sprites. WITH THE INSTRUMENT FIXED: at the default thresholds it finds
          nothing in the car scene (frames 335..425, 91 analysed); dropping them to height 4 and
          density 0.2 it finds 544 columns at the edge of a blit, 9..20 tall and 1..7 px from the box
          edge, all at scale 100. REFUTED that they are the inclusive end column: removing it
          (`WFV2_NOINCL` (switch WITHDRAWN)=1) raises the count to 554 and breaks 6 goldens. And the symptom as described
          has not been reproduced: there is not one pixel of pure green 02ff00 in frames 296..425,
          although that colour DOES exist in the palette (indices 241-246, frames 0..962). The exact
          scene is missing, and it will be asked for in QA'
        wheelfir_clear_and_screen_agree: 'CLOSED on 2026-07-30, and it was a REGRESSION of our own.
          When the screen moved to the declared bit (sampled on line 0), the CLEARING was left
          deciding with the old blit-counting heuristic, so the two models disagreed and what got
          cleaned was precisely the half about to be shown. Symptom observed: as the records table
          reaches mid-screen, ALL the sprites disappear and only come back shortly before the table
          changes. FIX: the half that gets cleaned is decided by the SAME model that paints it. In
          frame N''s vblank the line 0 sample still holds N''s value, and the half that will be drawn
          in N+1 is that same one, so that is the one cleaned. MEASURED A/B over frames 2860..2900: 5
          of 41 change, all from 2892 on (which is when the table reaches mid-screen), and on 2894
          the table text goes from 264 pixels to 2597, that is, from ABSENT to PRESENT. The seven
          goldens stay green. CAREFUL with the measurement: counting "pixels different from the
          background" with the background taken as the series'' own minimum ABSORBS the text and
          declares the two models equal. It took looking at the image to see it, and then counting
          inside the region and the colours of the text. `WFV2_BORRAVIEJO` (switch WITHDRAWN)=1 goes
          back to the earlier criterion'
        wheelfir_full_screen_background: 'CLOSED on 2026-07-30. The High Scores engine photo is ONE
          336x254 blit to the background plane and the game asks for it TRANSPARENT: reading the
