- address: 0x740000
  name: soundlatch
  common_to:
  - radendur
  - wheelfir
  - pwball
  - kongball
  description: 'The mailbox from the main 68000 to the sound one: a single word with no queue
    behind it, written once per line by the level-5 handler and read by the sub CPU at
    0x780000, one word per line. Writing twice before a read drops the first, and reading twice
    before a write takes the same word twice: either way the sub CPU''s block of 48 words shifts,
    and with no acknowledgement nothing on either side notices.'
  state: confirmed
  evidence: 'the per-line writes of the line counter''s handler, above; the drop measured on
    Radical Enduro, where a stream running ahead of the reader patches a parameter over an
    instruction of the sub CPU''s mix loop (recorded under word 8,
    radendur_the_right_rate_buys_seven_clean_seconds_at_the_latch)'
  observed:
    radendur_the_latch_cannot_be_the_deferred_generic_latch: 'MEASURED on 2026-10-14 at the pin
      74b9fae5, radendur.cpp built twice, its plain-register latch against MAME''s
      generic_latch_16_device (whose write goes through scheduler().synchronize), 120 s from a cold
      boot with scripts/drive.lua (coin, start, a race), the latch counted by taps (a read by the
      sub''s block receiver, pc 0x2012da, with no main write since the previous read is a word read
      twice) and the audio by -wavwrite (a second with more than 16 distinct sample values sounds).
      Control, the known answer of radendurh with the plain register: 287376 block reads = 5987
      blocks of 48, 11 read twice, 103 of 120 s with sound, as recorded before. radendurh with
      the generic latch: 2077 blocks, 5 read twice, 195452 main writes no read took, 35 of 120 s
      with sound, the last at second 41. The dump: 7 and 6 s with sound (its own faults stop it
      either way). So the plain register stays, and the comment on radendur_state::latch_w in wheelfir.cpp says why.
      Superseded by radendur_the_synchronised_latch_against_the_plain_register: measured before
      radendurh opened its blitter handlers at mask 4.'
    radendur_the_synchronised_latch_against_the_plain_register: 'MEASURED on 2026-10-20, the sets as
      they stand (radendurh with its four blitter interrupt handlers opened at mask 4, the dump at
      mask 7), two builds raced to frame 6100 (122 emulated s) from a cold boot with
