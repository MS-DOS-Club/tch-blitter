      not measured: the slower steps are frames whose draw chain no longer fits. The five boot
      goldens pass unchanged with the layer (radendur-goldens.sh verify radendurh, rc 0). The
      per-cell lists the drawers append to (a 0x40-byte cell from 0x203522, room for 29 entries)
      peaked, read every race frame, at 20 with the layer and 18 without (section 4). Taken before
      the strip-row routine existed (strip_row, in the fixes layer): that routine adds a dozen instructions to each row the view adds
      vertically and moves the strip''s stamps from the top row to the row drawn; not re-measured.'
    radendurh_the_blitter_handlers_hold_off_the_sound: 'MEASURED on 2026-10-19 with a blitter that takes time: an
      experiment build of the driver, never committed, re-asserting IRQ1 when a modelled duration
      elapses (pixels walked, per axis the larger of source and destination steps, times a number
      of clocks of 32 MHz read from the environment, each run stating it in its own log; zero is
      the instant blit and gave the same frames and the same WAV as the repository binary), under
      the pixel times of rltennis_the_blit_duration_is_not_established and the fitted one of
      rltennis_a_fitted_blit_duration_does_not_save_radendurs_sound, the five playable sections
      raced to the end from a cold boot and an attract from a cold boot. The fixes hold under
      every law: every race finishes on every ROM tried (a freeze the harness reported was the
      bike stuck against the scenery, the race clock still stepping and the race finishing when
      let run). The sound does not: with the block moved to line 99 (radendurh_the_block_at_line_99_keeps_the_sound)
      it sounds with instant blits and loses sections as the pixel time grows, to silence in every
      section and in the attract at the fitted one, as the fixes-only ROM is silent under all. The
      cause is the four blitter interrupt handlers (0x1f2a, 0x1f42, 0x1f94, 0x1fe6), which open
      with move #$2700,SR (radendur_a_duplicated_word_parks_the_sub_cpu): Power Ball''s handler
      (0xeabe) leaves the mask where the interrupt set it. Opening the four at mask 4, which keeps
      the vblank out and lets the level 5 in, keeps the sound on every section and in the attract
      under every law, with the block at line 0 as the prototype has it or at line 99, and the
      races finish as before; read before applying, the streamer the level 5 runs (copied to
      0x203164) touches the line counter, the latch, its own variables and the control shadow
      0x20351c, none of which the blitter handlers and their callees touch. So the set carries the
      mask and not the move to line 99.'
    radendurh_scenery_kills_the_sound: 'MEASURED on 2026-10-19 with the scenery layer built on top of the set
      (scripts/radendurh.py --with scenery --out) against the set alone and against the fixes-only ROM,
      each racing the five playable sections to the end from a cold boot through a navigation harness
      not kept in this tree (the section chosen by RIGHT presses in the menu and read back in RAM,
      throttle held, steering swept), the seconds with sound counted from a -wavwrite recording as in
      radendurh_the_block_at_line_99_keeps_the_sound. With the layer, on section 4 (the first jungle
      track), where it makes the most race-clock steps run late, the sound CPU dies part way through
      the race and stays silent to its end; on the other four sections it keeps sounding. The set
      alone keeps it on all five. The fixes-only ROM is silent for most of every race. Every race
      finishes on all three. That the late frames are what kills the sound is the inference the
      coincidence suggests, not measured.'
    radendurh_reverse_scroll_cut: 'EXPLAINED AND FIXED in radendurh, MEASURED on 2026-10-12, section 0
      driven by scripts/drive.lua. The symptom: a band of bare sand at the bottom of frame
      1800, where the reference draws trees, a palm and a fence, with the fixes-only ROM and with the
      full radendurh alike, only while the view origin''s y grows (866 to 870 over frames 1787..1804, the
      view moving down the track as the bike falls) and gone once the view moves on. The cause, read
      in the code: the vertical scroll (0xe19ee..0xe1b80) resets the new row with 0xe059a and then
      calls the strip drawer 0xe0646 with that row, the view''s origin when it moves up and the
      origin plus 8, the grid''s last of 9 rows (0xe08ba draws origin..origin+8), when it moves down. 0xe059a addresses its row as 0x207922 + (row - origin) * 32;
      0xe0646 stamps at 0x207922 itself, the top row, whatever row it is handed. Measured live on
      radendurh (a stop at the call site 0xe1b76, every grid cell''s plane and entry counts read
      before and after the call): frame 1787, view y 867, row 875 (origin + 8): row 875 stays at its
      base tile in all 12 cells while the top row gains the entries (one cell 3 to 14); control,
      frame 1895, view y 869, row 869 (origin + 0): the freshly reset top row gains its own. So
      moving down, the new bottom row keeps only its base tiles and its props are appended to the
      top row: the game''s own code (the dump hangs before a race can show it). Fixed first in the
      scenery layer, and now the fifth fault of hardware/radendurh.yaml''s fixes layer (strip_row, the
      same routine without the scenery widening): the call points 0x207922 at the row being drawn and
      puts it back. With it, frame 1800 draws the band''s trees, palm and fence as the reference crop shows
      them (captures of frames 1800 and 1806 opened against scripts/radendur_track_render.py 0
      --crop 5 868 17 879); radendur-goldens.sh verify radendurh is 6/6 with the same baseline; the
      five playable sections (nav-phase.lua MODE=capture, PRESSES 0, 1, 2, 3 and 6, the section read
      in RAM before the photo) each finish on their own. While the pointer is moved for the call,
      no other code reads it: the three readers of 0x207922 outside the drawers and the row resets
      (0xe2d5a, 0xe2e18, 0xe3064, every instruction that names it listed from the disassembly)
      carried a stop conditioned on the pointer differing from the one the game computes from the
      origin, over frames 1780..1830, and none fired, while the same three counted 8, 49 and 92
      passes in that window and the same condition at the routine''s own jsr (0xf5970 in the layout of that day) fired at
      frame 1787 with the pointer at the origin''s plus 0x100. Watched by the golden
      goldens/radendurh/06_desert_descent (frame 1800, view x 5, y 869), which goes red alone when
      the routine''s offset is neutralised (sub.w d0,d0) and the band comes back bare.'
    radendurh_the_taps_become_rom_code: 'MEASURED on 2026-10-12, same runs. The driver''s three
      data taps acted at exactly the sites hardware/radendurh.yaml rewrites as jsr: the count read
      at 0xe15f0 (once per race); MAX read only by the drawers'' sub.w at 0xe00ae, 0xe0406,
      0xe0676, 0xe08e6, 0xe0bec, 0xe0ef2 inside the tapped range (0xe17dc''s clr.w reads it too,
      outside the range, and 0xe1214 was never reached); MIN written by the addq.w/#0/#$7fff/
      indexed sites the table lists, plus the boot RAM clear at 0x25f4 (clr.b of zeros, which the
      clamp never touches). On radendurh every hooked site''s fetch count into the hook area is
      exactly twice its access count before, and the five races finish; the five boot goldens come
      out pixel-identical to the patched driver''s (they differ only in the PNG''s System text).'
- range:
  - 0x200000
  - 0x20ffff
  name: main_ram
  mirror: 0x10000
  state: open
  description: 'The main 68000''s 64 KB of RAM, with 0x210000..0x21ffff reaching the same bytes
    in the driver: a partial decode that ignores A16. Whether the board decodes it that way or
    carries a second bank there is not decided.'
  observed:
    kongball_reaches_it_through_0x21: 'Kong Ball copies its level-5 handler to 0x2100ae
      (0x288e2) and its vector at 0x74 names that address; three data addresses (0x210040,
      0x21004e, 0x21005a, at 0x3d748..0x3d87e) and the handler''s self-modified operands
      (0x2100e8, 0x2100f2) are spelled 0x21 too, and nothing in the ROM reaches them as
      0x200xxx; the one write measured live (0x469c0, `move.w #0,0x210040`) uses that spelling.
      Power Ball has one site (0x2da10, `ori.b #6,0x210042`); Wheels & Fire none. So the games
      say those addresses are RAM, not whether they are the same RAM'
    kongball_runs_the_same_without_the_mirror: 'MEASURED on 2026-09-16 (a diagnostic switch since withdrawn, PHASE2=1) with a
      temporary build that maps 0x200000..0x21ffff as ONE 128 KB bank and no mirror, restored
      byte for byte afterwards. Kong Ball''s four goldens come out identical to the blessed ones
      (4 of 4, batch), and in a live session from a cold start the level-5 handler at 0x2100ae
      counts 138681 hits at frame 900 and 607469 at frame 3900 under both maps, the raster
      handler 0x28850 889 and 3889, the sprite loop 0x30fd0 12253 and 193448, and the screen
      signature at frame 3900 is the same number. Under the separate bank 0x210040.. holds the
      game''s data while 0x200040.. reads zero, so nothing the game does reaches that data by
      the other spelling. Both models fit the game; the machine cannot refute either, and the
      driver keeps the mirror because a partial decode is the cheaper board'
