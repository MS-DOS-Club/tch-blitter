        wheelfir_raster_writes_reach_the_line_above: 'MEASURED on 2026-10-20 and APPLIED in the
          model (DISPLAY_LAG_LINES): a register written while the line counter is on line L reaches
          screen line L - 1, and one written on line 0 or in vblank is where the frame starts. ONE,
          the race at a crest: the line-0 handler (0xdc5f6) writes a scenery y below 257 and the band
          handler (0xdc7c6) pins row 257 on lines 1..257-y, in 368 of 368 such frames of the attract
          race (frames 1000..2700) and never on line 0, so the previous timing showed rows 249..256,
          the bottom of road strip B, on line 0 in 360 frames. TWO, the convergence grid, whose
          handler writes line - 1 on line L: its rows come out 0, 15-16, 31-32 .. 239-240, the
          pattern of its columns. THREE, Power Ball scrolls only in vblank and centres its attract
          panel (background blits at frame 66: rows 12..239, columns 53..282) on rows 0..251 and
          columns 0..335; it is byte-identical under the change, as are Kong Ball and both Radical
          Enduro sets, so the picture the frame starts from keeps its place, which is what refuted
          moving the visible area to lines 1..252 instead. The predictions were written before the
          build; one failed on a wrong premise: the car presentation is raster-scrolled too (its
          handler writes row L + 3 on line L), so the car moves up one line with the road. The race
          still asks rows 427..428 above its road: two rows of ground fill, not three. LIMIT: the
          frame is drawn when vblank starts, so the write the counter''s line 252 makes for screen
          line 251 arrives too late.'
        wheelfir_the_horizon_constant_is_a_steady_state: 'MEASURED on 2026-10-20, write taps on words
          8 and 11 and the line counter over the attract race (frames 1000..2700 of a cold boot), each
          write with its line. On line 0 the line-0 arm (0xdc5f6) writes word 8''s low byte and the
          scenery y (0xdc61a, 0xdc624), loads the counter with 1 (0xdc62e) and then, on 1305 of the
          1673 frames that run it, with 0x201cbc + 1 (0xdc65a); the raster arm (0xdc74e, its word-11
          write at 0xdc764) writes its first entry on that line, load N and first entry on line N in
          all 1305. On the other 368 the band arm takes the first lines; the other 28
          frames run the arm at 0xdc66a. y plus the load is 430 on 907 of the 1305, 429 on 119, 431 on
          92, 428 on 66, and 414..432 otherwise; it falls as the race approaches a crest (427 at frame
          1305, 419 at 1317) and on into the band frames (the same sum, y plus the band''s length plus
          0x201cbc: 416 at 1318 to 411 at 1322). So the screen line before the first raster entry asks
          row y + load - 2 under the line lag: 428 at a sum of 430, two past the art''s last row (426).
          This qualifies wheelfir_two_measurements_and_no_mechanism: its two samples both sum to 430,
          but the sum is the steady state, not a constant. REFUTED as the mechanism: a handler that
          special-cases a scroll value at the horizon (none of the six arms compares or branches on
          the gap to change a scroll; the gap only sets the counter''s load and the table index; the
          arms at 0xdc708 and 0xdc78a were read and did not run in the capture); and a counter that
          also counts the line it is loaded on (a load of N is followed by the first entry on line N,
          not N - 1). Not chased: the routine that forms y and 0x201cbc (0xdc342..0xdc544) moves y
          toward its target on alternate frames and takes the horizon from a separate variable'
        wheelfir_artefact_G_fixed_in_the_model: 'WITHDRAWN since (wheelfir_the_three_rows_withdrawn).
          FIXED on 2026-07-31 in the VIDEO MODEL, not by
          patching the game (`WFV2_FONDOCRUDO` (switch WITHDRAWN)=1 reverts it): the BACKGROUND plane is read THREE rows
          ahead of the scroll value. Patching the game''s constant (0x1ae -> 0x1ab) was tried first
          and gives the same screen, but it was DISCARDED: a ROM patch explains nothing about the
          board and MAME rejects it explicitly for that reason ("ROM patches or hacks to games are
          generally not appropriate, as they do not improve our understanding of the hardware"), so
          that route closes the door to upstream this project means to leave open. An offset in the
          READING of the plane IS a claim about the hardware, checkable and refutable.'
        wheelfir_artefact_G_what_supports_it: 'WHAT SUPPORTS IT. One, the fit is EXACT and not
          tuned: with the offset the sky band reads rows 261..426, that is, it ends right on the last
          row of the scenery art, which is 426 in all twelve environments. Two, it corrects BOTH
          symptoms at once and both were contrasted against the real machine: the band of ground
          between the sea and the start of the road disappears, and the road comes to start 10 px
          wide instead of 22, which is the width it had. Three, the siblings TOLERATE it: across the
          five Power Ball and Kong Ball scenes the change is a clean three-row translation, with no
          rubbish, no cuts and no new empty rows.'
        wheelfir_artefact_G_what_it_does_not_support: 'WHAT IT DOES NOT SUPPORT, and that is why it
          is said: there is no mechanism READ from the hardware that explains the 3; it is a
          hypothesis with an exact fit and two corrected symptoms, not a reading of the code. Until
          that is read, this is NOT ready for upstream however right its shape.'
        wheelfir_artefact_G_the_contrary_signal_explained: 'THE CONTRARY SIGNAL WAS EXPLAINED on
          2026-08-01, and it was not the 3: it was that the offset was also applied where the
          subtraction GOES OUTSIDE THE PLANE. The Wheels & Fire title draws its fire background in
          rows 0..63 and its per-line scroll bounces, so line 121 asked for row 2 and with the raw
          subtraction read row 511, which nobody has drawn: five dark rows crossing the screen, plus a
          three-row strip along the top edge of Power Ball and Kong Ball. With the same stop the
          scenery boundary already had, applied now to the wraparound, the three disappear and what
          comes out in their place is the drawing that belongs there. It is a LOCAL correction inside
          a strip, not a re-addressing of the plane. Goldens: the THREE race ones of wheelfir and the
          FIVE of the siblings move, and all are re-blessed after being looked at'
        wheelfir_who_clears_the_background: 'CLOSED on 2026-07-31 by reading the 68000, which is the
          thread E1 left half done. NOBODY clears the background plane on an attract cycle change,
          and on top of that the routine this project had recorded as the screen clear DOES NOT CLEAR
          ANYTHING: 0xe8d3c is four blitter programs (33x1 opaque to the background, a 33x1 direct
          write window over the sprite plane with 49 bytes of zero, and the two 2x512 columns at
          x=0..1), and then it sets the clipping window. It has been renamed wf_video_reset for that
          reason. The "frames 8, 12 and 17" recorded as THREE distinct CLEARING ROUTINES are the four
          firings of ONE single call to it (frames 8, 10, 12 and 15, with their program counters
          0xe8d8c, 0xe8dec, 0xe8e64 and 0xe8ecc). In 60 s emulated the direct write channel, the only
          thing on this board
          that writes without a source, opens FOUR times (frames 10, 913 and two on 937, the last
          three to load the road and the race scenery) and NONE of them near a cycle change; and
          there is a SINGLE opaque background blit in the whole pass. What actually happens, measured
          on the plane: at the frame 2706 change a single 336x254 background blit (frame 2709, page 1,
          transparent) repaints rows 1..254 and 78346 pixels change; at the 3171 one the plane does
          not change A SINGLE PIXEL and the new screen inherits the previous background. So the E1 fix
          is at the right level: the only thing that can cover the previous screen is the new
          background blit itself, and that is why it has to write its index 0. Superseded by
          wheelfir_the_high_scores_photo_lands_on_a_cleared_plane: the game clears the plane with a
          word-14 fill, which this pass did not model.'
        wheelfir_artefact_B_wraparound: 'ARTEFACT B CLOSED on 2026-07-30: what went out on the right
          came back on the left, which is literally what `& 0x1ff` does to the background plane
          destination. (rltennis was cited here as clipping instead of wrapping; measured on
          2026-10-03 it wraps inside its 256-pixel quadrant too, rltennis_spans_are_8_bit_forward_distances.) MEASURED on the presentation car''s sideways sweep (frames 425..480):
          with wraparound a piece of bodywork appears stuck to the left edge and moves right frame by
