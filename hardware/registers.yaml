        wheelfir_budget_attributed_with_a_profiler: 'CLOSED on 2026-07-30 with a PC PROFILER
          (`WFV2_PERFIL` (switch WITHDRAWN)=1, one sample per scanline), built after refuting every candidate one by one
          and because carrying on generating hypotheses with no data is guessing. Three addresses
          take 48.8% of the CPU time and all three are the SAME thing: 0x09bc60 at 19.4%, 0x0ea9a0 at
          15.0% and 0x0a5e90 at 14.4%, which are the VBLANK WAIT loops of the three screens (attract,
          race and High Scores; the profiler counts by 16-byte bucket, and the loops are the tst/beq at
          0x9bc62, 0xea9a8 and 0xa5e94 over 0x201cb8). So
          almost half the CPU is IDLE waiting, and the game is not short of cycles in absolute terms:
          its loop is "wait for the vblank, work a while, wait again", and the drawing fits in the
          bounded window after the vblank. At 16 MHz that window gives about 27 blits and the game
          wants 150. The emulation is FAITHFUL: there is nothing of ours to remove. The question that
          remains is one of HARDWARE, not of emulation: whether the real board ran faster than
          16 MHz, or whether the game drew like that. REFUTED one by one as the cause, all MEASURED
          on this board: the raster IRQ (`SINRASTER` (switch WITHDRAWN)=1, identical blits), the blitter IRQ
          (`SINBLITIRQ` (switch WITHDRAWN)=1, identical), the blitter''s cost (500 cycles per blit at 1x and at 4x), the
          50 Hz rate (+13.6% measuring the same screen located by content), bit 0x2000 of 0x7c0000
          (an improvement from 22 to 25) and the polling loop of 54 calls per frame (forcing its
          guard to 1: 25 to 24, that is, nothing)'
        wheelfir_guard_20bc98: 'STATE of the budget''s live thread, with one hypothesis already
          REFUTED so nobody repeats it. The loop of 54 polls per frame is governed by 0x20bc98: if it
          is non-zero, 0xa492c leaves through its bne and does not poll. MEASURED with a watchpoint:
          it is written ONCE only, on frame 19, from 0xdd564, and it comes from BIT 1 of byte
          (0x7e,A0) of a structure; bit 0 of the same byte goes to 0x20bc9a. READ during execution on
          frame 400: 0x20bc98 = 0 and 0x20bc9a = 0, so the loop DOES run. REFUTED that the structure
          is the EEPROM, which was the natural hypothesis because the board''s EEPROM is exactly 0x80
          bytes and the offset is 0x7e: of the three fields compared only one matches. (0xd,A0) gives
          0xff in RAM and 0xff in the EEPROM, but (0xc,A0) gives 0x7f in RAM against 0x01 in the
          EEPROM, and (0x7e,A0) would give both bits at ONE (the byte is 0xb7) when in RAM they are
          zero. NEXT STEP: find out what A0 is at 0xdd3c0, which is all that is missing to know
          whether that zero is right or a datum we are not feeding correctly'
        wheelfir_polled_54_times_per_frame: 'EXACT STATE of the budget front, MEASURED on 2026-07-30
          with the 0x2000 bit fix already in place: routine 0xa4962, which polls port 0x7c0000, runs
          3780 times in 70 frames, that is 54 per frame, and occupies from line 259 to 283. The gap
          between the end of 0xa492c and the first blit firing drops from 33 lines to 21, but it does
          not disappear. With the bit at one the routine should leave on its first bne, about 50
          cycles, and 54 calls would be 3 lines, not 21: there is more to measure there. Candidates
          in order: the exit path at 0xa4a6c, the guard 0x20bc98 that decides whether 0xa492c loops,
          and the second 68000, which shares the bus. NONE has been measured yet; it is written down
          so the thread is not lost'
        wheelfir_structure_of_the_burst: 'MEASURED on 2026-07-30 by ABSOLUTE CYCLE, without using
          frame numbers, which is the only thing that works here: attributing by frame_number splits
          a burst that crosses the field boundary badly, and that already produced two wrong
          readings. The real structure is ONE burst per field of about 30 blits, emitted one every
          500 cycles with no gaps, and between bursts there are 255000 cycles, that is 298 of the
          field''s 312 lines. The game spends 298 lines of every field doing something else and only
          about 14 emitting blits. Of those 298, around 117 are the vblank WAIT (4543 turns of the
          0xa5e94 loop), which is idle time. OPEN: why, with idle time available, the game does not
          emit more blits, and why raising the clock does achieve it (27 at 1x, 149 at 4x). Routine
          0xa492c, which runs just before the burst, is NOT the bottleneck: it is 54 bytes writing
          0xAC and 0xFF to port 0x007c0001 with two delay loops. That port DOES exist in the driver
          and its low byte is ignored; the driver''s own comment already suspected it is "scanline
          width/2", and the arithmetic fits: 0xAC x 2 = 344 and 0xFF x 2 = 510, which frame the
          visible width (336) and the plane''s (512). It is the live lead left on the budget'
        wheelfir_per_blit_cost_is_not_ours: 'MEASURED on 2026-07-30 with `WFV2_CICLOS` (switch WITHDRAWN)=1, which records
          the absolute CPU cycle of every blitter firing: the cost per blit is 504 cycles at nominal
          clock and 500 at 4x, that is, IDENTICAL. Our blitter makes nothing more expensive; those
          500 cycles are spent by the game setting the blit up, which is about 16 word writes plus
          walking its list. And the drawing stretch takes only 5.1% of the frame at 1x and 6.9% at
          4x, so the game does NOT exhaust the frame computing: it is limited by a window. That rules
          out the budget being a cost of our blitter emulation'
        rltennis_counts_60_fields_a_second: 'THE EARLIER BOARD''S GAME COUNTS 60 FIELDS TO THE
          SECOND, read on its 68000 on 2026-10-03, both sets byte-identical there: the vblank
          handler (level 4, 0x564) decrements 0x209202 on every entry and, when it reaches zero
          (0x6b4..0x6c2), reloads it with #$3c (0x6de), increments the up-counter 0x209200 and
          decrements 0x209204 and 0x209208, the clock the match shows in the top-left corner. Two
          more sites load the same 60 (0x2034, 0xbd7c). MEASURED: that clock steps exactly every 60
          frames in play (532 to 511 over frames 2100 to 3380), and with the same rhythm whether
          the blit chain is kicked by the vblank IRQ1 or by a held level, so it counts vblanks and
          not loop turns; the continue countdown, by contrast, counts loop turns (9 to 1 in 270
          frames with the vblank IRQ1, in 60 with the held level) and decides nothing. So the
          field rate the game was written for reads as 60 Hz, which is what rltennis.cpp already
          sets; that the clock''s unit is a second is the reading, the reload of 60 is the fact.
          WHAT THIS DOES NOT ESTABLISH: the field geometry,
          lines per field and pixels per line, so the screen keeps its refresh-based
          configuration; and the rows shown, because no sprite was found anchored to the bottom
          edge (the full-screen pictures fill rows 1 to 254 or 255, and the HUD is drawn clear of the bottom edge).'
        wheelfir_has_no_per_second_constant_in_its_vblank_handler: 'THE GAME''S VBLANK HANDLER
          COUNTS NO SECONDS, read on 2026-10-03 from disasm/img/wheelfir_maincpu.bin, decoded from the
          level-3 vector (0x6c holds 0xdc340) and checked against the full listing: the handler
          0xdc340..0xdc59e averages the scroll, reads the coin and test bits of P1 (the test bit
          leaves for the service menu at 0xdd31e; each coin edge calls a purse routine, 0xdc2b8 or
          0xdc2fa), sets the main loop''s frame flag 0x201cb8, commits
          the sound block (wf_snd_commit, wf_snd_enqueue_block), writes the scenery scroll and arms the line
          counter (0x7a0000 = 1); its other path (0xdc5a0) decrements 0x201014 and at zero resumes the
          main code at 0xa4a7e; and wf_snd_tick (0xda734) adds 500 to 0x20cc3a and on passing 0x21f
          advances the music tick 0x20cc38, a tempo of 500 ticks per 543 vblanks rather than a
          count of seconds. No counter is reloaded with a per-second constant there, so the earlier board''s #$3c (rltennis_counts_60_fields_a_second)
          has no counterpart and the refresh stays as wheelfir_clock_and_refresh_confirmed leaves it.
          The race clock is not one either: TIME is a 16.16 long at 0x20bd72 that 0xe79ae lowers once
          per frame by half of 0x20bd1c, a step 0xe943a loads from the table at 0x23056 indexed
          by 0x20bc84 (the DIFFICULTY LEVEL, see wheelfir_race_clock_step_table) and 0x20bc6e (2300 on the race measured, 57 frames per displayed unit, stepping every 57
          frames exactly over 25 steps).'
        wheelfir_race_clock_step_table: 'THE RACE CLOCK STEP IS A LOOKUP BY DIFFICULTY AND CLASS, AND THE TABLE IS SETTLED. Read off the ROM and
          measured live on 2026-10-08. 0xe9414..0xe943e builds it: a4 = 0x23056, a4 = the long at (a4 + 4 *
          word 0x20bc84), a4 += 6 * word 0x20bc6e, then word (a4) goes to 0x20bd7a and long 2(a4) to
          0x20bd1c. 0x23056 holds FIVE pointers (0x22eee, 0x22f36, 0x22f7e, 0x22fc6, 0x2300e, 0x48 bytes
          apart), each to twelve 6-byte records; what follows from 0x2306a is another list of pointers, the
          one 0xda496 walks, which is not this table. FRAME COST: 0xe79ae lowers the 16.16 TIME at 0x20bd72
          by 0x20bd1c asr 1 per frame and the shown unit is its high word, so a unit takes 131072 / step
          frames. THE STEPS, records 0..11 across: setting 0 (0x22eee): 2300 2423 2423 2483 2483 2473 2473
          2473 2473 2473 2523 2523; setting 1 (0x22f36): 2300 2485 2485 2545 2545 2535 2535 2535 2535 2535
          2585 2585; setting 2 (0x22f7e): 2300 2532 2532 2617 2617 2607 2632 2632 2632 2632 2682 2682;
          setting 3 (0x22fc6): 2300 2532 2532 2647 2647 2647 2682 2682 2682 2682 2732 2732; setting 4
          (0x2300e): 2300 2582 2582 2707 2707 2707 2707 2707 2707 2732 2782 2782. Record 0 is 2300 in every
          setting (56.99 frames a unit); the rest run from 2423 to 2782 (54.09 to 47.11 frames) and the
          setting raises them. 0x20bc84 IS THE DIFFICULTY LEVEL of the service menu GAME OPTIONS page,
          0 = VERY EASY 1 to 4 = VERY HARD 5: the page has two lines, line 0 steps 0x20bc84 by one and wraps
          to 0 past 4 (0xde268..0xde278), line 1 toggles 0x20bc82 (MUSIC IN ATRACT, 0 = YES and 1 = NO through
          the table at 0xdee62), and 0xde758 shows
          0x20bc84 through the table at 0xdee76, whose five entries point at VERY EASY 1, EASY 2, MEDIUM 3,
          HARD 4 and VERY HARD 5 (0xdb44..0xdb7c), so a harder cabinet runs a faster clock. It is the HIGH
          NIBBLE OF BYTE 4 OF THE EEPROM SETTINGS BLOCK (0xdd460..0xdd466: andi 0xf0, lsr 4), read into
          0x20bc9c at 0xdd3ca. THE SHIPPED EEPROM GIVES 2, MEDIUM 3:
          the file loads ROM_LOAD16_WORD_SWAP and only in that order does the game checksum (bytes 0..126
          summed against byte 127, 0xdd3f8..0xdd404) hold, 0xb7 = 0xb7 (as stored it is 0x6e against 0x00);
          byte 4 is 0x2a. LIVE, same day, the wheelfir binary at the pin 9c28def34 with this repository''s patches,
          shipped EEPROM, coin at frame 300, pedal and button 1 held from 400 and START pulsed every 150,
          14000 frames, write taps on 0x20bd1c, 0x20bc84 and 0x20bc6e plus the TIME high word each frame (scripts/wheelfir/race-clock.lua, since retired):
          0x20bc84 is written 2 at frame 16 from pc 0xdd46c, right after the 0xdd466 store. Three races ran.
          A write tap reports the pc AFTER the writing instruction, or inside it: 0xe0e0a is the
          instruction after move.w d7 at 0xe0e04, and 0xea544 lies inside move.w (a0) at 0xea540, so a
          breakpoint at 0xea544 never fires; the instructions are 0xe0e04 and 0xea540.
          (1) Class 0 stored by 0xe0e04, step 2300 written at frame 608 by 0xe943a (the tap''s pc is
          0xe9440), and 75
          intervals of exactly 57 frames. (2) Class 1 stored by 0xea540, step 2423 (0x977), 31 intervals
          of 54 (28) or 55 (3), mean 54.097 against 131072/2423 = 54.095. (3) Class 8 by 0xea540, step
          2473 (0x9a9), 26 intervals of exactly 53 (131072/2473 = 53.001). So the formula holds to the
          frame. IN (2) AND (3) THE STEP IS THE SETTING 0 CELL, NOT THE SHIPPED SETTING 2 ONE: 2423 is
          setting 0 class 1 (setting 2 would give 2532) and 2473 is setting 0 class 8 (setting 2 would give
          2632), because the load at 0xe943a runs between clr.w 0x20bc84 (0xe95de) and its restore from d0
          (0xe95ec), the same save, clear and restore that 0xe94f2..0xe9506 does around jsr 0xda448. In (1)
          nothing touched the setting but class 0 is 2300 in all five, so it says nothing about it.
          THE DEMOS RUN AT VERY EASY, THE PLAYED RACE AT THE CABINET DIFFICULTY. Measured live in a MAME
          debug session, same binary and EEPROM, with controls on the three race setups (0xdd0e8, 0xe0b60,
          0xe95d8), on both class stores and on 0xa51d2 and 0xa5210, the same three write taps, and the
          sprite dispatcher 0xe52f0 as the hot control. 0xea540 belongs to the BOOT, not to a race: right
          after the EEPROM load (0xdd46c) every boot stores into 0x20bc6e the next record of the table at
          0x76f98 (classes 1, 8, 7, 10), and with no coin the attract demo races that class. With no input
          the demos ran those records in order, each prepared by 0xe95d8, which saves 0x20bc84, clears it,
          calls 0xe9146 and 0xe9232 (the step load at 0xe943a among them) and restores it at 0xe95ec, so
          each demo loaded its class in the setting 0 row; between demos the game resets (the RAM
          clear loop at 0xe8ca4 clears the three words) and the next boot takes the next record. The
          played race takes its class from
          the level map: 0xe0df6..0xe0e04 stores 0x20bc6c * 3 + the map cursor, the LEVEL n on screen being
          the class plus one, and 0xe0b60 prepares the race with 0x20bc84 left alone. A coin, START, the
          pedal on the car select, the wheel turned to LEVEL 3 and the pedal again gave class 2 through
          0xe0e04 and 0xe0b60, with 0xe95d8 silent, and the step it loaded was the setting 2 cell, not the
          setting 0 one; the displayed unit then stepped at 131072 / step frames to the frame, as in the
          races above. 0xdd0e8, the setup that forces class 0, never ran in these passes. THE ONE CELL ON THE FIELD
          RATE: setting 2, records 3 and 4 are 2617, 131072 / 2617 = 50.08 frames a unit, 1.000 s at the
          driver 50.08 Hz field; a played race reaches it on the second page of the level map
          (0x20bc6c = 1, cursor 0 or 1), which no live race here visited; nothing in the ROM says it was
          meant, and no cell is 50 or 60 frames exactly (60 would need 2184.5). 0xa5210 IS THE LINK, NOT A
          RESET PATH: it belongs to 0xa51d2, which the two-cabinet boot handshake calls once the 0xa5 sync
          byte has crossed the link (0xa480e, 0xa487e), and which shares the difficulty between linked
          boards. With 0x20bc98 (PLAYER NUMBER) nonzero, the second cabinet, it receives a byte through
          0xa4cd8 (waits for bit 5 of 0x7c0000 to clear, reads the link byte at 0x7c0001, pulses the
          handshake bit 7, waits for bit 5 to set) and stores it into 0x20bc84 at 0xa5210; with it zero,
          the first cabinet, 0xa526e sends its own 0x20bc84 through 0xa4e74. Both branches then rebuild the
          EEPROM settings block (0xdd646, which packs 0x20bc84 at 0xdd690) and execute reset, so a linked
          pair races at the first cabinet difficulty. That is read from the ROM; live, 0xa51d2 and 0xa5210
          never ran in either pass, as NUMBER OF PLAYERS 1 implies, and the receiving branch was not
          driven because the driver models no partner
          (wheelfir_the_link_is_a_menu_setting_and_its_two_cabinet_path_is_not_walked).'
        radendur_has_no_per_second_constant_in_its_vblank_handler: 'RADICAL ENDURO''S VBLANK HANDLER
          COUNTS NO SECONDS EITHER; ITS SECOND IS 54 PASSES OF THE MAIN LOOP. Read on 2026-10-03 from
          the level-3 vector (0x6c holds 0x400), checked instruction by instruction against the full
          listing: 0x400..0x59a increments the counters 0x203200 (taken back when the list walker has
          flagged the frame''s list done in 0x2091ee, so it keeps the vblanks whose list had not
          finished), 0x2031fc and 0x202e84, opens the blit chain at 0x4a0, writes the scrolls, arms
          the sound block and the line counter, counts coin edges into 0x20351e, and calls 0x7b6 (the
          palette upload), state_advance (0xf2284) and 0xf2984, the same music tempo as
          wf_snd_tick (500 into 0x202e9e, a tick of 0x202e9c on passing 0x21f). No counter there is
          reloaded with a per-second constant. The race clock''s constant is in the main loop instead:
          FUN_000f1dac, called once per pass from 0xdfd50, adds 100 to 0x201e58 and moves on one
          hundredth for every 54 it holds (subtracting 0x36 while it exceeds 0x35), so a displayed
          second is 54 calls.'
        wheelfir_clock_and_refresh_confirmed: 'THE CLOCK IS CONFIRMED; THE REFRESH IS NOT, and this
          entry claimed both until 2026-08-12. It said the arcade-history sheet gives the board as
          2x 68000 at 16 MHz and 60 Hz refresh, matching what the driver models (32 MHz / 2 and
          set_refresh_hz(60)), and concluded that the 50 Hz hypothesis below was refuted by SOURCE as
          well as by measurement. The two halves have to be separated, because only one of them
          holds. THE CLOCK: 16 MHz, and nothing disputes it. THE REFRESH: arcade-history is level
          `external`, a copied figure, and it is not evidence against a constant read out of the
          game''s own ROM. The MEASUREMENT still stands and refuted something else entirely, namely
          that 50 Hz explains the drawing budget: +13.6% against the roughly 150 blits per frame the
          game wants, so the rate is not the cause and that is not reopened here. What IS reopened is
          the refresh itself, on a different axis, and it is opened by the game: its sound mixer
          compares against `#$3d09`, which is 15625, the PAL line rate, and its vblank handler
          reloads no per-second counter (wheelfir_has_no_per_second_constant_in_its_vblank_handler).
          Source:
          https://www.arcade-history.com/?n=wheels-and-fire&page=detail&id=4711'
        wheelfir_the_board_author_account: 'EXTERNAL: an account from the period by the board''s
          programmer. It is a recollection, so nothing in it becomes verified for agreeing with what
          is already believed here. What it says, claim by claim: the 68000 takes an interrupt SYNCHRONISED WITH THE HORIZONTAL LINE SCAN at about
          15 kHz, and that same interrupt drives the linescroll, the six-voice sound mix on the
          second 68000 and the handshake between the two CPUs; the zoom is a pair of STALL COUNTERS,
          one FPGA addressing the graphics ROM and the other the VRAM, where a value of 5 means four
          normal ticks and one stall, so stalling the VRAM side gives zoom below 100% and stalling
          the ROM side above it, with two bits halving each FPGA''s clock and pre-scaled art in ROM
          covering the rest of the range; Reality Tennis has two layers with the front one split for
          double buffering and the hidden half cleared every frame, and its sound is a bank of
          2048-byte samples concatenated by an interrupt with a register naming the next one; two
          boards can be linked over the VGA connector, and that cable also synchronises the 15 kHz
          interrupts of both. AND ONE THING THAT IS NOT A CLAIM ABOUT A REGISTER: the hardware was
          buggy, the two FPGAs were never properly in sync, and the glitches were minimised with
          software tricks. Which is the shape of our own seam fix.'
        wheelfir_the_fpga_skew_does_not_widen_the_seam_bias: 'REFUTED, the one place where the account
          points one way and the measurement the other: that the FPGA skew means the seam bias should
          apply at ANY scale, not only 1:1. Applied at every scale (a diagnostic switch, since
          removed), the four non-race goldens moved 0 pixels and the three race ones moved 0.96%,
          1.11% and 0.52%, two of them the validated race HUD. And what decides it is an argument: a
          seam is an artefact of two tile surfaces that TOUCH, where the garbage row of the upper one
          shows against the lower; a lone scaled sprite has no neighbour to seam against, so widening
          the bias closes nothing and displaces content, by scale/100 screen rows per source row, up
          to four at the top of the range. The skew may well be a constant of the silicon and its
          visible consequence still live only at 1:1. Limits, should it ever be reopened: the test
          was vertical only, and on Power Ball the scale law never activates, so there it measured a
          different artefact (a truncation skipping a row)'
        rltennis_has_no_1_1_seam: 'THE EARLIER BOARD HAS NO 1:1 SEAM, and the family''s v_bias does
          not apply to it. MEASURED on 2026-10-03 over the same blit logs as
          rltennis_spans_are_8_bit_forward_distances, against the gfx ROM: for every unscaled blit of
          at least 3x3 that is not a fill (34659 on rltennis, 33637 on rltennisa), the rows and
          columns it reads at each edge. A garbage first row, the expanded board''s seam, shows as an
          edge that is a full one-colour line at the START and not at the end; here the two ends
          match, 1258 first rows against 1314 last rows and 924 first columns against 885 last
          ones, identical counts on both sets, and those lines are the drawn frames of the menu
          panels (page 19 of the gfx region). The asymmetry sits OUTSIDE the source: the row just
          before it is a full line in 974 blits and the row just after in none, because the game
          starts its sources right after the separator lines of the atlas''s 256x256 quarters (row
          255, colour 1) and of the panel above (row 470 of page 19, colour 2). So the blitter
          reads exactly the source the game declares; a bias of +1 would drop the first row of
          every full-screen picture, which starts on row 256, and one of -1 would draw those
          separators.'
        wheelfir_the_rltennis_sound_claim_already_holds: 'ONE of the account''s claims needed no
          measurement because the emulator already implements it, and checking that is worth more
          than assuming it: the earlier board''s sound is described as a bank of 2048-byte samples
          concatenated by an interrupt with a register naming the next one. rltennis.cpp reloads the
          top address bits when (counter & 0x7ff) == 0x7ff, which is a 2048-byte bank, takes the next
          bank from two registers by alternating their MSB and LSB, and shifts it by 11. Through TWO
          DACs, which is the other half of what he says. So this part of the account is confirmed by
          code that was written from the same information years earlier, and it is recorded as a
          CONFIRMATION rather than as a finding.'
        rltennis_hidden_half_is_cleared_by_the_board: 'CONFIRMED on 2026-09-04 for Reality
          Tennis, both sets, and it is the account''s claim measured rather than believed: the
          hidden half of the sprite layer is cleared by the BOARD on the flip, not by the game. The
          instrument is scripts/rltennis/clear-probe.lua (since retired) on a live debug session: a write tap on
          the eight blitter registers keeps a shadow of them (they are write-only) and classifies
          every strobe by layer, by the FG half it lands on and by the half the display bit shows.
          Over 2400 frames (40 emulated seconds, attract then a match), set 1: 36232 blits, 1511
          moves of the display bit, 25781 FG blits into the HIDDEN half and ZERO into the shown one,
          ONE single-pixel fill on the FG (256x2, at frame 1519 of the pass, after coin and start) and 2070 on the BG; set 2: 35742, 1513,
          25271, 0, 1, 2070. Four runs of set 1 gave the same totals byte for byte. The only
          page-sized FG blits are 374 pairs inside one 372-frame presentation window, and their
          source is real artwork read back from the gfx ROM (dominant index 2, dozens of others),
          not a black region; in play every FG shape is sprite-sized (8x9, 51x22, 187x29...), no
          full-width strip. So the game never clears that half, by fill, by strip or by page, while
          it draws only sprites into it and flips once per frame: if nobody cleared it, stale
          sprites would pile up. The driver''s fill(0) on the change of BLTFLAG_DISPLAY_UD is
          therefore the hardware, not a hack. Control, in the same run: blits and flips both seen,
          and the classification landing 100% on the hidden half. Wheels & Fire, measured earlier,
          clears its pages from the GAME (word-14 fills per band), so the two boards differ on this
          and the expanded board does not clear on its own. Validated live, by eye, on both sets
          the same day.'
        radendur_the_right_rate_buys_seven_clean_seconds_at_the_latch: 'MEASURED on 2026-09-15,
          re-running the two arms of the entry below with the LATCH counters read as well, which is
          what it did not carry. The baseline REPRODUCES it, which is the precondition: at HZ=60 the
          DAC moves for 5 of 25 emulated seconds and at HZ=50 for 10 of 25, with ZERO negative
          writes of the sample counter in either, exactly as recorded.
          What the latch adds is sharper than "it doubles the time". At HZ=60 the 16-bit mailbox
          drops 19 words in the first second and 9 in the second, is clean for the third and fourth,
          and collapses in the fifth. At HZ=50 it drops 3 in the first second, is CLEAN FOR SEVEN
          CONSECUTIVE SECONDS, drops 8 in the ninth and collapses in the tenth. So the right rate
          does not merely delay the death: it removes the losses that precede it, which is what the
          per-line appointment being 1026 cycles instead of 855 buys.
          And the collapse has one shape in both: from then on the words LOST equal the words
          WRITTEN exactly (3000 of 3000 per second at HZ=60, 2500 of 2500 at HZ=50) and the reads
          fall to zero, while the main CPU''s IRQ5 count stays at 49 per frame throughout. The
          sender never misses its appointment; the receiver stops reading, which is the
          self-modified streamer already documented, seen from the mailbox end.
          Instrument note, because it would have silently mis-scaled the comparison: `RE_DAC` (switch WITHDRAWN)=1
          summarises every 60 FRAMES, which is one second only at 60 Hz. These figures come from
          RE_DAC=2, one line per frame, aggregated per emulated second by the reader. NO DRIVER
          CHANGE; the fault stays open, since the sub-CPU still goes quiet.'
        radendur_sound_at_the_right_line_rate: 'MEASURED on 2026-09-04, and the right rate HELPS but
          does NOT close the fault: two 25-second passes of radendur through
          scripts/radendur-instrument.sh (since retired) with `RE_SONIDO` (switch WITHDRAWN)=1 and the DAC recorded to WAV, the baseline at
          HZ=60 first as the control. The control reproduces the record: 5 seconds with sound out of
          25 (seconds whose 48 kHz stereo recording holds more than 50 distinct sample values; the
          silent ones hold 4) and ZERO negative writes of the sample counter at 0x202e86 over 1501
          frames. At HZ=50, which is the line rate the game counts against (15625, see
          wheelfir_50hz_hypothesis), the sound lasts 10 seconds out of 25, also with zero negative
          writes over 1250 frames, and dies the same way afterwards. So the emulated rate was PART of
          the per-line appointment the sub-CPU misses (the second of its two causes), and doubling the
          time before silence is the size of that part; what is left is still the main CPU keeping
          one latch word per line while the drawing chain runs. Verdict validated by ear the same
          day; no driver change.'
        wheelfir_the_rate_moves_no_pixel_only_the_budget: 'MEASURED on 2026-09-15 on WHEELS AND
          FIRE, which an earlier measurement had only established on Radical Enduro, and the answer is sharper
          than expected: CHANGING THE REFRESH MOVES NOTHING INSIDE A FRAME. It moves how long a
          frame lasts and how many cycles the game gets inside it, and nothing else.
          THE LINE RATE, with that earlier instrument carried over unchanged (breakpoint on the
          sub-CPU''s IRQ1 entry 0x201060, control on the mixer''s output routine 0x2010c6,
          scripts/trace-bp.sh (since retired) with CPU=sub, 10 emulated seconds each): 187452 hits over 600 frames
          at HZ=60, 18745 per second, +20.0% against the 15625 the game''s own mixer counts against;
          155940 over 500 frames at HZ=50, 15594 per second, -0.2%. The instrument moved with the
          configuration. It transfers because the two boards run the SAME sound firmware: both
          disasm/img/wheelfir_subcpu.bin and disasm/img/radendur_subcpu.bin carry reset 0x400 and
          IRQ1 0x201060, so the ISR lives in RAM in both and the two addresses are the same pair.
          THE BUDGET, measured rather than derived (`WFV2_CICLOS` (switch WITHDRAWN), the CPU cycle of every blitter
          trigger, over about a thousand consecutive frame pairs per arm): median 266670 cycles per
          frame at HZ=60 and 320000 at HZ=50, which is 16 MHz over the declared refresh to the
          cycle, and over the 312-line field that is 855 against 1026 cycles per line. That is the
          855-against-1024 of the Radical Enduro arithmetic, now measured on this board instead of arithmetic.
          THE PICTURE: six scenes captured under both rates and located BY CONTENT, never by frame
          index (the zooming TCH logo by its blit pg=15 src=1,158 at scale 89; the settled 1:1 logo;
          the two race HUD goldens and the horizon golden by the multiset of blits of the frame,
          Jaccard 1.000 against their partner; the High Scores screen by the single 336x254 blit
          from page 1). ALL SIX BYTE-IDENTICAL, zero differing pixels of 84672. The comparator was
          seen RED in the same run, which is what makes six zeros a result rather than a broken
          instrument: the deliberately wrong partner gives 17.25%, two frames of one arm 38.38%, two
          different screens 100.00%.
          WHY, read from the driver: everything it anchors is anchored to LINES and not to time.
          Vblank fires at line NUM_SCANLINES of the 312-line field, the palette goes up on the
          screen_vblank falling edge, the raster IRQ5 fires on the line the game''s own counter
          names, and the sub-CPU''s IRQ1 fires once per line. The lines per frame do not move with
          the refresh, so nothing inside a frame moves. And the attract''s own pacing is counted in
          FRAMES: the state durations are identical at both rates (182, 214, 21, 22, 197 frames)
          except the two compute-bound ones, the race demo (1744 frames at 60 against 1725 at 50)
          and the High Scores build (58 against 48), which finish sooner in frames when the frame
          carries 20% more cycles.
          WHAT DOES NOT REPRODUCE, said rather than quietly dropped: the +13.6% blits per frame
          recorded below on 2026-09-04. Located by the same content on today''s build, the engine
          photo first appears at f=2709 at HZ=60 and f=2675 at HZ=50, and over its located sustained
          run the median blits per frame is 46 under BOTH rates. The old record''s CONCLUSION is
          untouched and in fact strengthened, since 0% is further from explaining the budget than
          +13.6% was; its FIGURE does not reproduce on this binary. Both are kept side by side, and
          neither overwrites the other. APPLIED: the driver no longer declares a rate at
          all, it derives it from the crystal through set_raw().'
        wheelfir_50hz_hypothesis: 'MEASURED on 2026-09-04, and the 60 Hz is the number that is wrong:
          counting the sub-CPU''s IRQ1 entries (breakpoint on its RAM vector 0x201060, control on the
          mixer''s output routine 0x2010c6, scripts/trace-bp.sh, since retired, with CPU=sub) over 10 emulated seconds
          gives 187452 hits in 600 frames at HZ=60, 18745 per second, +20.0% against the 15625 the
          game''s own mixer counts against; and 155940 in 499 frames at HZ=50, 15594 per second,
          -0.2%. The instrument moved with the configuration, which is what makes the two numbers
          comparable. With the 312-line field, line rate and field are coherent with each other and
          with 0x3d09; the refresh is the odd one out, and 15625/312 = 50.08 Hz. What is NOT decided
          here is applying it: changing the refresh moves where vblank and the palette upload fall
          and re-blesses goldens across four games, so it was decided on its own, with a
          perceptual validation. Validated by eye the same day. The history of
          how this was OPEN, and the three attempts that went wrong, stays below because they are
          the refutations: it was OPEN, with the arithmetic in its favour and a measurement that
          does NOT prove it. In favour: 312 lines is the PAL field, and the board''s only crystal
          (32 MHz) with a pixel clock of 32/4 = 8 MHz over 512 pixels per line gives 50.08 Hz; to
          give the 60 Hz the driver declares would take 427 pixels per line, a far less round number.
          At 50 Hz the frame would give 320000 cycles instead of 266666, 20% more. WHAT DOES NOT
          COUNT: the blit count of frames 2850..2950 was compared at 50 and at 60 Hz and came out 67
          against 27, but that comparison is INVALID and it has to be said: changing the rate changes
          the whole attract cycle, and on those frames at 50 Hz what is on screen is the RACE, not
          the High Scores. It was checked by looking at the capture. SECOND ATTEMPT, also invalid:
          the states at 50 Hz were located with `ESTADOS` (switch WITHDRAWN)=1 (2673, 3119, 3675 against 2772, 3242, 3821
          at 60) and the equivalent stretch measured, giving 30 blits; but the capture of frame 2800
          at 50 Hz is still the RACE, so the states do not correspond one to one either. At 50 Hz the
          race demo lasts 1725 frames and at 60 it lasts 1810, so the attract sequence is not the
          same and shifting by a frame count is not enough. MEASURED PROPERLY ON THE THIRD ATTEMPT,
          locating the screen by its CONTENT (the single 336x254 blit from page 1, which is the
          engine photo): it appears on frame 2775 at 60 Hz and on 2676 at 50 Hz, and over the
          following 100 frames the median blits per frame is 22 at 60 Hz and 25 at 50 Hz. A +13.6%,
          in line with the +20% the clock gives. CONCLUSION: the refresh rate does NOT explain the
          budget, because the game wants about 150 blits per frame and does not come close even at
          50 Hz. It is REFUTED as the cause of the budget; the hardware question (whether the board
          ran at 50 or 60 Hz) remains open and is decided some other way, not by this'
        wheelfir_drawing_synchronisation: 'MEASURED on 2026-07-30 with breakpoints and watchpoints:
          the screen loop clears 0x201cb8 and spins at 0xa5e94 until the vblank handler (0xdc488,
          y=245..256, median 256) sets it. That is 1044981 turns over 230 frames, about 4543 per
          frame, so more than a third of the CPU waiting; but it is a LEGITIMATE synchronisation
          wait, not a stall we introduced. The other wait (0xa5e1a, on 0x201cb6) turns once per
          frame. With that, the diagnosis stands: the game redraws the WHOLE table on every
          iteration and only has time for about 27 of the ~150 blits before the next vblank restarts
          the cycle, which is why two rows show instead of ten. OPEN: whether at 16 MHz (32 MHz / 2,
          which is what the board declares and what the driver models) that is what the real machine
          did, or whether something in our model makes the drawing loop more expensive'
        wheelfir_the_budget_is_not_the_irqs: 'REFUTED, the two easy causes of the budget, MEASURED on
          this board and not inherited from Radical Enduro: without the raster IRQ (`SINRASTER` (switch WITHDRAWN)=1) the
          game emits EXACTLY the same blits (median 27, max 113, total 3415 over frames 2850..2950),
          and without the per-blit IRQ (`SINBLITIRQ` (switch WITHDRAWN)=1) exactly the same again. Neither of them eats
          the frame'
        wheelfir_drawing_window: 'MEASURED by adding the vpos to the blit log: the game draws in the
          VERTICAL BLANKING, not in the visible part. The field is 312 lines with 248 visible. At
          nominal clock the blits come out with a median vpos of 294, p90 308 and max 311, that is,
          pressed against the end of the field; at 4x they come out at 275/284/290, with room to
          spare. And each screen''s loop marks the end of its work in a different place: the race one
          (0xeab84) clears its pass flag 0x201cb6 at y=258..273 with a median of 259, the attract one
          (0x9bc6a) at 258..262, and the High Scores one (0xa5eb4) at 16..308 with a median of 291,
          that is 32 lines later and with far more spread. That is where it does not fit'
        wheelfir_frame_budget_confirmed: 'CONFIRMED on 2026-07-30 with the `CPUX` (switch WITHDRAWN) switch, and it
          closes the front: on the High Scores screen the game WANTS to emit about 150 blits per
          frame and at nominal clock it manages a median of 27 (range 9..113); at 4x it emits 149
          (range 116..150). On screen, at 1x the table comes out with TWO rows and at 4x it comes out
          whole, and with ZERO pixels of change between consecutive frames against 112..122 at 1x. So
          what looks like flicker from halfway down the blocks is the game running out of frame, the
          same mechanism already measured on Radical Enduro, which needed 8x. OPEN, and it is the
          engineering question that remains: whether that budget is OUR cost or the board''s. On
          Radical Enduro it was measured not to be (removing the raster IRQ storm did not move the
          budget and the emulated blitter is free in emulated time), but here it has to be measured,
          not inherited'
        wheelfir_flicker_is_not_the_page: 'REFUTED on 2026-07-30, that the High Scores flicker comes
          from the page model. Frames 2850..2950 were captured with BOTH models and the text drops on
          the SAME 16 frames out of 101 under each. One live hypothesis is left: the frame budget,
          which is what was observed: it starts halfway down the table blocks and it also happens
          sometimes during the race'
        wheelfir_two_frame_counters: 'INSTRUMENT WARNING, and it cost two opposite conclusions on
          the same day: MAME''s debugger `frame` counter and the driver''s `m_screen->frame_number()`
          are NOT the same, so crossing a watchpoint series with a driver one is crossing two runs
          even when it is the same run. Measured inside the driver itself and at the SAME instant
          (inside the band it composes), the declared model and the heuristic differ on 2.2% of the
          race frames (32 of 1443) and on 55% of the High Scores ones (102 of 186). Those are the
          good numbers; the ones from crossing instruments are not'
        wheelfir_composition_by_bands: 'MEASURED with `WFV2_BANDAS` (switch WITHDRAWN)=1: MAME
          already composes this screen BY BANDS as the beam advances, and on 924 of 1801 frames that
          is 256 calls to screen_update, one per line (clips y=0..0, 1..1, ... with vpos=y+1). The
          number varies with the frame''s scroll writes. So the render is already faithful to the
          beam and the only thing in dispute is which page each band uses'
        wheelfir_page_is_not_per_line: 'REFUTED on 2026-07-30, that the page is per SCANLINE. The
          table the 68000 builds in RAM was dumped (pointer at 0x2038c8, control byte at base+0x200
          +2*line) on frame 1200: its page bit holds the SAME value across all 256 lines, and its
          control bytes are only 0x20 and 0x60, which share it. The variation seen in the register
          (page 1 up to line 167, 0 from 168) does NOT come from the table. Against the table, the
          per-line sampling of the register disagrees on 88 of 256 lines and shifting the phase
          barely moves it (88 to 84 between -4 and +4), so there is no alignment that saves it.
          Implemented anyway and measured: it makes the series gate worse, from 86 to 174 dropped
          frames'
        wheelfir_vpos_separates_the_sites: 'MEASURED with `WFV2_SITIOS` (switch WITHDRAWN)=1, recording the vpos of every
          writer of word 8, which is what finally separates them physically (the writers named by a
          live write census of 2026-10-13; the tool printed the pc of the instruction that followed
          each): 0xdc61a writes ONCE per frame at vpos 0..0 and alternates 951/907, so it is the one
          that sets the frame''s page; 0xdc756 is the per-line streaming (vpos 1..255); 0xdc7d0 is the
          road one (vpos 1..53, and it does NOT carry the bit in any of 10489 times); 0xdc544 falls in
          the vertical blanking (247..262). Latching the bit on the vpos 0 write and showing the
          PREVIOUS frame''s, the
          seven goldens do NOT pass (the three race ones fall) and the series gate gives 89 against
          the heuristic''s 86, with the drops shifted by exactly one frame. So the declared model
          comes very close but does not reproduce the validated state'
        wheelfir_series_gate_wrong_average: 'CORRECTION of 2026-07-31, and it voids the figures this
          very entry gave before: the series gate had the race demo stretch PINNED BY HAND
          (962..2771), and a later fix (the 0x2000 bit of 0x7c0000) brought the timeline forward, so
          the demo now ended at 2705. The gate went on measuring 66 frames of ANOTHER screen and
          folding them into the count. With the stretch properly located (962..2705, which now comes
          from the state detector instead of being written by hand) the result is 20 dropped frames
          out of 1744, 1.1%, not the 86 of 1810 that had been quoted. And what really changes the
          conclusion: the TWO page models give EXACTLY 20, that is, they are identical under this
          gate. The story that the gate favoured the blit-counting heuristic (186 against 86) was an
          artefact of measuring the wrong stretch, not a bias of the instrument. It remains true that
          a gate built to minimise what it measures does not arbitrate between two models, but HERE
          it never got that far: it was simply measuring wrong'
        wheelfir_series_gate_does_not_arbitrate: 'And a warning about the instrument, because it
          almost led to the opposite conclusion: the series gate measures frames with the sprite
          plane EMPTY, which is exactly what the blit-counting heuristic is built to minimise.
          Comparing it against another model through that gate is circular and always favours it. The
          neutral arbiter is the goldens, which are pixels blessed on a state validated live'
        wheelfir_models_crossed: 'MEASURED on 2026-07-30 by crossing the TWO models frame by frame,
          instead of swapping one for the other blind. The DECLARED series is taken with a watchpoint
          on 0x20b4c2, which covers the block''s four copies at once; the INFERRED one is written by
          the driver with `WFV2_PAGCMP` (switch WITHDRAWN)=1. They agree EXACTLY in the race: 0 discrepancies over 1444
          frames (1100..2600), which is the known-answer case because that state is validated live.
          They disagree on 31.7% of the High Scores frames (59 of 186), 0.9% in the attract and 3.0%
          on the world map. Aligning frame N-1''s declared value with frame N''s inferred one gives
          100% discrepancy in the race, which rules out the agreement being a coincidence of a series
          that simply alternates'
        wheelfir_sites_quantified: 'MEASURED with `WFV2_SITIOS` (switch WITHDRAWN)=1 over a whole attract cycle, counting
          the word 8 writes by PC (the writers by the census of 2026-10-13) and whether they carried
          the bit: 0xdc756 writes 484870 times and carries it on 227290 (an almost 50/50 split, which
          is the alternation); 0xdc7d0 writes 10489 times and carries it ZERO, so it is an absolute
          non-carrier and not a rare case; 0xdc544 (2982) and 0xdc61a (1858) carry it roughly half the
          time. And the access mask does NOT tell
          them apart: all four write the low byte (0x00ff), so there is no PHYSICAL way to separate
          the carrier from the one that is not. WHAT THIS MEASUREMENT PROVES is that the bit CANNOT be
          read at just any moment, because four sites write it with different criteria and one never
          carries it. The reading "so the bit is PER SCANLINE" that used to be here is REFUTED by the
          measurement beside it (`wheelfir_page_is_not_per_line`) and by the model in force, which
          reads it once per frame on LINE 0, the only instant when only the code that knows has
          written'
        kongball: it alternates on 99% of the frames
        pwball: it alternates on 99% of the frames
        wheelfir: it alternates on 55% of the frames, measured on the LIVE value, which is the last
          blit's and not the one the game asked for; in the car cycle the requested value is 0 on
          every frame
        wheelfir_residue: 'the mechanism of showing the FINISHED half leaves a residue MEASURED on
          2026-07-30 with the series gate. **This entry''s figure was VOIDED on 2026-07-31**: the
          gate averaged wrongly and the real residue is 20 frames of 1744, 1.1%, not the 86 of 1810
          (4.8%) that had been quoted and that this very paragraph repeated seven lines below its own
          correction. What still stands is the SHAPE of the fault, described here with the old figure
          in brackets: the dropped frames bring the sprite plane out ENTIRELY EMPTY (86 of 1810 by
          the voided measurement). It is not a degradation of the HUD: the labels, the car, the girl
          at the margin and the signs all go at once, and only the background is left. The healthy
          frames keep at least 72.5% of the HUD''s fixed pixels and the dropped ones 0.0%, with no
          value in between. The drops are not evenly spread: at the start of the race they come in
          pairs every four frames (963-964, 967-968, 971-972...) and afterwards they appear singly,
          with up to 821 healthy frames in a row. Instrument: the HUD series gate (tool WITHDRAWN),
          which derived witness pixels from the two race goldens and counted the frames keeping
          fewer than the threshold.'
      meaning: selects which half of the sprite plane is shown
    - field: scroll_x
      name: scroll_x_bit8
      state: confirmed
      evidence: the header of the original MAME driver
      note: 'this bit is LIVE: a write of the control byte applies it to the scroll already latched,
        without waiting for x to be rewritten. The low bytes are not: those latch when y is written
        (see the note on bit 0x0080)'
      observed:
        wheelfir_temporary_control: 'the routine that sets the upper band writes a TEMPORARY control
          of 0x80 at 0xdc7d0, which is what that band wants for Y (bit 8 set, that is, reading from
          the plane''s upper half where the scenery lives) and in passing CLEARS this bit, because
          they share a byte. It restores it from 0x201cbe at 0xdc806, but only on its LAST iteration:
          the common path (0xdc816) does not restore it. And the restoration does not rewrite y, so a
          model that only looks at this bit when latching the scroll never sees it and x stays 256 px
          displaced until the next write of y, which arrives 165 lines later'
        wheelfir_scenery_teleport: 'CLOSED on 2026-08-02 by reading the live bit. Without it, the
          scenery band stays half a page displaced for 93 consecutive frames (1.5 s) and jumps in and
          out at once: in play that is TWO lurches, which is how they are seen. MEASURED line by line
          over the demo''s 1744 frames, lines 1..166 jump 256 px on frame 1724 and come back on 1817,
          with the road''s 90 STILL. And measured in pixels between consecutive frames, which is the
          field proof: the scenery shifts +254 px between 1723 and 1724 and -260 px between 1816 and
          1817, against 0 px with the live bit. Of the whole demo only those 93 frames change, in rows
          41..187'
        wheelfir_why_not_move_the_latch: 'the two routines that write the control WITHOUT writing x
          are structurally identical (control and then y: line 0 at 0xdc61a/0xdc624 and the upper
          band at 0xdc7d0/0xdc7d8), so no rule about WHICH byte gets written can separate them. The
          only thing that separates them is that one restores the control afterwards, and that is
          only visible if the bit is live. Three attempts at moving the latching instant went that
          way, and all three were reverted'
      meaning: bit 8 of the horizontal background scroll
