machines:
- radendur
- wheelfir
- pwball
- kongball
- rltennis
blitter:
  base: 7340032
  common_to:
  - radendur
  - wheelfir
  - pwball
  - kongball
  description: Scaling blitter built from two Actel TPC1020BFN FPGAs. It copies rectangles from the
    graphics pages (512x512 at 8 bits) into one of the framebuffer's two planes. It is armed by
    writing 0x0000 into word 15 and fired with 0xffff.
  registers:
  - word: 7
    bytes:
    - 14
    - 15
    name: flags
    common_to:
    - radendur
    - wheelfir
    - pwball
    - kongball
    bits:
    - field: dest_dir_x
      name: dst_dir_x
      state: confirmed
      evidence: 'MEASURED on 2026-09-16 with a write tap on the blitter block over 1500 frames of
        the Wheels & Fire attract from a cold boot, 18107 triggers, reading the destination
        endpoints the game itself declared (x0 from word 0 with its bit 8 in word 7, x1 from word
        1 with its bit 8 in word 9; the 18107 count every 0xffff trigger of a run from a soft
        reset, 18131 from a cold boot, and the 18756 of the day before came from a different tap
        that counted differently, so the two days are not comparable and this day''s family is
        self-consistent): the bit is CLEAR on 837 blits and every one of them declares
        x1 < x0; it is SET on 17270 and one of them declares x1 < x0. So set means the destination
        walks with increasing x and clear means decreasing, in the game''s own coordinates. The
        one exception, and the ten of the vertical pair, are forward walks that go ROUND the
        512 torus (the driver counts the steps as (x1 - x0) & 0x1ff), which is what makes the
        bit a walk direction and not a restatement of the endpoint order. The earlier evidence
        was the original driver header, which had marked this pair "(src?)"'
      meaning: direction of the horizontal walk over the DESTINATION; set = increasing x
    - field: dest_dir_y
      name: dst_dir_y
      state: confirmed
      evidence: 'the same census: CLEAR on 58 blits, all with y1 < y0 declared (the zooming TCH
        logo of the boot, 0xe52f0, and the flames of the two-Porsche screen), SET on 18049, ten of
        which declare y1 < y0'
      meaning: direction of the vertical walk over the DESTINATION; set = increasing y
    - field: reads_source
      name: reads_source
      state: confirmed
      evidence: 'the loop of the Wheels & Fire car screen emits its graphics with the literal `move.w
        #$17,D2` at 0x9cc98 and its erasing curtains with `move.w #$1b,D2` at 0x9ccc2: same object,
        same layer, and bit 2 swapped for bit 3. D2 reaches the sprite register builder (0xe5584),
        which writes it into field 0x0a (0xe55ea), from where 0xe52a8 copies it to 0x70000e'
      observed:
        kongball: set on 100% of the blits, so it distinguishes nothing per blit
        wheelfir: 'CENSUS OF BOTH FLAGS, 20 s emulated, and it comes out without a single ambiguous
          case: 7888 blits with 0x0004 alone, which are the DRAWINGS; 1366 with both, which are the
          COLOUR FILLS (the word-14 ones, flat source and index 0 written); 407 with 0x0008 alone,
          which are ERASES, read no source and write zeros; and two strays. So 0x0004 = reads the
          source and 0x0008 = also writes index 0'
      meaning: 'the blit READS its graphic from ROM. It is a flag independent of 0x0008, not the
        other half of a two-value field: the two appear together in the same frame. A blit with 0x0008
        and WITHOUT this one reads nothing and writes zeros, that is, it clears'
    - field: writes_index_0
      name: writes_index_0
      state: confirmed
      evidence: 'it splits the Wheels & Fire population without a single ambiguous case: of 117742
        blits in 90 s emulated, the 6271 carrying it are the two families that NEED to write the zero
        and no other. 5455 are the colour fill columns (source fixed at 105,0 of page 0, which is 512
        rows of index 255) and 814 the 256x16 curtains of page 2 at (1,0), which read from ROM is
        index 0 across its 4096 pixels: transparent, they would do nothing at all. The remaining
        111471, which are the ones that draw, never carry it. And it is not a correlation: the game
        writes it as a literal, `#$1b` for the curtain against `#$17` for the graphic, in two
        instructions of the same loop (0x9ccc2 and 0x9cc98), from where it travels through 0xe5584
        -> 0xe55ea -> 0xe52a8 to 0x70000e'
      observed:
        wheelfir_unmarked_fill_bits: 'MEASURED on 2026-09-15 with a write tap on the blitter over
          1500 frames from a cold boot, 18756 triggers: 1966 carry the word 14 mark and SEVEN carry
          bits 2 and 3 without it. Those seven are the video reset''s 33x1 fill to the background
          at frame 6 (0xe8d94, 0xe8df4, painted opaque before anything is shown) and the five
          openers of the direct-write channel (0xe91d2, 0xe926a, 0xe92d2, page above the ROM,
          which draw nothing). None reaches the paint loop as a 2 px column: the "one case in 25
          seconds" the driver had recorded was one of these.'
        radendur_census: 'MEASURED on 2026-10-09 over the same two runs as word 14''s
          radendur_census: 8988 fires carry this bit in the attract and 2388 in the race, every one
          also with bit 0x0004 (a colour fill), all x=0..1. All but four carry the word 14 mark; the four that do not are 1-row colour
          fills at boot (0x26e0 and 0x28ba to the background, 0x2740 and 0x291a to the sprites),
          y=0..0. Not one pure erase (without 0x0004) in either run'
        wheelfir_two_families: 'TWO families carry the bit and they have to be separated by bit 0x0004.
          With it (colour fill): 2 px columns reading a fixed source at (105,0) of page 0. Their
          declared 2 px destination is NOT the real one: by an account from the period, on the
          original board those lines appear in no game. The ones declaring the plane''s WHOLE HEIGHT
          are a full-plane clear and the two columns are its seed (see word 14); the ones that do not
          remain discarded and with no known destination. Without bit 0x0004 (pure erase): the 256x16
          curtains, which do have a known destination, in COLUMNS, and are solved'
        wheelfir_what_they_are_for: 'they clear the WHOLE background for as long as the car screen
          lasts, so the next one starts black. The camera pans 5 px per frame and goes round the 512
          torus in about 100 frames, and these strips follow behind it. MEASURED with and without
          them: frames 260..400 come out identical (they fall just outside the right edge), the change
          concentrates in 420..664 and everything else in the attract is byte for byte equal. Without
          them the two-Porsche screen drags 8885 px of speckled leftovers from the Jaguar track (frame
          490), and on the flashing-headlights Porsche screen the red Porsche of the previous screen
          stays stuck (42665 px on frame 660), which is what made that screen look as if it carried
          two cars. It carries one'
        wheelfir_no_source: 'MEASURED on 2026-08-01, and it corrects three earlier refutations: a blit
          carrying this bit and NOT 0x0004 does not read the source, it writes zeros. Applied that
          way, and only that way, the plane''s whole width leaves the background EXACTLY at zero
          before the Porsche screen, which is what is needed. Before, the source was still being
          sampled, and widening the box read real graphics beyond column 256: it did not clear, it
          painted, and that is why the whole width looked as if it destroyed the screen'
        wheelfir_destination: 'SOLVED on 2026-08-01: the box walks the destination in COLUMNS, that
          is, with the axes swapped with respect to how it is declared. The game asks for 256x16 with
          x pinned at 0..255 and a y that moves, and that y follows the window''s HORIZONTAL scroll.
          Placing the 364 erases of frames 262..448 in screen coordinates under both readings: as a
          COLUMN the median is 339 with a deviation of 14.6, that is, it stays put at the right edge
          of the 336 px window, cleaning the strip the camera has just left behind; as a ROW the
          median is 292 with a deviation of 134.3, spread over the whole plane, and that is where the
          HORIZONTAL BLACK LINES came from. It fits the object''s shape in ROM, because the curtain
          descriptor (0x11832) declares 256x16 and 256 is EXACTLY the window''s visible row count: it
          is not a wide low band, it is a narrow tall strip'
        kongball: the same column, 2 pixels wide and white. Kong Ball draws real content out to x=335,
          so the column falls INSIDE the visible window.
        rltennis: a one-pixel dark column too, but a different thing, pen 0 left by the
          driver discarding every write to column 0, not a blit (rltennis_the_picture_starts_at_1_1).
      refuted:
      - read: the blit is not meant to be drawn at all
        symptom: it removes the green line at the edge, but also the world map background and whatever
          covers the Kong Ball monkeys for the whole game
      - read: an end-of-frame control naming the half being drawn
        symptom: the geometry fits (one per frame, alternating halves) but it leaves Power Ball black,
          because that game does not alternate
      - read: a rectangle fill with zeros
        symptom: 'it erases real graphics: the horizon mountains go black and a square appears over the
          wheel of the presentation car'
      - read: a curtain covers the plane''s WHOLE WIDTH over the rows it declares, which is the rule
          that DOES hold for the word-14 fills
        symptom: 'it destroys the entire car screen: the curtain sweeps while the game is drawing the
          strip, so at full width it takes the car with it and leaves vertical stripes. MEASURED on
          2026-08-01'
      - read: a 256x16 curtain erases the rectangle it declares, axes as given
        symptom: 'it takes 60x41 px out of the presentation car''s bodywork, and on top of that opens
          horizontal black lines across the middle of the screen, because read that way the box
          tumbles around the plane and sometimes falls outside the window and sometimes crosses it.
          The ROM appeared to say the damage was deliberate (it draws the slice and eight instructions
          later sweeps over it, in the same frame), and it was not: with the axes swapped those two
          boxes do not touch'
      - read: a curtain''s y is PAGE plus position, that is, the 0x100 of its `counter + 0x154` names
          the other half of 256 rows rather than an offset within the 512
        symptom: subtracting those 256 rows leaves rubbish WORSE than not erasing at all, and it
          breaks a golden into the bargain
      meaning: the blit ALSO writes index 0 instead of letting the background through. With bit 2 it
        is a colour fill, the blit the word 14 mark turns into a band clear; alone it is an erase that
        walks its destination in columns
    - field: plane
      name: plane
      state: confirmed
      evidence: header of MAME's driver, and consistent with separating the planes live
      meaning: destination plane; set = background, zero = sprites
    - mask: 32
      name: unused_in_word7
      state: confirmed
      meaning: not used in this word; the page bit with this same mask lives in word 8
      evidence: the original driver's map marks it unused in this word; the page bit with that same
        mask lives in word 8, not here
    - field: dest_x
      name: dst_x_bit8
      state: confirmed
      evidence: the Wheels & Fire sprite register builder (0xe4908) derives it by shifting bit 8 of the
        freshly clipped x
      observed:
        wheelfir: x runs 0..511 in a destination space 512 wide
      meaning: bit 8 of the destination x coordinate
    - field: dest_y
      name: dst_y_bit8
      state: confirmed
      evidence: same builder (0xe4910), shifting bit 8 of y. It is NOT a page selector, which was the
        reading that cost two failed attempts
      observed:
        kongball: 50% of the sprite plane blits carry it set, because the game alternates pages
          frame by frame
      meaning: bit 8 of the destination y coordinate
    - mask: 65280
      name: high_byte_unused_7
      state: confirmed
      evidence: 'NONE of its eight bits is ever set: a sweep of the 100679 blits of a full attract
        cycle, crossing every bit against what is known of the blit (plane, opaque mode, scale,
        destination size, graphics page). It agrees with the map in the driver header, which gives it
        as all dashes'
      observed:
        wheelfir_pwball_kongball_census: 'in the layer-enable census of 2026-09-16: a write tap on the blitter block reading the whole register at every trigger, on the three sets of this driver (a diagnostic switch since withdrawn, PHASE2=1 for the siblings), over a long attract and a game in Wheels & Fire (1171369 triggers) and Power Ball (934356), and over the attract of Kong Ball (879685; a coin and a start were pressed and read active at the port, and the screen still said INSERT COIN 3500 frames later, so that set contributes no game). The control in the same tap, the sprite page bit 0x20 of word 8, toggled 38627, 18115 and 15473 times: still not one of the eight bits, on any trigger, in any of the three
          sets'
      meaning: the high byte of word 7 is unused
    description: 'Blit flags. The high byte is unused; the low one is fully named, "yx-Ledff" (the
      original driver''s "yx-L??ff"): bit 2 reads the source and bit 3 writes index 0.'
  - word: 8
    bytes:
    - 16
    - 17
    name: scale_and_scroll
    common_to:
    - radendur
    - wheelfir
    - pwball
    - kongball
    bits:
    - field: visible_page
      name: visible_page
      state: confirmed
      evidence: 'the game composes it once per frame together with the offset it adds to every
        sprite''s y: 0x9b3da in Wheels & Fire, 0x506 in Radical Enduro (0x71c is a copy in a line handler
        the game never enters)'
      polarity: 'SOLVED on 2026-07-30: the page IS decided by this bit, read from the register on LINE
        0 of the frame. What was wrong before was WHEN it was read, not the bit. It had been discarded
        at the time because four sites rewrite word 8 and one of them (0xdc7d0, the road one) does not
        carry the bit: on line 0 that one has not written yet, since it only touches vpos 1..53. The
        68000 switches offset and bit together on the PARITY of the frame counter (0x9b3da, and
        0xa5e3c in the High Scores copy). ARBITRATED with a NEUTRAL instrument rather than with a gate
        that favours one model: the time bar the game draws at x=0..1 grows 2 px per frame while
        alternating halves, so its length says which half is shown. With this bit the bar reads
        7,9,11,13,15... with ZERO steps other than +2 out of 27; with the earlier blit-counting
        heuristic it reads 7,4,11,4,15,4... and misses all 27. Over 157 frames of that screen the game
        alternates every frame, this bit changes 156 times and the heuristic 9. And in the RACE,
        frames 1100..1129, it points at the half holding the blits 30 times out of 30, never at an
        empty one. The seven goldens still pass byte for byte'
      note: 'THE FOUR WRITERS, told apart by the vpos they fall on, which is the only thing that
        physically separates them (the access mask does not: all four write the low byte). MEASURED
        with `WFV2_SITIOS` (switch WITHDRAWN)=1 over a whole attract cycle: wf_page_of_frame (0xdc61a; the 2026-07
        measurements recorded it at 0xdc624, which is the NEXT instruction: 0xdc61a writes 0x700011,
        the low byte of word 8, and 0xdc624 writes 0x700017, the y. Verified by reading the code, and
        the evidence below already said it: ''control and then y, line 0 at 0xdc61a/0xdc624'') writes
        ONCE per frame at vpos 0..0 and alternates 951/907, and is the GOOD source of the page;
        wf_stream_scroll_line (0xdc756) injects the per-line table byte, 484870 times at vpos
        1..255, with the bit set in 227290 of them; wf_road_scroll (0xdc7d0) writes 10489 times
        at vpos 1..53
        and does NOT carry the bit even once, which is what made the page look as if it varied per
        line and moved the boundary with the horizon; wf_scroll_vblank (0xdc544) writes 2982 times at
        vpos 247..262, inside the blanking.
        Hence LINE 0 being the right moment to read the bit: there, only the first one has written.
        THIS BYTE IS NOT A RELIABLE SOURCE OF THE PAGE: FIVE different sites write it, once per
        scanline, and they do not agree on the bit. 0xdc756 writes the table byte, which DOES carry
        it; 0xdc7d0 writes the constant 0x80, with the bit at ZERO; 0xdc806 and 0xdc61a write it from
        0x201cbe; 0xdc544 from a register. Keeping the last write of the frame made the race marker
        appear and disappear according to the HEIGHT OF THE MOUNTAINS, because the line on which the
        0xdc7d0 writer comes in moves with the horizon. And the HIGH byte of the word is rewritten by
        every blit with its zoom bits, so reading it while painting is worse still'
      observed:
        wheelfir_road_table_written_above_the_road: 'MEASURED on 2026-10-14 at the MAME pin 62f8ddedc, over the
          race from a clean NVRAM (frame-notifier calls 1100..1300): every write to the road''s per-line
          table (0x201cc8..0x2020c7, from wf_generate_road_table, the stores at 0xa44b0..0xa44c6) fell on
          beam lines 32..95 of its frame, 358 to 510 writes a frame, walking upwards, and none at or
          after line 252, where vblank starts and the frame notifier fires. A Lua read of the whole
          table from the notifier equalled the table replayed from a write watchpoint in 201 of 201
          frames, and was one frame''s pass whole in 199 of 199 frames whose passes differed; the same
          read taken inside the pass (line 54..57, from the 150th write of the frame) mixed two frames in
          199 of 199. The control on the instrument: the Lua write tap and the watchpoint saw the same
          writes, and replaying the tap gave the Lua reads back with 0 mismatches over 38412 words.
          Hence docs/mame-techniques.md: a notifier read of this table is whole, a read inside the
          pass is not.'
        wheelfir_the_warning_sign_blinks_by_design: 'MEASURED on 2026-09-16, the flicker of the
          race''s triangular warning sign, reached in the attract demo by replaying the run that
          showed it (a cold boot, a soft reset at frame 3000 and another at 4510, the demo at
          24950..25010). The sign is five strips from four graphics pages (page 12 (290,250) 26x19,
          page 6 (185,398) 36x11, page 1 (461,495) 46x10, page 0 (453,163) 56x9, page 0 (437,280)
          60x12, descriptors at 0x10b8a..0x10bd2, drawn by 0xe7824 through the clipper entry
          wf_clip_dispatch, 0xe484e). A trigger tap logging every blit shows the five strips emitted on EVEN frames
          only (24982, 24984 ... 24990), always with this bit clear at the blit and into the upper
          half of the sprite plane, while the HUD strip (page 1 (351,143)) is emitted on every frame:
          the emission itself has period 2. Consecutive captures 24981..24992 show the sign on the
          even frames and not on the odd ones (period 2 inside its box, the HUD box stable), so the
          screen shows exactly what the game emits. THE CAUSE IS THE ROUTINE''S FIRST TEST, at 0xe7828 right
          after its register save: `btst.b #0, 0x20b4b6` / `beq` skips the sign when bit 0 of the DRAW-PASS
          counter is clear. Rewritten on 2026-10-11 with what was measured since: 0x20b4b6 is not a
          timer but the counter each screen''s draw pass opens with (`addq.b #1` then `btst #0` to pick
          the sprite list 0x208f2e / 0x2069ae and the page; in the race its only writer is 0xe399a), and
          the pass waits on 0x201cb8, which only the vblank handler sets (0xdc488), so there is at most
          one pass per frame. Over 600 frames of the race demo (control 0xe52f0 19912 hits): 600 passes,
          600 entries into 0xe7824, 300 past the gate. The routine tests nothing else but the
          segment''s hazard nibble below: no countdown, no frame divider. So the sign lives in one page
          of two by the game''s own decision, and its rate is half the draw-pass rate: 25.04 Hz while a
          pass fits in a frame (as here, blits taking no time), 12.52 Hz at two frames per pass, 50.08/2n
          at n, which is the blit-duration question (rltennis_the_blit_duration_is_not_established,
          and the same loop-rate question as rltennis''s waiting animation). What it is not is a timed
          warning blink, because the code has no timer for one. The girl portrait''s old flicker was a
          different thing: she is emitted on every pass, and the fault was the driver''s clearing of the
          halves (wheelfir_double_buffer); here the emission itself is gated; its x
          (0x7a centre, 0xe0 right, 0x14 left) comes from the high nibble of the environment
          record''s segment byte (0x28 + progress/16 into 0x2285e + 0x8c*env), so it is a per-segment
          hazard sign of the track, not the turbo store (the three turbo icons stayed lit
          throughout). Nothing of it is the driver''s: the page model shows each half with what the
          game put there, and the goldens 05/06 stand'
        wheelfir_column_x0_x1_is_not_an_artefact: 'CLOSED on 2026-07-30, and the whole front with it:
          the x=0..1 column is NOT an artefact to be hidden, it is LEGITIMATE VISIBLE AREA of the
          board. Three independent things support it. One, the THREE games of the family draw real
          content there: 6 of the 7 Wheels & Fire goldens, 2 of 2 in Power Ball and 3 of 3 in Kong
          Ball have lit pixels in those two columns. Two, it was already refuted that the window
          starts at x=2: shifting it is a pure translation but leaves two empty columns on the right,
          and Kong Ball and Power Ball draw out to x=335, quite apart from the game''s own clipping
          rectangle saying 336. And three, the bar was SEEN filling on the real machine, and was
          described before it was ever measured. So there is nothing to fix here: what needed fixing
          was the page model, which cut it in half, and that is done'
        wheelfir_artefact_C_leftovers_between_screens: 'ARTEFACT C CLOSED on 2026-07-30, and the E1
          fix closed it without looking for it: a background blit covering the whole visible window
          also writes its index 0, so a new background no longer lets the previous one show through.
          MEASURED at the screen change on frame 2706: ten frames later 33 pixels out of 86016 are
          identical to the previous screen, that is 0.0%. Before, it was the photo''s 27796 index-0
          pixels that showed the race landscape. Superseded by
          wheelfir_the_high_scores_photo_lands_on_a_cleared_plane: the plane is cleared by the
          game''s own word-14 fill, and the rule is withdrawn.'
        wheelfir_artefact_G_mechanism: 'ARTEFACT G, MECHANISM READ FROM THE 68000 on 2026-07-31, and
          the gap turns out to be FOUR lines, not twelve. The whole chain, measured: the road is a
          PRE-DRAWN STRIP in the background plane, not a blit. The plane is filled through the direct
          write channel (two 512x256 windows opened on frames 913 and 937; the first one''s 130048
          bytes are exactly 254 rows and are placed 1:1). Its content MEASURED: rows 0..22 empty,
          strip A in 23..122, empty in 123..155, strip B in 156..255 and the scenery in 256..509. Row
          23 of the strip carries a 6 px road and each following row adds 4. The raster handler
          (0xdc738) walks a table writing each line''s scroll, and that table''s generator (0xa4462)
          computes the row with `row = 0x17 + ((d1-d0) >> 18)`, that is BASE 23 (plus 0x85=133 for
          strip B): that constant CONFIRMS the strip sits where the game believes, so the plane is not
          displaced. Reading D6 at the write instruction itself (0xa44c2) over 222 frames, each
          frame''s FIRST road line ALWAYS uses row 27, with the horizon varying between 127 and 166:
          it is not a lag, it is a constant. And the width the game computes at that end is 16..18 px
          and grows about 4 per line, so ITS OWN GEOMETRY reaches zero width four lines further up.
          Hence the cut: the road starts 22 px wide instead of with the 6 of the strip''s tip, and
          rows 23..26 (6, 10, 14 and 18 px) are never drawn. The horizon comes from 0x2069aa, the
          minimum of the 13 segments'' high lines, pipelined over two frames (0x2069a2 -> 0x2069a4 ->
          0x2069a0/0x2069aa). REFUTED that the scenery is misplaced: the handler of the band above the
          horizon (0xdc7c6) pins the scroll at 257 and that is where the scenery sky starts, which is
          a stop against its top edge.'
        wheelfir_artefact_G_measured_with_the_replayer: 'MEASURED with a validated offline replayer
          (it composes 03_race from the plane and the scroll register with ZERO differing pixels):
          sweeping the source row offset, d=-4 is the ONLY value that leaves the road with its 6 px
          tip, and it also butts the last row of sea (165) against that tip (166). WHAT REMAINS
          belongs to whoever knows the machine: whether the real road reached the horizon in a point
          or was cut off flat. Applying the -4 makes the road converge but leaves it 16 px narrower on
          EVERY line, and that changes the game validated live, so it is not applied without being
          looked at. REFUTED ON 2026-07-31 BY DIRECT OBSERVATION OF THE REAL MACHINE: the road IS cut
          off flat at the horizon, so the -4 is wrong and is not applied. Its symptom: with the -4 the
          road converges to a point, and on the machine it did NOT converge. What is left over is
          SOMETHING ELSE, and that is what stays open: the band of ground between the end of the sea
          and the start of the road. Measured following the same method, inventorying the destination
          boxes of everything painted in that band (scripts/wheelfir_blit_boxes.py, since retired): across the WHOLE
          race demo, frames 962 to 2705, ZERO boxes touch the background plane, neither drawn nor
          discarded. Nothing is painted there and nothing is thrown away. The band is the ground
          colour FILL the game itself writes between where its scenery image ends and where its code
          puts the horizon. And it is NOT that this track''s art is short: read from ROM, the TWELVE
          environment records (0x2285e + 0x8c*env) give the SAME total, 171 rows of image plus 83 of
          fill = 254, with n varying from 2 to 56 and the main image from 116 to 170 rows, that is,
          composed on purpose to add up to 171. The code reserves 174: camera_y = 0x1ae - seg0 - 1 ('
        wheelfir_artefact_G_the_games_own_arithmetic: 'MEASURED on the machine: 430 - 165 - 1 = 264),
          so the last scenery row shown is 429 and the image ends at 426: three rows of fill in plain
          sight. The streamer is a per-row RLE (0xea294) and our arithmetic agrees with its own (D1=172
          and D2=0x54 read with a breakpoint at 0xe9202; 171+83=254 rows written), so we lose none.'
        wheelfir_the_siblings_as_the_control_of_the_three_rows: 'MEASURED on 2026-09-16 (a diagnostic switch since withdrawn, PHASE2=1
          for the siblings): the registration test the fit never had. The same scenes captured
          with the bias at 3 (the driver) and at 0 (a temporary build, restored byte for byte):
          Kong Ball in play (frames 893..900), Power Ball''s demo (2593..2600) and the Wheels &
          Fire race (1460..1464). In every frame the difference is the background sitting three
          rows lower with the bias than without, sprites unmoved: shifting the bias-0 capture
          down three rows explains most of the differing pixels (Kong Ball 21936 down to 13823,
          Power Ball 45705 to 11158, Wheels & Fire 22954 to 12915) and the residue is where
          sprites and edges stand. Whether a monkey on its floor or a ball on its field sits
          right with the three rows or without them is a judgement of the eye, and the pairs go
          to a visual judgement. Nothing here reads a mechanism; the header keeps its line'
        wheelfir_two_measurements_and_no_mechanism: 'MEASURED live on 2026-09-16, the two
          measurements the mechanism hunt was capped at, and it closes without one. ONE, when the
          game writes each scroll and where the model applies it: a write tap on words 8, 10 and 11
          over one race frame logging the beam line of every write. The frame-start writer
          (0xdc510 x, 0xdc52e y=0, 0xdc544 the control byte) lands on line 258, inside vblank,
          right after the level-3 interrupt of line 256; the scenery scroll (0xdc61a the control
          byte, 0xdc624 y) lands on line 0 exactly, timed by the game''s own line counter through
          its phase chain; the raster walk (0xdc756, 0xdc75e, 0xdc764) writes one entry per line
          from the horizon line to line 255, consecutive, none skipped and none doubled (120
          entries from line 136 in the coast section, 103 from line 153 in the snow section). The
          model latches y on its write and shows that row on that line, so no write in the model
          arrives three lines early or late, and a latency in the latch would have to shift the
          road entries too, where the bias shows row y-3 of the entry written on that line while a
          three-line latency would show the entry written three lines before: they coincide only
          where the table climbs one row per line. TWO, the horizon in two environments: with the
          environment id read from 0x20bc6e (1, the coast, at frame 1300; 8, the snow, at frame
          20780 of a cold boot), the scenery y written on line 0 is 294 for a horizon at line 136
          and 277 for a horizon at line 153, that is 430 minus the horizon line in both, so lines
          0..h-1 ask rows y..429 in both environments while the art ends at row 426 in every
          record: the three rows are the game''s own constant (0x1ae = 430) and not a margin that
          moves with the environment. Nothing measured reads a hardware mechanism; the header line
          says what was measured'
        wheelfir_the_convergence_grid_against_the_three_rows: 'MEASURED on 2026-10-19, the known
          answer the fit never had: the service mode''s convergence grid (Test, then the wheel to
          COLOR AND CONVERGENCY, the accelerator for the colour bars and START for the grid; the
          states 0x1d and 0x1e of the menu at 0xddb02). WHAT IT DRAWS, read from the blit log: 336
          background-plane blits of one 16x16 tile, source (301,355) of page 14, at destinations
          x = 16i (i 0..20) and y = 16j (j 0..15), and 336 more at y = 256 + 16j on the next frame; in the ROM
          the tile''s box has its borders on rows 356 and 371 and columns 301 and 316, so with the
          1:1 first-row skip the plane holds border rows 16j and 16j + 15 (the skip itself is
          confirmed here: without it the bottom border would never be drawn). HOW IT IS SCROLLED:
          the raster handler writes word 11 on every line from 1 to 255 with the value line - 1
          (255 of 255 writes), at beam x 93..97, and the frame-start writer 0 on line 257. THE
          SCREEN, rows lit across more than 60% of their width, X untouched as the control: columns
          0, 15-16, 31-32 .. 319-320, 335 at bias 3 and at bias 0 alike; rows at bias 3: 1, 4, then
          19-20, 35-36 .. 243-244 (a lone line at 4 and a short first cell, the odd top seen by
          eye); rows at bias 0 (a temporary build, restored byte for byte and rebuilt): 0-1,
          16-17, 32-33 .. 240-241, every cell the same height, on both of the frames that alternate
          the plane''s two copies. So the three rows break a pattern that is regular without them,
          and the exceptions at the wrap and the scenery boundary are what put the lone line at 4.
          WHAT DOES NOT DISCRIMINATE: the beam position, since the race''s writes land at the same
          place in their lines (raster x 93..97, the scenery write on line 0 at x 109); and a move
          of the picture''s first line, which moves the sky band and the road together. WHAT IS
          LEFT: the grid''s rows fall one line below its columns (0-1 and 16-17 against 0 and
          15-16) because every value is written during the line after the one it names; and the
          race still asks rows 427..429 above its horizon. No reading of the plane puts both right'
        wheelfir_the_three_rows_withdrawn: 'WITHDRAWN on 2026-10-19 from the model, on the
          convergence grid (wheelfir_the_convergence_grid_against_the_three_rows): the background is
          read at its scroll again, row (line + scroll - the line the scroll was written on) & 0x1ff,
          with no exception at the wrap or the
          scenery boundary. Its symptom in the race comes back and is kept as the open item: three
          rows of ground fill between the sea and the road, and the road starting wider than on the
          board. Wheels & Fire''s goldens 01, 03, 04, 05 and 06 and the siblings'' were re-blessed on that decision,
          every pair looked at first (a clean three-row translation, no garbage), and a series of 600
