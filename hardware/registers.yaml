          pass: a breakpoint on 0xe52f0 (WF_FIRE_CASE0, the sprite list dispatcher) counted 14979,
          equal to the fires the capture attributes to that pc; WF_CLIP (0xe498a), the
          forward/forward one of the eight clip variants below, counted 13368. Thirteen fires are
          past the window, and they are three things. (1) Four from WF_VIDEO_RESET (0xe8d8c,
          0xe8dec, 0xe8e64, 0xe8ecc, frames 6 to 12): fills (word 7 bits 2 and 3 both set) declaring
          x 0..32 or 0..1, issued while the rectangle still reads xmax 0, so past it only because it
          is not set yet. (2) Three from WF_CLEAR_SCREEN_END (0xe91ca, 0xe9262, 0xe92ca, frames 909
          and 928): x 0..511 with page 0x3c (0xf00000), the trigger that opens the direct-write
          channel over a whole plane and draws nothing itself. (3) Six from the list dispatcher
          0xe52f0, all on the BACKGROUND plane (word 7 bit 4): frame 263 x 274..353, frame 317 x
          471..38 (a forward walk round the torus whose unwrapped end is 550), frame 350 x 392..471,
          frame 389 x 313..392, and frame 727 x 336..419 and x 503..420 (a mirrored walk). A replay
          from boot with a stop at 0xe55b4 and at 0xe567c (the two paths of WF_ARM_REGISTER, once
          both ends are formed) conditioned on either end above 0x150 stopped exactly six times, at
          those six blits with those ends and at no other, while WF_ARM_REGISTER counted 1196 calls
          and the two captures of the replay came out byte-identical to the first pass. So all six
          were built by WF_ARM_REGISTER, called from WF_CAR_GRAPHIC (the jsr at 0x9cc9e: the return
          address 0x9cca4 read at the four stops of frames 263 to 389, D2 = 0x17) and at frame 727
          from a caller with no symbol, through its two jsr at 0x9c54e and 0x9c57c (returns 0x9c554
          and 0x9c582, D2 = 0x17 and 0x16). WF_ARM_REGISTER never reads the rectangle: both paths
          (0xe558c..0xe5650 forward, from 0xe5652 mirrored) call only WF_SCALE_COORD (0xe47fe), and
          the 256-instruction history at the write of the frame-263 entry (0x208f46, written a byte
          at a time from 0xe559e) runs from WF_CAR_GRAPHIC through 0xe5584 and 0xe47fe with no
          instruction of WF_CLIP. The one branch in the whole ROM whose target is WF_CLIP is the beq
          at 0xe486e (a scan of every bsr, bra, bcc, jsr and jmp form, whose control finds the two
          branches to 0xe48c2 read in the disassembly, 0xe4a32 and 0xe4a48): it belongs to an entry
          at 0xe484e, now named wf_clip_dispatch, which calls WF_SCALE_COORD and then picks one of
