    kongball_armed_every_frame: 'MEASURED live on 2026-09-15 over 600 frames from a cold boot:
      589 arms at 0x28850, the installer 0x288e2 run once, the level-1 handler 3539 times (the
      control). After a soft reset the installer runs BEFORE the first arm, so the handler is in
      RAM when the interrupt could first fire. With the driver''s disable flag in place the
      handler at 0x2100ae ran 0 times; with the flag removed it ran 91835 times in the same 600
      frames (one per line from the armed line 100 down), the level-1 handler count stayed at
