      evidence: the header of the original MAME driver
      note: 'the scroll latches when the low byte of Y is written (word 11). The game writes its
        three pieces in TWO OPPOSITE ORDERS (the raster handler puts the control first; the frame
        close puts it last), and on 2026-08-02 THREE different latching instants were tried to cover
