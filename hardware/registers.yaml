      observed:
        wheelfir_pwball_kongball_census: 'in the layer-enable census of 2026-09-16: a write tap on the blitter block reading the whole register at every trigger, on the three sets of this driver (a diagnostic switch since withdrawn, PHASE2=1 for the siblings), over a long attract and a game in Wheels & Fire (1171369 triggers) and Power Ball (934356), and over the attract of Kong Ball (879685; a coin and a start were pressed and read active at the port, and the screen still said INSERT COIN 3500 frames later, so that set contributes no game). The control in the same tap, the sprite page bit 0x20 of word 8, toggled 38627, 18115 and 15473 times: not one of the five bits rises AT A TRIGGER, in any of the three sets. Bit 0x10 is
          where Radical Enduro folds bit 8 of word 4, and here word 4 never reaches 256'
        wheelfir_pwball_kongball_every_write: 'the same day, a second tap counting EVERY write to the
          low byte with any of these five bits set, since a sample at the trigger cannot see a
          value written and overwritten between two blits: Power Ball and Kong Ball, 3000 frames
          from a cold boot, zero such writes. Wheels & Fire, 1500 frames: 52 writes, all from the
          raster handler in RAM (0xdc756, the control byte it takes from its per-line table), all
          of the value 0xa3, that is bits 0 and 1 set beside the page bit and bit 8 of the scroll
          y. Nothing else writes them and no trigger ever sees them (the next blit rewrites word
          8). Two low bits carried by 52 of some 384000 per-line writes, which the entry below
          traces to the boot, and not a plane enable, which would have to survive to a trigger'
        wheelfir_the_52_writes_are_boot_garbage: 'MEASURED live on 2026-09-16, and it closes the
          52: a console watchpoint on the low byte with the condition (wpdata&3)!=0 stops the
          machine in the raster handler at 0xdc756 with A6 = 2, that is, in the first frames after
          a boot or a soft reset (frame 16 from a cold boot, 17 after a reset), before the game has
          pointed A6 at its per-line table: (0x200,A6) then reads ROM address 0x000202, whose byte
          is 0xa3 (the vector table entry there is 0x000ea3ce). The same watchpoint guarded with
          A6 >= 0x200000 never fires over 20461 frames after a reset (several attract cycles,
          the car screen and the race demo among them), while the unguarded one fires at once. So
          the two low bits were never a value the game drives: they are the interrupt firing
          before its table exists, copying a ROM byte. Bit 0x10 of the same byte IS driven with a
          shape: both raster-table builders (the race one, 0x9b474, and the car-screen one,
          0x9bca6..0x9bcb4) load 0x20bc50, write its low byte to word 4 and fold its bit 8 into
          this bit (`lsr.w #4; andi.w #0x10`), exactly as Radical Enduro does; the value never
          reaches 256 in Wheels & Fire, so the bit stays clear here'
      meaning: 'the low five bits of word 8 are not used by the games; bit 0x10 is where bit 8 of
        the value behind word 4 is folded, and only Radical Enduro could raise it'
    - mask: 256
      name: stall_counter_u_bit5
      state: confirmed
      evidence: 'MEASURED on 2026-09-05 without MAME, on top of the sweep that first placed it (set on 7369 to 6467 scaled blits): the driver''s zoom_index[400] table decoded into its fields and checked against the REAL scale each descriptor of the ROM produces (tables at 0x400 and 0x1d10, found by the known answer 100 = identity, 200 = double). The board author''s stall-counter model reproduces the 192 distinct descriptors with a worst error of 0.76 points, none above 1. The field is 6 bits: five in word 0xa/0xb/0xc and this bit as bit 5. This is the write-side counter: stalling it gives the scales BELOW 100%.'
      meaning: 'bit 5 of the horizontal STALL counter (write side): its low five bits are n, meaning n ticks and one stall, scale n/(n+1): 80% = 4, 50% = 1. Bit 5 is set exactly when the OTHER counter (repeat) is active: on the idle counter in pure scales (value 32), on both in the 326 combined scales (60 = 1/2 x 6/5, 75 = 1/2 x 3/2, 90 = 6/7 x 21/20). A combined scale is a descriptor of wf_zoom_desc_x whose two counters both have a non-zero count. The tables the descriptors point at follow the five low bits alone (wheelfir_the_scale_tables_are_the_counters)'
