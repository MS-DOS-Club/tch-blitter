        wheelfir_the_scale_tables_are_the_counters: 'THE GAME''S SCALE TABLES ARE THE TWO COUNTERS
          WRITTEN OUT, READ on 2026-10-19 from the program ROMs, which is what lets the driver scale from the register fields alone. A
          descriptor of wf_zoom_desc_x maps a source offset x as (2x + A[x] - B[2x + A[x]]) >> shift,
          and with r and s the five low bits of its repeat and stall fields its tables are
          A[x] = 2 * floor(x / (r - 1)) and, as words, B[u] = 2 * floor(u / (s + 1)), a field of 0
          giving a table of zeros, with shift 1, then 2 under clock_halve and 0 under clock_double. So x
          lands on w = u - floor(u / (s + 1)), with u = x + floor(x / (r - 1)), halved or doubled by
          the clock bit. The descriptor of the same percentage in wf_zoom_desc_y points at the same
          tables with the same shift; only the bytes it ORs into the register follow the vertical
          layout. scripts/wheelfir-blit-law.py --full re-derives it: it decodes each descriptor''s
          fields from the horizontal bytes, compares A, B and the shift with the counters over every
          entry the program leaves room for (the gap to the next table), in Wheels & Fire and in Kong
          Ball, and every descriptor the blitter can reach agrees, while a
          repeat or stall phase moved by one disagrees on every descriptor that runs that counter.
          It also walks every scaled axis of the capture under hardware/evidence/wheelfir-blit-law/
          through the inverse of the tables'' map and through the counters, and the source column of
          every step agrees. The descriptors below 25% carry fields of zero, which decode as 1:1.
          WHAT THIS DOES NOT ESTABLISH: the tables are the program''s expectation of the blitter, so
          the phase the counters start in is the one the game expects, not one measured on the
          FPGAs.'
        wheelfir_blits_past_the_clip_window: 'BLITS PAST THE CLIP WINDOW, MEASURED on 2026-09-28 on
          live debug sessions of wheelfir over window 1 of the search (boot to frame 1500 of the
          attract, no controls, the race demo inside it); window 2, a played race, was measured
