  observed:
    wheelfir_a_cabinet_alone_measured: 'MEASURED live on 2026-09-16 from a cold boot, the
      machine unaltered until the control at the end: a tally on the port plus four control
      breakpoints and two stop breakpoints. Over 7500 frames (the boot, the whole first attract
      and into the second) the poller 0xa4962 ran 373842 times and its "nothing pending" exit
      0xa4a6c exactly 373842 times, so not one of its four reads of bit 13 came back clear; the
      protocol entry 0xa499e and the byte take 0xa4d08 never stopped the machine; the boot
      handshake was never reached on either of its branches (0xa4816 and 0xa47c2, 0 hits each).
      The port''s traffic in that stretch: 373842 high-byte writes from the poller''s exit
      (0xa5088, bit 0x40 cleared on the shadow), the 0xac/0xff ping 6923 times each (0xa4936,
      0xa494a), the vblank and raster writers of the sound block bits, the EEPROM bit-bang at
      boot, and one 0x00 to the link byte. CONTROL, which makes the zero a measurement: with the
      pc forced past the four reads into 0xa499e, 0xa5052 ran once (bit 0x40 raised, the high
      byte then written 0xe8/0xf8 by the vblank writer) and the game sat in the receive loop
      0xa4cd8..0xa4ce2 waiting for bit 13 to clear for 30 frames while the poller count stayed
      still: the protocol path is live and blocks on a partner, and the game never takes it on
      its own because the bit reads one. The driver''s constant one is the state of a cabinet
      whose EEPROM says NUMBER OF PLAYERS 1, which is what the ROM and the shipped EEPROM say'
    wheelfir_the_link_is_a_menu_setting_and_its_two_cabinet_path_is_not_walked: 'READ from the
      68000 and seen on the machine, 2026-09-16, through the board''s own service menu (Test held
      240 frames from a cold boot, START for the joystick cabinet, the page state forced to the
      COMUNICATION page because the menu cursor moves only with the WHEEL bits of the latch
      0x20bd5c, which a joystick cabinet has to turn through the steering ADC). The page shows
      NUMBER OF PLAYERS 1 and PLAYER NUMBER 1 and says USE JOY AND FIRE 1 TO SELECT, PUSH START 1
      TO QUIT: its handler (0xdea60..0xdeab6) moves its line with latch bits 0-1, toggles
      0x20bc9a (NUMBER OF PLAYERS, 0 = one) or 0x20bc98 (PLAYER NUMBER, 0 = first) with bit 4,
      quits with bit 8; both live in EEPROM byte 0x7e, bit 0 and bit 1 (saved by 0xdd774..0xdd78c,
      loaded by 0xdd550/0xdd55e). 0x20bc98 is the flag every link routine tests (the poller
      skips its ping when it is set, the boot handshake picks its branch on it), and 0x20bc9a
      gates the two-cabinet path at boot (read from the code, and not reached in the measured
      run below: 0xea504, with two players, player one lowers the handshake line and writes 0xff
      to the link byte, player two raises the line; 0xea4da also arms a link session through
      0xa450e). THE WAIT, MEASURED live on 2026-10-09: the shipped
      EEPROM with byte 0x7e set at the instant the game reads it (0xdd546) and a cold boot,
      a tally on 0x7c0000 and controls on 0xa4816, 0xa47c2, 0xa450e, 0xea504, 0xa482e, 0xa4962
      and 0xa4a6c beside the sprite dispatcher 0xe52f0 (171 hits before the wait, so the cpu
      ran). Both cabinets stop in the boot handshake behind 0xa450e (1 hit each) and show
      WAITING COMUNICATION, the same picture byte for byte; neither leaves it in 3300 frames,
      and the only way out the code offers is TEST (P1 bit 12, a jmp to the menu at 0xdd31e).
      PLAYER NUMBER 1 (byte 0x7e = 0x01, 0xa4816 1 hit, 0xa47c2 0): writes 0x00 to the link
      byte once at frame 26, then reads the port high byte at 0xa4846 waiting for bit 5 to
      differ from its first reading (14207241 reads, D2 still 0x63): its 99 turns count
      TOGGLES of the partner line, not time, so a line held still never ends the wait. PLAYER
      NUMBER 2 (0x03, 0xa47c2 1 hit, 0xa4816 0): writes 0xf8 to the high byte once (0xa5052),
      then loops 0xa47c6..0xa47fc, writing 0x78 and 0xf8 to the high byte (bit 15) 2515158
      times each and reading the link byte at 0xa47cc and 0xa47de as often, waiting for the
      partner''s 0xa5; the driver answers 0 there. 0xea504, the two-cabinet boot, 0xa4962 and
      0xa4a6c ran in neither, so the game behind the wait was not reached: what lies past the
      handshake needs a partner the driver does not model'
    wheelfir_7c0000_is_not_the_adc: 'REFUTED on 2026-07-30, and worth recording because the lead
      was tempting: that bit 0x2000 of the 0x7c0000 read was the ADC0808''s EOC. It is NOT. The
      EOC does live in a 0x2000 bit, but of port P1, which maps at 0x7e0000, a different address;
      the bit number coincides and nothing else. The symptom of having believed it would have
      been treating as modelled a port that still is not: of the 0x7c0000 read the only real
      thing in the driver is bit 15, the EEPROM data output. Bit 0x2000 is polled by the game 54
      times per frame from 0xa4962 for a COMMAND protocol (it compares against 0xF2, 0xF3,
      0xF4...), which looks nothing like an end of conversion. Our value (always one) remains a
      reasoned choice and PROVEN neutral in pixels, but not measured against the board'
    wheelfir_port_7c0000_bit2000: 'FINDING of 2026-07-30, and the cost is OURS: the driver feeds
      bit 0x2000 of the 0x7c0000 read with machine().rand(), a placeholder the original author
      left with a "// ?". The game POLLS that bit 54 times per frame from 0xa4962 (four
      consecutive reads per call), and if it comes out zero it enters a command protocol (0xa5052
      and 0xa4cd8, comparing against 0xF2, 0xF3, 0xF4...). So half the time, AT RANDOM, the game
      goes down the expensive path. MEASURED with the bit tied to one: the engine screen arrives
      66 frames earlier (2709 instead of 2775), so the game runs measurably faster, and the blits
      per frame rise from 22 to 25. And it BECAME THE DEFAULT after PROVING it changes not one
      pixel, which is what the rule demands: locating each scene by CONTENT within a 100-frame
      window, the three race goldens come out BYTE FOR BYTE IDENTICAL (0 px difference) with a
      constant shift of -7 frames in all three, and the four attract ones do not move at all. So
      the game reaches the same scene sooner; what needed correcting was the frame number in
      scenes.conf, not the golden. With that the gate returns to 7/7. Switch to go back:
      `WFV2_7C0` (switch WITHDRAWN)=rand. HONEST CAVEAT: the rand() did NOT make the run irreproducible in practice,
      because MAME seeds its generator deterministically. MEASURED with SERIES_DOUBLE=1 over 101
      frames: 0 differences between two runs with the fix and 0 without it either. What the fix
      buys is game TIME, not determinism: half the queries stop sending the game down the
      protocol''s expensive path. What is still unknown is what that port really is: the byte the
      game WRITES to 0x7c0001 alternates 0xAC and 0xFF, which doubled are 344 and 510, the
      visible and plane widths'
- address: 0x7e0000
  name: player_inputs
  common_to:
  - radendur
  - wheelfir
  - pwball
  - kongball
  description: 'The two 16-bit input ports (P1 at 0x7e0000, P2 at 0x7e0002): joystick, three
    buttons, start, coin and the Test switch, active low, with the ADC0808 end-of-conversion on
    bit 13 of P1. Wheels & Fire folds them, with the three ADC channels, into the latch at
    0x20bd5c that the whole game reads, built by the routine at 0xea1f0.'
  state: confirmed
  evidence: 'the driver''s INPUT_PORTS and the latch builder read in the 68000 (0xea1f0: bits 0-3
    from the wheel through 0xa535c with a dead zone of 3, bit 4 from the accelerator above 128 OR
    P1 up, bit 5 from the brake OR P1 down, bit 7 from P1 button 1)'
  observed:
    wheelfir_both_pedals_switch_above_128: 'MEASURED on 2026-10-15, Wheels & Fire at frame 600: 0xa52fa
      reads an ADC channel and counts the thresholds of that channel''s RAM table below the value;
      the latch builder only tests the count for non-zero (0xea234 channel 1, 0xea246 channel 2).
      The accelerator''s table at 0x20c818 and the brake''s at 0x20c858 both read 128, 30000, so
      each pedal is pressed from 129. Control: the channel-0 table at 0x20c7d8 read all zeros in
      the same read'
    kongball_a_coin_started_game_runs: 'MEASURED on 2026-10-15 on the driver with the vblank
      withdrawal of the line-counter request: a coin at frame 600 and START at 700, a snapshot every
      250 frames, each opened: ROUND 1 INICIATION at 1000 and the round in play to 5250, the INSERT
      COIN on the right being the second player''s slot. The census of 2026-09-16, where the screen
      still said INSERT COIN 3500 frames after a start, was taken on an earlier driver'
    wheelfir_controls_measured_live: 'MEASURED live on 2026-09-16 at real
      speed, a person at the controls, the latch and the car''s speed read at stops. Keyboard
      LCTRL held: P1 dfef, the accelerator port ff, latch df6f (bit 4 and bit 7 both clear),
      speed 34: MAME''s default binds LCTRL to P1 Pedal 1 AND to P1 Button 1, so one key is both.
      Left arrow alone: the steering port at ff, latch dffa, wheel index 7; with LCTRL held the
      steering port stayed at 7f and P1 carried no joystick bit, because Ctrl plus an arrow is
      taken by macOS before the emulator sees it. DualSense R2 alone: accelerator ff, latch dfef
      (bit 7 set), speed 23, the plateau; R2 plus Cross (P1 Button 1): latch df6f, speed 33. So
      the physics at 0xe7146 is faithful (no bit 7, no speed past 24) and the pedal is two steps;
      what misleads is the default mapping, not the driver (the two-step reading is revised under
      wheelfir_button_1_is_a_low_high_gear_lever: bit 7 is the gear lever). The high-score table walks its
      letters on the latch''s wheel bits and accepts on bit 4, so the keyboard only advances with
      UP; why the wheel runs the letters backwards is the game''s fold, recorded under
      wheelfir_the_high_score_letters_run_against_the_wheel_by_design, not the paddle''s
      PORT_REVERSE'
    wheelfir_button_1_is_a_low_high_gear_lever: 'MEASURED on 2026-10-19 on the Mac mini M4, read
      in the 68000 and checked in races from a coin on the driver with the lever as a toggle: the
      car''s routine at 0xe7140 reads bit 7 of the latch (P1 button 1) beside the accelerator''s
      bit 4, and the player car''s structure (0x20692e, the routine''s A2 in a race) holds the
      speed at +0x38 and the gear at +0x3c, which an automatic gearbox steps up from a table at
      0xe63f6 (per gear the acceleration and the speed that shifts up). In low (bit 7 set) the
      routine stops accelerating from 0x180000 (0xe714c) and takes the coasting branch at 0xe7276,
      which subtracts the gear''s deceleration from the table at 0xe6426 and shifts down below
      its floor: a race in low settles in gear 1 with the speed between 0x17e0xx and 0x189xxx
      (frames 850 to 3000, high from 400 to 640 then low; the speed''s only writers 0xe7270 and
      0xe72a8 beside the start''s, control 0xea1f0 2509 hits). In high it climbs to gear 4 and
      past 0x460000 (a tap at 400 and another at 1800: gears 0 to 4 and 14 of 44 samples above
      0x320000 from 700 to 1799, gears 0 to 2 and none above it from 1900). The clamp to gear 2
      and 0x1c0000 that both branches carry for bit 7 set (0xe724a, and 0xe71b8 under the turbo
      flag) is reached only when one step crosses from below 0x180000 to above 0x1c0000: zero
      hits over frames 1000 to 1100 in low. The speed held at exactly 0x320000 is not the low
      gear: FUN_000e700a writes it at 0xe7090, slowing the car by 0x7d00 a frame down to that
      floor, in frames 609 to 724 of the same race. So button 1 is a low/high gear lever, and the
      driver makes it a toggle named Gear Shift, declared as button 4 so its default key is free,
      with a layout that draws it LOW or HIGH. This revises wheelfir_controls_measured_live, which
      read the same plateau as a pedal of two steps'
    wheelfir_the_high_score_letters_run_against_the_wheel_by_design: 'MEASURED on 2026-10-11,
      read in the 68000 and checked live. The race and the high-score entry read ONE wheel value,
      so no driver setting can make one of them right and the other wrong. The game quantises
      channel 0 once per frame (0xa535c, called only from the latch builder 0xea20c; in a 600-frame
      stretch of play the control 0xe52f0 fired 6893 times, 0xa535c 666, 0xa52fa 1332, 0xa53c2 0)
      into a signed index at 0x201c68, which the race uses as is (0xe6030: steering = index *
      0x1400 / 7) and which the latch builder folds onto the stick bits: a positive index past the
      dead zone clears bits 0 and 2 (0xea230, andi #$fffa), a negative one bits 1 and 3 (0xea224,
      andi #$fff5). With the wheel field at 240 the routine wrote +7 and left the latch at dffa.
      What each bit means is the game''s own statement, not the driver''s naming: the attract
      controls screen (0xe8878) draws a joystick sprite from page 13, upright (0xff18), leaning
      right when bit 3 is clear (0xff2a) and leaning left when bit 2 is clear (0xff3c); and the
      race''s stick path (0xe6086) adds 0x200 to the steering for bit 3 and subtracts it for bit 2,
      the same sign as a positive wheel index. So a wheel turned the way that steers the car
      right sets the stick''s LEFT bit. The entry (0xa5aa6) walks its alphabet (".ABC...Z0-9,-" at
      0xa5cdf) backwards on bit 2 (0xa5ba8) and forwards on bit 3 (0xa5b7e), natural for the stick
      cabinet. The wheel cabinet therefore runs the letters against the wheel by the game''s
      design. The EEPROM''s calibration (seven values, left/right/centre for the wheel) decides
      which end of the ADC is positive for the race and the table together, and stores no
      separate direction. No driver change'
    wheelfir_adc_clock_is_not_the_slow_accelerator: 'REFUTED: that the ADC0808''s declared clock
      (500 kHz, marked unknown in the driver) makes the analogue accelerator feel slow. The measured
      wait for the end of conversion is 136.2 us on average (134 to 163), which is what that clock
      programs (64 ticks, 128 us) plus the start. And the game SPINS on the EOC bit (0xa52fa) until
      the conversion ends, so another clock could only spend more CPU (the three channels take about
      2% of it), never deliver a value late. The slowness is the low gear''s ceiling
      (wheelfir_button_1_is_a_low_high_gear_lever)'
- address: 0x7a0000
  name: line_counter
  common_to:
  - radendur
  - wheelfir
  - pwball
  - kongball
  description: 'The line counter: the game writes how many lines to wait, the beam decrements
    it once per line while bit 13 of 0x7c0000 enables it, and at zero the 68000 takes level 5. That interrupt is the SOUND
    STREAMER''s clock on all four games: its handler posts one word per line to the sub CPU
    through the soundlatch and re-arms the counter with 1 for the next line. In Wheels & Fire
    the same handler also writes the road''s per-line scroll, hence the name "raster interrupt".'
  state: confirmed
  evidence: 'Wheels & Fire: the three arms of the raster handler write 0x740000 before anything
    else (0xdc74e, 0xdc78a, 0xdc7c6) and re-arm with 1 (0xdc76a, 0xdc7a6, 0xdc816). Kong Ball:
    the vblank handler arms 100 at 0x28850, and its level-5 vector (0x2100ae) holds the handler
    the reset code copies there (0x288e2, called from 0x4a502), which writes the soundlatch
    (0x2890e, 0x28932), sets the sound block bits of 0x7c0000 (0x28958..0x28968) and re-arms
    with 1 (0x288fa). Power Ball: arms 100 at 0xf4da and installs its handler at 0x20df0a
    (0xf56a). Radical Enduro: 0x520 and 0x538 arm it and the vector jumps to a trampoline in
    RAM (0x20f908 -> 0x203164), recorded in its driver'
  observed:
    rltennis_the_earlier_boards_unknown_ports_in_one_run: 'MEASURED live on 2026-10-13 on rltennis
      (this repository''s driver), one run from a cold boot through 1800 frames of attract, a coin,
      a start and a match to frame 5120 (the court and the score on screen at the end, the
      capture opened). CONTROL: a breakpoint on the level-4 handler 0x564, armed before frame 0,
      counted 1421 hits, 330 of them in the first 1800 frames. That count is the instrument''s, not
      the game''s: re-measured the same day over the same 1800 frames from a cold boot, a breakpoint
      on the handler''s second instruction, 0x568, logging its frame, fired in 1752 distinct frames,
      every frame from 48 on (frames 0..47 run with the interrupt mask at 7, read by a frame
      notifier), while the control on 0x564 counted 330 again. So the handler runs once per frame
      and a control on the first instruction of an interrupt handler misses most entries. A
      read tap on 0x7a0000 and one on 0x7a0002: ONE access each, both at frame 64 from 0x89d4, one
      long read, data 0, and none after it, so the 51 absolute references the static scan counts
      to 0x7a0000 are not taken in that run. A write tally on 0x780000: 1025 writes, 1023 of them
      0x0044 (from 0x84a and 0x8ce), one 0x0004 and one 0xfffe (0x20ac, the boot). MAME''s log of
      unmapped accesses, which logged the game''s writes to 0x1010/0x1012 in the same run, logged
      NONE in 0x700000..0x7fffff, which covers writes to 0x7a0000 (the driver maps it for reads
      only), so the six addresses the program names and the driver does not
      map (0x700010, 0x700015, 0x700018, 0x780008, 0x78000c, 0x7c0000) were not accessed in that
      run either. What 0x7a0000 and 0x780000 are on the board is not settled by it'
    radendurh_the_block_at_line_99_keeps_the_sound: 'MEASURED on 2026-10-12 on radendurh, with
      the counter gated on bit 13. Radical Enduro''s vblank handler runs the same sequence as Power
      Ball''s (0xffff to the latch, 0x31 to the block count, the counter armed, bit 13 set) but arms
      the counter with 1 (0x538) where Power Ball arms 100 (0xf4da) and Kong Ball 100 (0x28850), so
      its block starts at line 0, under the drawing chain the frame opens with, and theirs at 99,
      after it. The operand set to 100 by a write to the ROM region from frame 20 on (past the
      boot): over 30 s of attract the sub stays in its idle loop, and the block words it read with
      no write from the main since its previous read fall from 28 in 410 blocks to 1 in 1488. Set
      from the start, the boot kills it instead: the boot lowers the mask at 0xf2106 (stacked pc
      0xf210a) on line 137 of frame 12 with a vblank request pending, which arms 100, the block
      starts at line 237 and the vblank cuts it, as in Power Ball. Power Ball''s own boot clears bit
      13 right after its first unmask; radendurh''s sound layer does the same at 0xf210a. With that
      layer: seconds with sound out of 30, 23 in attract and 23 in a race (7 and 13 before); 103
      of 120 over two minutes of attract and play, the sub alive throughout, 11 words read twice in
      5987 blocks; the boot''s close lands on line 138. The silent seconds repeat at the same
      places in attract and in a race with the sub idle. The dump keeps its 1 and its goldens 5/5;
      radendurh''s 05_desert_scenery moved in its speedometer needle only, the view and the
      scenery identical. Superseded for the set by radendurh_the_blitter_handlers_hold_off_the_sound:
      the set no longer carries this layer, and the counts above are the instrument that record reuses.'
    pwball_bit_13_of_0x7c0000_enables_the_counter: 'MEASURED on 2026-10-12, every write to 0x7c0000''s high byte
