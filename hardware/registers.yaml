    description: 'Writing 0x0000 ARMS the command and clears the transparency mode latch; writing
      0xffff EXECUTES it. The arming comes first and the parameters afterwards, which is what proves
      that the mode is not inherited between blits. The arming write is ALSO the interrupt
      acknowledge, the write that drops the blitter''s held IRQ line.'
    state: confirmed
    evidence: 'READ FROM THE 68000 of Wheels & Fire in a live debug session. The level-1 autovector at
      0x64 holds 0xe5274, whose handler takes the sprite record pointer from 0x20b4ae, emits ONE blit
      and returns with a BARE rte, touching no mask. A write watchpoint on 0x70001e gives the per-blit
      sequence and the pc of each write: 0x0000 from 0xe52d0 (arm), then 0xffff from 0xe52f0 (trigger,
      followed by lea (0x18,A1),A1 to walk to the next 24-byte record), after which the cpu lands
      DIRECTLY back in 0xe5274. The mainline only kicks the first trigger, from 0x9bc74. So the line
      is a HELD LEVEL raised by the blit''s completion and lowered by the arming write, and the chain
      sustains itself: one interrupt per blit. What times it is the game''s OWN interrupt mask, in the
      same two values Radical Enduro uses: 13 sites in the ROM write `move #$2000,SR` to open IRQ1 and
      22 write `move #$2100,SR` to close it. It answers the question the original driver left written
      above its own set_input_line, "blitter irq? should be timed?"'
    observed:
      pwball_idle_level_at_reset: 'THE LINE IS ASSERTED WHILE THE BLITTER IS IDLE, from reset,
        read from the 68000 of Power Ball: its level-1 handler (0xeabe) tests the list pointer
        0x201012 and, with an empty list, sets the idle flag 0x20100e and returns with the mask
        closed (`andi.w #$f8ff` + `ori.w #$2100` on the stacked SR); its mainline spins at 0xf246
        until that flag is set and only then fires its first blit (0xf250). With the line only
        raised on a completion nothing ever sets the flag, which is what the original driver''s
        "courtesy" IRQ1 on line 224 (`m_force_extra_irq1`, "pwball and radendur won''t boot
        otherwise though") was standing in for. Kong Ball''s handler (0x30fd0) has the same
        shape. MEASURED on 2026-09-15 by replacing that line with the level asserted in
        machine_reset, as the Radical Enduro driver already did: Power Ball and Kong Ball boot,
        and the 21 goldens of the family stay byte for byte, Wheels & Fire''s seven included.'
      rltennis_arms_then_fires_one_word: 'THE EARLIER BOARD ARMS AND FIRES THROUGH ONE WORD, its
        0x70000c, and no single written value names a blit. MEASURED on 2026-10-03 with a count
        watch on 0x70000c over the first 900 frames of the rltennis attract from a cold boot:
        14557 writes, 7274 from pc 0x4f0 and 7274 from pc 0x50a, the rest nine single writes of
        the boot code at 0x20ba..0x216a. The writes from 0x4f0 carry bit 14 clear (0x00e8 4016
        times, 0x01e8 3258) and those from 0x50a carry it set, with bit 15 (the layer) and bit 8
        (the ROM MSB) as the blit asks: 0x41e8 2871, 0x40e8 2072, 0xc0e8 1944, 0xc1e8 387, and
        0xc000 five times at boot. So the game clears the strobe and then raises it, once per
        blit, which is the 0-to-1 edge rltennis.cpp fires on, and the firing value takes five
        forms. A description of the blit that fires on one written value cannot name these, which
        is why hardware/gfx-rltennis.yaml states no blit command.'
      rltennis_the_chain_needs_a_held_level: 'THE EARLIER BOARD RUNS THE SAME BLIT CHAIN, read
        on its 68000 on 2026-10-03, both sets: the level-1 autovector (0x64) holds 0x42a, which
        takes the list header at 0x208012, emits ONE blit of its 14-byte descriptor and returns,
        and when the list is empty closes IRQ1 in the stacked SR (ori #$200, andi #$faff) and
        clears the busy word 0x208010. The main loop waits while 0x208010 is set (0x2b28 and six
        twins), then loads the list, sets 0x208010 to 0xffff and OPENS the mask (andi #$f8ff at
        0x2b50 and twins): nothing else starts the chain, so it starts only if IRQ1 is pending
        when the mask opens, which a line held while the blitter is idle guarantees and a pulse
        per blit does not. That is the dead loop rltennis.cpp avoids by raising IRQ1 at every
        vblank ("Hack, to avoid dead loop"). MEASURED with debugger controls over frames 1200 to
        2400 of the attract (control: the vblank handler 0x564 hit 1200 times): the four kick
        sites hit 782 times and the terminal path 0x44a 782 times, one chain per kick, 0.65 a
        frame. A build with the held level instead (asserted at reset and after each blit,
        dropped by the arming write, no IRQ1 at vblank) boots both sets and plays a whole match
        to the continue screen and back to the attract, with one chain per kick still (4889 and
        4889 over 2400 frames, about 2 a frame), and the rally itself paced as before: the same
        events of a rally fall the same 428 frames apart in both builds. But every screen whose
        length the game counts in loop turns gets shorter, because here a blit takes no time:
        the title photo is on screen for frames 220 to 460 with the vblank IRQ1 and for frames
        90 to 110 with the held level, and the player select screen lasts about 280 frames
        against about 100. So the held level is the mechanism, and its timing on the board
        depends on how long the blitter takes per pixel, which nothing here measures (the laws
        derived from the crystal were tried: rltennis_the_blit_duration_is_not_established).'
      rltennis_the_waiting_animation_is_timed_in_loop_turns: 'MEASURED on 2026-10-11, the players''
        waiting animation, which looks too fast. In the attract demo (frames 820..900, the near
        player in his ready stance while the ball travels) every pose lasts exactly 2 frames: a cycle
        of five poses at 823..838, of six at 856..867, repeated from 891. Over those 80 frames the
        main loop started one blit list per frame (0xffff to 0x208010, alternating 0xab48 and
        0xac58) and the IRQ1 handler closed each (0x44a), with 2635 IRQ1 entries in all: one per
        blit plus the vblank pulse, about 33 per turn. The only interrupt tied to the frame is that
        IRQ1, and its handler (0x42a) walks the blit list and clears 0x208010, touching no game
        counter; so the animation, like the title, player select and continue screens, advances per
        main-loop turn, and one turn per frame here is the driver''s vblank pulse starting each
        chain. A pose every 2 turns is 30 poses a second at one turn per frame; on the board the
        turn rate follows how long a list takes to draw, the blit duration this record''s neighbour
        leaves open, the same question as the Wheels & Fire warning sign
        (wheelfir_the_warning_sign_blinks_by_design). No driver change'
      rltennis_the_blit_duration_is_not_established: 'NO BLIT DURATION OF THE PLANNED GRID PUTS THE
        CONTINUE COUNTDOWN OF RLTENNIS AT A SECOND A STEP, so none is applied and rltennis.cpp keeps
        its vblank IRQ1. MEASURED on 2026-10-03. The candidate laws were fixed before measuring,
        with no fitted value: a blit takes (pixels walked, stall steps included, i.e. per axis the
        larger of the source and destination steps) x k clocks + s clocks of f, with f = 32 MHz /
        {1, 2, 4, 8}, k in {1, 2} and s in {0, 16}: 16 candidates, four distinct pixel times. Each
        was built as an experiment of rltennis.cpp (IRQ1 held from reset, dropped by the arming
        write, re-asserted when the modelled duration elapses, no IRQ1 at vblank) and of
        radendur.cpp (the same, dropped by the 0x0000 arming write) and run from a cold boot,
        headless, through the same inputs. Calibrators, both read as seconds and both timed in loop
        turns: the continue countdown of rltennis (0x20b19d holds the digit x 4; 9 to 1 after a lost
        match, coin at 1200, start at 1341, no play), at the driver''s 60 Hz, and the race clock of
        radendur_the_race_clock_is_timed_in_loop_turns, at that entry''s field rate. A candidate
        passes when every step of both is 0.9 to 1.1 s. Mean frames per step, rltennis / radendur:
        32 MHz k1 12.25 (12.12 with s 16) / 54; 32 MHz k2 and 16 MHz k1 22.00 / 54; 16 MHz k2 and
        8 MHz k1 41.75 / 54; 8 MHz k2 and 4 MHz k1 81.38 (81.50 with s 16) / 54; 4 MHz k2 not
        measured / 56.55 and 57.00 (steps of 53 to 89 frames). The countdown fails every law it was
        measured under (0.20, 0.37, 0.70 and 1.36 s a step), while the race clock stays at 54 frames
        under all but the slowest pixel time, so it excludes only those two, which the countdown
        does not measure: their game reaches the continue screen (opened capture at frame 12700) but
        0x20b19d does not follow it in that build. The countdown grows with the pixel time (12.25,
        22, 41.75 and 81.4 frames at 1, 2, 4 and 8 clocks of 32 MHz per pixel). The reference
        values: with the driver''s vblank IRQ1 it steps every 30 frames (0x20b19d at frames 6922 to
        7192 of a cold boot), and with instant blits and the held level about 7
        (rltennis_the_chain_needs_a_held_level, 9 to 1 in 60 frames). CONTROL: the vblank down-counter
        0x209204 (rltennis_counts_60_fields_a_second) steps every 60 frames under every candidate,
        its few short steps coming in pairs that add up to 60. WHAT THIS DOES NOT ESTABLISH: a law
        outside the grid (the one interpolated between 4 and 8 clocks of 32 MHz was fitted afterwards
        and fails out of sample: rltennis_a_fitted_blit_duration_does_not_save_radendurs_sound); that
        the countdown was meant
        to be a second (only the race clock carries its own constant); that the earlier and the
        expanded board share one duration law, which the joint criterion assumes; and the absolute
        scale, since the 32 MHz is radendur''s crystal and rltennis''s CPU divider is a guess.'
      rltennis_a_fitted_blit_duration_does_not_save_radendurs_sound: 'A PIXEL TIME FITTED ON THE
        CONTINUE COUNTDOWN OF RLTENNIS DELAYS RADICAL ENDURO''S MUTE AND DOES NOT REMOVE IT. MEASURED on
        2026-10-05, a FIT and never a derived value: from the grid''s own frames per step (12.25, 22,
        41.75 and 81.38 at 1, 2, 4 and 8 clocks of 32 MHz per pixel walked) the countdown reaches 60
        frames a step at 5.84 clocks (a regression over the four, 9.882 frames a clock plus 2.287,
        and the interpolation between 4 and 8, 5.842, agree). Built as the grid''s experiment law
        (rltennis_the_blit_duration_is_not_established) with that pixel time and no setup, for both
        drivers. In sample, rltennis: the countdown steps 60 frames, eight steps of eight; CONTROL,
        the vblank down-counter 0x209204 still steps every 60. Out of sample, radendur: the race
        clock of radendur_the_race_clock_is_timed_in_loop_turns steps 54 frames on all 33 steps, as
        under every grid law up to 8 clocks, so it does not discriminate; the sound, with the
        instrument of radendur_a_duplicated_word_parks_the_sub_cpu (a control on the sub''s mixer
        entry 0x201060, a count watch on voice 4''s opcode word 0x2010ee, a cold boot with no input),
        does. CONTROL first, the driver at its patch: the mixer stops at 131937 entries, the sub
        dying about frame 420, history 2010D2 ILLEGAL then the bare rte. The fitted build: the mixer
        alive at frame 500 (156252 entries), stopped by 1500; 0x2010ee takes 0x1842 once, written at
        0x201222, and a stop there conditioned on that word lands on frame 644 on a second cold boot.
        Same mechanism, later. The fitted build''s error log also carries maincpu writes from 0x0e2c6c
        to the unmapped 0x0002ee..0x0002fe and a sub cpu read of the unmapped 0x4d0000, not
        explained. WHAT THIS DOES NOT ESTABLISH: that the board''s blitter has one constant pixel
        time; that both boards share one law; another shape of duration (a per-blit setup, another
        walk count).'
      wheelfir_no_screen_is_timed_in_loop_turns: 'NO SCREEN OF WHEELS & FIRE IS TIMED IN LOOP TURNS
        in the passes measured, unlike the earlier board (rltennis_the_chain_needs_a_held_level).
        MEASURED on 2026-10-03: an experiment build of wheelfir.cpp with IRQ1 as rltennis.cpp has it
        (a pulse at every blit fire and one per vblank, no held level, no drop at the arming) against
        the canonical held level, each from a cold boot through the same inputs: the golden pass to
        frame 1500, then coin, start twice, the pedal twice through car select and the map, and 1500
        frames of race with the pedal and button 1 held, logging per frame the blits fired, the
        whole-plane fills (the screen changes), the direct-write openings and the race clock
        (wheelfir_has_no_per_second_constant_in_its_vblank_handler). The screen changes fall on the
        same frames in both (10, 13, 945, 1507, 1509, 1515, 1801, 1802, 1803, 1804, 1806, 1950,
        1951, 1988 and the
        openings at 8, 910, 929, 1505, 1952, 1972), the race clock steps every 57 frames in both on
        the same frames (2218 to 3643), the four snapshots taken after the car select, the map, the
        race start and the race end are byte-identical pair by pair, and the blits per frame agree on 3665 of 3666 frames; the one that
        differs is frame 1502, two frames after the coin, with 0 blits held and 23 pulsed, and
        nothing after it moves. So in these passes the game is insensitive to the shape of IRQ1
        with instant blits: it paces itself by the vblank (its main loop waits on the flag the
        handler sets), and no counter these passes reached is a candidate to calibrate a blit duration
        (the service menu, the high scores and a linked game were not visited). Frame numbers here
        are read at the end of each frame, so an event late in a frame shows one above a census of
        the same pass (909 and 928 there). The driver keeps the held level, which is the board''s.'
      radendur_the_race_clock_is_timed_in_loop_turns: 'RADICAL ENDURO''S RACE CLOCK AND ITS SELECTION
        SCREEN ARE TIMED IN LOOP TURNS, unlike Wheels & Fire (wheelfir_no_screen_is_timed_in_loop_turns).
        MEASURED on 2026-10-03 with the same experiment on radendur.cpp (IRQ1 as a pulse at every
        blit fire and one per vblank, no held level) against the driver of the time, whose IRQ1 was
        held from reset and re-asserted at every fire and, unlike wheelfir.cpp, not dropped at the
        arming write (the game arms before every fire but the first two: 162464 arms, 162466
        fires). Each from a cold boot through the same inputs driven by the game''s state (the coin,
        START when the selection screen allows it, then the accelerator held), to frame 2400, frames
        read at the frame notifier. Held: the selection screen at frame 389, the race at 406, and
        the elapsed seconds (0x201e4a) stepping every 54 frames exactly, 33 steps from 669 to 2397.
        Pulsed: 749, 781, and steps every 108 to 116 frames (10 steps, 1318 to 2319). Blits fired
        162466 against 75125 over the whole run; the chain-opening path 0x4a0 ran 2377 times against
        1171. The clock advances by one call of its routine per pass of the main loop
        (radendur_has_no_per_second_constant_in_its_vblank_handler: 54 calls per displayed second),
        so held a pass took one frame, pulsed about two. At the driver''s 50.08 Hz field, 54 frames
        is 1.08 s per displayed second; the refresh itself is not established
        (wheelfir_clock_and_refresh_confirmed). What the clock shows per second depends on how long a
        frame''s blit chain takes, which makes it, read as seconds, a calibrator for a blit duration.
        THE DROP AT THE ARMING WRITE, MEASURED on 2026-10-09 with the same instrument (cold boot,
        coin at frame 200, START pulsed from 300, button 1 held from 300, 0x201e4a read per frame
        to frame 2400): without the drop, 33 steps from frame 625 to 2353, every one after the
        first 54 frames, 152683 arms and 152685 fires; with the drop, as radendur.cpp now has it,
        the SAME step frames one for one and the same arm and fire counts. The clock tells held
        from pulsed (above), and does not tell held-and-dropped from held.'
      wheelfir_the_three_models_compared: 'MEASURED over 400 frames from a cold boot, counting entries
        to the handler (0xe5274) and triggers (0xe52f0) with debugger controls. HOLD_LINE, the
        approximation the driver carried: 1856 entries, 839 triggers, 128114655 cycles, 21 of 21
        reference frames identical. ASSERT_LINE plus CLEAR_LINE on the arming write, which is the
        mechanism above: THE SAME 1856 and 839, THE SAME 128114655 cycles, the same final pc and
        registers, and the same 21 of 21. The faithful model is indistinguishable from the
        approximation at instruction level, which is what allows the mechanism to be written down
        instead of the workaround.'
    refuted:
    - read: a held level with no acknowledge at all, as the sibling prototype's driver models it
      symptom: 'the screen goes BLACK, one single colour and 0% of pixels painted, on 6 of the 7
        Wheels & Fire reference frames, while the three siblings are untouched: nothing in this game
        acks the blitter, so with the line permanently asserted the handler is re-entered forever
        and the mainline never runs'
video:
  window:
    width: 336
    height: 252
    state: confirmed
    evidence: 'the width comes from the screen rectangle the game keeps in RAM (0x20b4b8..0x20b4be =
      0, 0, 0x150, 0xff) and against which it clips its own sprites in software (wf_clip_dispatch and its eight variants). The
      HEIGHT comes from a sprite ANCHORED to the bottom edge, which is the only instrument that tells
      what the board DRAWS from what the monitor SHOWS: the portrait of the girl in the Wheels & Fire
      race'
    observed:
      radendur_252_rows_do_not_disturb_the_248_above_them: 'MEASURED on 2026-09-15 IN THE RACE, which
        is the half that was missing: the worry was that showing 252 rows instead of 248 moves the
        instant of the palette upload, because MAME''s vblank callback fires at the end of the
        VISIBLE area and that is where this driver pushes the sprite plane''s palette. The boot
        screen had already been cleared; the race, with the sprite palette actually changing, had
        not. Four arms captured at the race start through the repo''s own navigation harness, two
        refresh rates crossed with 248 and 252 rows: THE FIRST 248 ROWS ARE BYTE-IDENTICAL IN ALL
        FOUR, zero differing pixels of 83328, every pairing. So the coupling does not reach the
        picture above the cut, and the answer to the question that was blocking the change is NO.
        Controls, because six zeros are not a result on their own: in the same comparator two rows
        of one capture differ in 334 of 336 pixels, and the 248-row arm reproduces the blessed race
        golden byte for byte, which says the harness reached the scene the gate blesses.
        WHAT DOES DEPEND ON THE RATE is the content of the four extra rows themselves, and that is
        the coupling, now localised: compared row for row the two rates differ by 291, 184, 185 and
        199 pixels, but compared with ONE ROW of displacement they agree to 12, 12 and 7. Those rows
        are painted while the game''s own IRQ3 and RAMDAC upload are already running, so what they
        show depends on where in that chain the beam has got to, and that instant moves with the
        refresh. Counting 27 to 58 distinct colours in each of them did NOT show they were right:
        opened, they are a broken band that does not continue the track, and the cause was the vblank
        line, not the rows shown (radendur_vblank_starts_on_line_256).
        APPLIED: the driver now shows 252, which is what this measurement cleared it to do.'
      radendur_vblank_starts_on_line_256: 'MEASURED on 2026-10-03, radendur only, NUM_SCANLINES 248
        against 256 on otherwise identical builds, and APPLIED: 256. The board is the same as Wheels
        & Fire''s and no register moves the vblank line, so the game cannot choose it; at 248 the
        vblank fired inside the 252 rows the monitor shows. The five boot goldens: rows 0..247 are
        byte-identical in all of them. The race start differs only in rows 248..251 (1189 pixels):
        at 248 those four rows are a broken band painted while the vblank''s palette upload runs, at
        256 they continue the scene (verdict on the opened capture). The SATOR logo at
        frame 180 changes only the phase of its fade: same 99 colours, mean red 13.59 at 248
        against 13.37 and 13.75 at frames 180 and 181 of the 256 build. Controls: two scenes of
        one build differ in 25665 pixels, and two passes of the 256 build at frame 180 give zero.
        Sound does NOT decide it: the sub cpu parks on an illegal opcode by the same duplicated
        latch word in both (frame 539 with opcode 0x1842 at 248; at 256 opcode 0x024a at 0x2010d2,
        after 131937 mixer entries, about frame 420 by count, not stopped at), because that fault
        follows the blitter chain''s unmodelled timing (0x740000)'
      wheelfir_anchored_sprite: 'MEASURED on 2026-08-02 over the portrait''s 35 blits (page 15, source
        447,264): it slides in from below with its bottom edge PINNED to row 255 and its height
        growing (15, 19, 23... 71), and its RESTING position is top=178 with height=74, that is, a
        bottom edge on 251, where its silhouette ends with a finished black border. 251 is exactly H-1
        for H=252, and with 256 there were four rows of asphalt below it and it looked as if it were
        floating. Both things, the slide against 255 and the rest on 251, only fit together at 252'
      wheelfir_margin_that_gets_cleared: 'and it fits the MARGIN hypothesis already recorded from
        the width: the game declares 336 wide to draw and 340 to CLEAR, four columns of difference.
        Vertically it is four rows, the same number: the framebuffer has a border that gets cleaned
        and is not shown, and the game''s clip (y1 = 0xff) is a generous stop, not the monitor''s
        height'
      wheelfir_what_does_not_change: 'what the board SCANS is still 256 lines, which is a different
        property and is not touched: the game describes all 256 with per-line scroll, arms its raster
        IRQ up to 255 and the last rows carry image. What changes is how many of those lines come out
        of the monitor'
      wheelfir: the original driver showed 248 lines ("256 - 8", unexplained), four fewer still
      wheelfir_the_road_wraps_off_road_by_the_games_own_scroll: 'MEASURED on 2026-10-11, the road
        that comes back on the far side in the lowest rows of a curve. Reproduced on a
        deterministic drive (coin, start, full throttle, the wheel swept hard both ways, inputs keyed
        to the frame counter; frame 2004 of two cold boots came out pixel-identical): a detector for
        grass enclosed by road within one low row flagged 301 of 1751 captures, every one in rows
        246..251, all with the car off the road. Opened at frame 2004: the car on the grass left of
        the road, and in the last rows a strip of asphalt with its white edge line back at the
        left edge, past a band of grass. The plane holds the road as two triangle textures (lane
        lines at rows 22..122, kerbs at 155..255, read from a dump of the background bitmap): the
        widest rows span columns 0..398, so only columns 399..511 are grass. The raster walk
        (WF_RASTER_WALK 0xdc75e x / 0xdc764 y) wrote 89 lines in frame 2004, alternating the two
        textures line by line, the last ones at rows 104..115 with x low bytes 102..78. A 336-column
        window over a row that is 399 columns of road and 113 of grass shows both ends of the road
        once the camera sits far enough to one side, and the display has to wrap at 512 because
        the game itself parks the road band at scroll 500..511. So the wrap is the game''s scroll
        over the game''s textures, and the board shows it the same way: it only appears off the
        road, in the rows where the road is widest. No driver change'
      wheelfir_two_widths: 'MEASURED on 2026-07-30 by reading the 68000: the game writes TWO
        different widths into its own clipping rectangle (0x20b4bc). The two normal routines put
        0x150 = 336 (0x9b2c4 and 0x9bab6), and the SCREEN CLEAR routine puts 0x154 = 340 (0xe8eec).
        Four columns of difference, and the spurious frame seen on screen is TWO columns at x=0..1
        plus rows above and below. It fits the framebuffer having a margin that gets CLEARED but not
        SHOWN, which is what would have to be confirmed before deciding whether those columns are
        clipped or belong somewhere else'
    refuted:
    - read: the window is rows 8..255
      symptom: it cuts the image at the top
    - read: the window is 224 rows taken from the bottom
      symptom: it eats content and the duplicated road stays where it was
    - read: the window is 256 rows, because the game clips its sprites against y1 = 0xff and
        describes all 256 with per-line scroll
      symptom: it leaves FOUR rows of asphalt below the portrait of the girl in the race, which is a
        sprite anchored to the bottom edge and whose silhouette is finished off on row 251. The
        y1 = 0xff of the clip is the maximum of a byte, that is, a generous stop, while the x1 of the
        same rectangle is exact (0x150 = 336)
  planes:
  - height: 512
    name: background
    description: Composed with horizontal and vertical scroll, and the vertical one can change on every
      scanline. It carries sky, mountains, sea and road on the same surface, in bands.
  - height: 512
    pages: 2
    name: sprites
    description: 'Two pages of 256 lines. Bit 0x20 of word 8 selects the one being shown, which is
      the same one the game is drawing into that frame: it writes the bit and the sprite Y offset in the
      same routine.'
ports:
- address: 0x7c0000
  name: control_and_link
  common_to:
  - radendur
  - wheelfir
  - pwball
  - kongball
  description: 'The board''s control word, read and written by the main 68000 through a shadow
    in RAM (0x200448 in Wheels & Fire, 0x201c26 in Kong Ball). Three things share it: the serial
    EEPROM (bits 8-10 written, bit 15 read), the line counter''s enable (bit 13 written, with bit
    12 beside it) and the LINK to a second cabinet over the VGA connector, whose data travels in the
    low byte and whose receiver status is read on bit 13.'
  bits:
  - mask: 255
    name: link_data
    state: confirmed
    evidence: 'read from the 68000 of Wheels & Fire: the boot handshake writes 0xa5 to the low
      byte (0xa4858) and expects to read 0xa5 back from it (0xa47cc and 0xa47de, `cmp.b #$a5`);
      the receive routine takes a byte from it (0xa4d08, 0xa4dba) after waiting on bit 13 and
      hands it to the command protocol that compares against 0xf2, 0xf3, 0xf4... (0xa5052,
      0xa4cd8); the routine that runs 54 times per frame (0xa492c) writes 0xac, polls the status
      27 times, writes 0xff and polls 27 more, which is a periodic ping. Bytes written, read back
      and compared against a sync value are a link, and the board carries the connector for it
      ("VGA connector - Used to link 2 PCBs together") and a COMUNICATION page in its service
      menu (NUMBER OF PLAYERS, PLAYER NUMBER, WAITING FOR ANOTHER PLAYER)'
    meaning: 'the link''s data byte: written, the byte transmitted to the other cabinet; read,
      the byte received. The driver answers nothing on a read, which is a cabinet with no partner'
    refuted:
    - read: half the scanline width (0xac x 2 = 344, 0xff x 2 = 510), the original driver's guess
      symptom: the two values are written 27 polls apart by a routine with delay loops between
