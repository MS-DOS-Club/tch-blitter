note: Every GIF runs at REAL TIME, and here is the number that proves it rather than the assertion.
  The capture takes one image per EMULATED frame (a MAME frame notifier, not a recording of the window),
  so the -nothrottle it runs with only changes how long the host machine takes to produce them, not
  the interval between them. The GIF keeps one emulated frame of every `step` and holds each for step
  / refresh_hz seconds, refresh_hz being the rate the set's binary declares, that is, duration_s = emulated_frames
  / refresh_hz.
why_decimated: No browser plays a GIF at the board's full rate, and keeping every frame takes the gameplay
  GIFs over the size cap, so gif.sh keeps one frame in `step`. The price is jerky motion, which is easy
  to mistake for accelerated speed; that is why it is documented, so the doubt is not resolved twice.
cap_mb: 4
