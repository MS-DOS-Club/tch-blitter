<?xml version="1.0" encoding="UTF-8"?>
<!-- Wheels & Fire on a game controller: the right trigger alone is full throttle (the pedal and
     button 1 together, which the game needs to pass the second gear's ceiling) and the first face
     button is the turbo. A newseq replaces the driver's whole sequence, so each keyboard key travels
     with the pad's. MAME's SDL, macOS and XInput input modules all name the right trigger SLIDER2;
     the code is the input module's name for it, which is why this lives here and not in the driver. -->
<mameconfig version="10">
    <system name="wheelfir">
        <input>
            <port tag=":P1" type="P1_BUTTON1" mask="16" defvalue="16">
                <newseq type="standard">KEYCODE_LSHIFT OR JOYCODE_1_SLIDER2_NEG_SWITCH</newseq>
            </port>
            <port tag=":P1" type="P1_BUTTON3" mask="64" defvalue="64">
                <newseq type="standard">KEYCODE_SPACE OR JOYCODE_1_BUTTON1</newseq>
            </port>
        </input>
    </system>
</mameconfig>
