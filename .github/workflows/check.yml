name: check

# What a pull request can break without MAME or the romsets: the Python and the shell. The
# documents check reads the drivers' ROM_START (`upstream/`), and the goldens and save states need
# a MAME build and the dumps, so those stay in a maintainer's `make check`.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0

      # The release a maintainer runs, not the distribution's: shellcheck versions disagree on what
      # they flag, and a CI that judges by another version goes red on code that is clean locally.
      # A download that never answers looks like a slow one, so the step has its own bound, and the
      # version check proves the right tool is there rather than letting `make lint` find out.
      - name: Install shellcheck
        timeout-minutes: 3
        env:
          SHELLCHECK_VERSION: v0.11.0
        run: |
          url="https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          curl -fsSL --retry 3 --max-time 60 "$url" | tar -xJ -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/shellcheck-${SHELLCHECK_VERSION}" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/shellcheck-${SHELLCHECK_VERSION}/shellcheck" --version | grep -Fx "version: ${SHELLCHECK_VERSION#v}"

      - name: Lint
        run: make lint

      - name: Test
        run: make test
